[package]
publish.workspace = true
name = "harw-sandbox"
description = "Linux sandbox backends for HARW using Bubblewrap with network scope and egress control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Drop guard `SandboxChild` (W5 N-SBX) logs kill/wait errors.
tracing = { workspace = true }
harw-authority = { path = "../harw-authority" }
# W0B-04: WHATWG URL parsing for `egress::EgressUrl` — the same parser as
# in reqwest, so that the checked and the connected host never diverge.
url = "2.5.8"
# `SandboxChild::wait_or_cancel` races non-blocking `try_wait` polling
# against `harw_types::cancel::CancelToken` (plan "Wave 3 — 3c", follow-up task,
# analogous to shell.exec in harw-tool-shell). Only `CancelToken` itself is
# needed, not its sync machinery, hence still no authority types
# re-exported (see the `harw-sandbox/src/lib.rs` docs).
harw-types = { path = "../harw-types" }
# Only `time` for `tokio::time::sleep` in the poll interval; `tokio::select!` is
# featureless. `process`/`rt` are not needed here, since `SandboxChild`
# still holds `std::process::Child` (not `tokio::process::Child`).
# Version/feature style as in harw-tool-shell/Cargo.toml.
tokio = { version = "1", features = ["macros", "time"] }

[dev-dependencies]
# `#[tokio::test]` for the new `wait_or_cancel` tests additionally needs
# `rt` + `macros` (identical to harw-tool-shell/Cargo.toml).
tokio = { version = "1", features = ["time", "rt", "macros"] }

[lints]
workspace = true
