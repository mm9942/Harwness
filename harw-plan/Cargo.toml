[package]
publish.workspace = true
name = "harw-plan"
description = "Planning tool: typed nodes, in-memory and file stores, validation, sync API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-macros = { path = "../harw-macros" }
harw-types = { path = "../harw-types" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.53", features = ["serde", "serde-well-known", "formatting", "parsing"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
