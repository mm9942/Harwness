[package]
name = "harw-dod-fixtures"
description = "Fixture harness and test generator for sensor implementations"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Access vocabulary: Capability, ReadScope, SensorError, SensorHandle.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary and the one `trait Sensor` that every check calls.
harw-dod-signals = { path = "../harw-dod-signals" }
# The one filesystem seam: `capture()` reads a sensor's source tree
# exclusively through it, never through direct `std::fs` (see capture.rs).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` for the fixed test handle (see `FIXTURE_SENSOR_ID`).
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` for `error.rs`.
harw-macros = { path = "../../../harw-macros" }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
# Not only for tests: `harness::assert_content_freedom` and
# `harness::assert_scope_tightness` build a fresh temporary directory on
# every call, in ordinary (not `#[cfg(test)]`-gated) library code —
# hence a regular dependency, not a dev-dependency.
tempfile = { workspace = true }

[lints]
workspace = true
