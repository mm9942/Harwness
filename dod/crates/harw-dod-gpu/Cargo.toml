[package]
name = "harw-dod-gpu"
description = "GPU metrics from sysfs: utilization, memory, temperature"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Access vocabulary: Capability, ReadScope, SensorError, SensorHandle<Bound>.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary (HostSample) and the one `trait Sensor` that this crate
# implements.
harw-dod-signals = { path = "../harw-dod-signals" }
# The only filesystem seam: `parse_i64`, `parse_u64`, `glob::glob`. No
# `std::fs` in this crate (see the `src/sensor.rs` module docs).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` for the sensor handle.
harw-types = { path = "../../../harw-types" }
# Mandatory dependency of every sensor crate per the AW2-07 brief. Currently
# unused: `Sensor` is implemented by hand instead of via
# `#[derive(harw_macros::SensorSource)]` (rationale: `src/lib.rs` module docs,
# section "Why no `#[derive(SensorSource)]`" — multiple metrics with a
# map label per match and a unit conversion exceed what the macro
# supports today), and `metrics!` would additionally need `harw-observe`, which is not
# within the dependency scope of this node. Model for this pattern
# (mandatory, currently unused dependency with an explanatory comment):
# `harw-dod-thermal/Cargo.toml`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
# `sensor_suite!` — the inherited fixture test suite (six mandatory checks
# plus an optional adversarial check).
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
