[package]
name = "harw-dod-authlog"
description = "Authentication log interface for Linux login events with pluggable backends."
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-dod-cap = { path = "../harw-dod-cap" }
harw-dod-netlink = { path = "../harw-dod-netlink" }
harw-dod-signals = { path = "../harw-dod-signals" }
harw-macros = { path = "../../../harw-macros" }
# `SensorId` for `AuthlogSensor` (maps `AuthRecord` to `SecurityEvent`,
# see src/sensor.rs) and for the doc examples.
harw-types = { path = "../../../harw-types" }
jiff = { workspace = true }

[dev-dependencies]
# `harw-dod-fixtures` is now (node AW2-05) a real crate with
# `sensor_suite!`, no longer the scaffold that existed at the start of this
# node. It still does not apply meaningfully to `AuthlogSensor`:
# `sensor_suite!` requires `From<SensorHandle<Bound>>` (a handle in,
# a sensor out) — `AuthlogSensor` additionally needs a
# `Box<dyn AuthBackend>`, which cannot be derived from a bare handle.
# And even the underlying `harness::assert_*` functions, which are
# generic over `F: Fn(SensorHandle<Bound>) -> S`, assume a
# `ReadScope`/`tree/` fixture model that `AuthlogSensor` never touches
# (see src/sensor.rs for the full rationale). Included as a path dependency
# anyway, as the work order demands, so that a future node can use it without
# a Cargo.toml change.
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
