[package]
publish.workspace = true
name = "harw-dod-warden"
description = "Executes security actions on cgroups and processes: freeze, isolate, terminate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Wire vocabulary and the already verifiable binding/admissibility logic
# (`AuthorizationProof::verify`, `WardenAction::is_admissible_from`) — see the
# lib.rs module docs, section "Dependency budget".
harw-dod-warden-proto = { path = "../harw-dod-warden-proto" }
# `CgroupId`/`FindingId` directly: the warden reads cgroup identifiers from
# WardenAction variants in order to hand them to execution traits, and takes
# `finding` as an independent context parameter (see warden.rs).
# Already brought in transitively in full by `harw-dod-warden-proto` —
# not a single new leaf crate.
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` for `error.rs` — as with the
# proto crate, exclusively for that, never for `warden_actions!`. Likewise
# already present transitively.
harw-macros = { path = "../../../harw-macros" }

[dev-dependencies]
# Only for the test "unknown field in the request -> rejected" (round trip
# through the actual wire deserialization of
# `harw_dod_warden_proto::WardenActionRequest`) and for the
# response content-freeness check (inspecting the serialized text). Pure
# dev dependency, does not count against the runtime dependency budget of the
# warden binary.
serde_json = { workspace = true }
# Only for the filesystem tests of `CgroupV2Executor` (tempdir instead of
# the real `/sys/fs/cgroup`). Pure dev dependency.
tempfile = { workspace = true }
# Only for tests/doctests that build an `AuthorizationProof` (requires
# a `jiff::Timestamp`, see `harw-dod-warden-proto`). Pure
# dev dependency — this crate's runtime code does not read the time anyway.
jiff = { workspace = true }

[lints]
workspace = true
