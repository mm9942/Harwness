[package]
name = "harw-dod-memory"
description = "Memory pressure sensor reading MemTotal, MemFree, MemAvailable, SwapTotal, SwapFree from /proc/meminfo"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Access vocabulary: Capability, ReadScope, SensorHandle, SensorError.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary (HostSample) and the one `trait Sensor` this sensor
# implements.
harw-dod-signals = { path = "../harw-dod-signals" }
# The one filesystem seam: `read_key_values` reads `/proc/meminfo`, never
# `std::fs` directly (see the src/lib.rs module docs).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` for `SensorHandle`.
harw-types = { path = "../../../harw-types" }
# Mandatory dependency of every sensor crate per the AW2-08/AW2-09 spec.
# However, `#[derive(harw_macros::SensorSource)]` itself carries exactly one
# field via exactly one glob-addressed source with exactly one scalar value
# per match — `/proc/meminfo` is a file with many `key: value` lines from
# which several selected fields are reported with unit conversion, so the
# macro does not fit (see the src/lib.rs module docs, section
# "Why no `#[derive(SensorSource)]`"). Currently unused, analogous to the
# unused `harw-observe` dependency in `harw-dod-signals/Cargo.toml`
# and to the identical situation in `harw-dod-cpu/Cargo.toml`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
