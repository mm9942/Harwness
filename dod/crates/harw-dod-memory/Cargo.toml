[package]
name = "harw-dod-memory"
description = "Memory pressure sensor reading MemTotal, MemFree, MemAvailable, SwapTotal, SwapFree from /proc/meminfo"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Zugriffsvokabular: Capability, ReadScope, SensorHandle, SensorError.
harw-dod-cap = { path = "../harw-dod-cap" }
# Datenvokabular (HostSample) und der eine `trait Sensor`, den dieser Sensor
# implementiert.
harw-dod-signals = { path = "../harw-dod-signals" }
# Die eine Dateisystem-Naht: `read_key_values` liest `/proc/meminfo`, nie
# direktes `std::fs` (siehe src/lib.rs-Moduldoku).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` für `SensorHandle`.
harw-types = { path = "../../../harw-types" }
# Laut AW2-08/AW2-09-Vorgabe verbindliche Abhängigkeit jeder Sensor-Crate.
# `#[derive(harw_macros::SensorSource)]` selbst trägt aber genau ein Feld
# über genau eine glob-adressierte Quelle mit genau einem Skalarwert je
# Treffer — `/proc/meminfo` ist eine Datei mit vielen `Schlüssel: Wert`-Zeilen,
# aus denen mehrere ausgewählte Felder mit Einheitenumrechnung gemeldet
# werden, dafür passt das Makro nicht (siehe src/lib.rs-Moduldoku, Abschnitt
# „Warum kein `#[derive(SensorSource)]`"). Aktuell ungenutzt, analog zur
# unbenutzten `harw-observe`-Abhängigkeit in `harw-dod-signals/Cargo.toml`
# und zur identischen Situation in `harw-dod-cpu/Cargo.toml`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
harw-test-support = { path = "../../../harw-test-support" }
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
