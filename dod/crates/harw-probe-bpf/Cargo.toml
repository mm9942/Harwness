[package]
name = "harw-probe-bpf"
description = "Privileged eBPF probe monitoring process execution and network connections, push-only event forwarding"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../../../harw-authority" }
# eBPF vocabulary: `BpfLoader` trait, `BpfProgramSpec`/`BpfProgramKind`/
# `BpfProgramSource`, `BpfHandle`, `RawBpfEvent`, `BpfError`,
# `fixture::FixtureBpfLoader` (part of the regular API, for own tests without
# a kernel, without privileges, without an eBPF toolchain).
harw-dod-bpf = { path = "../harw-dod-bpf" }
# The sole system contract for profile selection and configuration digest.
# The probe accepts neither an implicit home lookup nor its own CIDR or
# scope flags; both are derived from this contract.
harw-dod-config = { path = "../harw-dod-config" }
# Process start: `procmon_contracts` and the v1 wire parser for exec/exit.
harw-dod-procmon = { path = "../harw-dod-procmon" }
# Connections: `flow_contracts`, the v1 TCP parser and the reporting rule
# `to_security_event`.
harw-dod-flow = { path = "../harw-dod-flow" }
# Access vocabulary: `Capability`, `CapabilityClass`, `ReadScope`,
# `SensorHandle`, `SensorError`, `Permanence`.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data/trait vocabulary: `trait Sensor`, `SensorReading`, `SecurityEvent`.
# Needed for `sensors::UnavailableSensor` and `collect`.
harw-dod-signals = { path = "../harw-dod-signals" }
# `NetworkScope`/`EgressTarget` — the reporting-rule input that
# `harw_dod_flow::observe` requires. Permitted edge direction: `harw-sandbox`
# itself depends on nothing from the `harw-dod-*` subtree (only `harw-types`,
# `ipnet`, `serde`), so this dependency closes no cycle — the same check
# that `harw-dod-flow/Cargo.toml` already documents for itself.
harw-sandbox = { path = "../../../harw-sandbox" }
# `SensorId`.
harw-types = { path = "../../../harw-types" }
jiff = { workspace = true }
tracing = { workspace = true }
# Version identical to `harw-sentinel`/`harw-probe-fs` — one sink for
# `tracing`, no second choice per binary.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# `--log` grammar; version identical to `harw-sentinel`/`harw-probe-fs`.
clap = { version = "4.6.1", features = ["derive"] }
# `completions` subcommand (script output and managed installation).
harw-completions = { path = "../../../harw-completions", features = ["clap-args"] }
# Safe `SOCK_SEQPACKET` Unix socket without `unsafe` (`net` feature) — the
# same variant that `harw-sentinel::ipc` uses for the receiving side of this
# exact socket and `harw-probe-fs::sink` uses for the sending side of its own
# socket to the same sentinel.
rustix = { workspace = true, features = ["net"] }
# Safe Landlock binding. **Not** available via `[workspace.dependencies]`
# (so far unused there); direct version spec like the other single/multiple
# consumers of this crate in the workspace (e.g. `tikv-jemallocator` only in
# `harw-cli/Cargo.toml`). Version 0.4.7 taken over identically from
# `harw-sentinel/Cargo.toml` and `harw-probe-fs/Cargo.toml` (looked up there
# via `docs.rs/crate/landlock`) — `cargo add` could not run here, see the
# `src/landlock.rs` module docs.
landlock = "0.4.7"
# Wire encoding for `harw_dod_signals::SecurityEvent` on the send path to the
# sentinel — the same contract that `harw-sentinel::ipc` assumes on the
# receiving side (`#[serde(deny_unknown_fields)]`, kebab-case `EventKind` tag).
serde_json = { workspace = true }
ipnet = { workspace = true }
# Parsing of `--egress-allow-cidr` into `harw_sandbox::EgressTarget::Cidr`.
# The same variant that `harw-sandbox` itself and `harw-dod-flow` (as a
# dev-dependency, for its own test fixtures) use.

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
