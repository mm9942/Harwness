[package]
name = "harw-probe-bpf"
description = "Privileged eBPF probe monitoring process execution and network connections, push-only event forwarding"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../../../harw-authority" }
# eBPF-Vokabular: `BpfLoader`-Trait, `BpfProgramSpec`/`BpfProgramKind`/
# `BpfProgramSource`, `BpfHandle`, `RawBpfEvent`, `BpfError`,
# `fixture::FixtureBpfLoader` (Teil der normalen API, für eigene Tests ohne
# Kernel, ohne Berechtigung, ohne eBPF-Toolchain).
harw-dod-bpf = { path = "../harw-dod-bpf" }
# Der alleinige Systemvertrag fuer Profilwahl und Konfigurationsdigest.
# Die Probe akzeptiert weder eine implizite Home-Suche noch eigene CIDR- oder
# Scope-Flags; beides wird aus diesem Vertrag abgeleitet.
harw-dod-config = { path = "../harw-dod-config" }
# Prozessstart: `procmon_contracts` und der v1-Wire-Parser für Exec/Exit.
harw-dod-procmon = { path = "../harw-dod-procmon" }
# Verbindungen: `flow_contracts`, der v1-TCP-Parser und die Melderegel
# `to_security_event`.
harw-dod-flow = { path = "../harw-dod-flow" }
# Zugriffsvokabular: `Capability`, `CapabilityClass`, `ReadScope`,
# `SensorHandle`, `SensorError`, `Permanence`.
harw-dod-cap = { path = "../harw-dod-cap" }
# Daten-/Trait-Vokabular: `trait Sensor`, `SensorReading`, `SecurityEvent`.
# Gebraucht für `sensors::UnavailableSensor` und `collect`.
harw-dod-signals = { path = "../harw-dod-signals" }
# `NetworkScope`/`EgressTarget` — die Melderegel-Eingabe, die
# `harw_dod_flow::observe` verlangt. Zulässige Kantenrichtung: `harw-sandbox`
# hängt selbst an nichts aus dem `harw-dod-*`-Teilbaum (nur `harw-types`,
# `ipnet`, `serde`), diese Abhängigkeit schließt also keinen Zyklus — dieselbe
# Prüfung, die `harw-dod-flow/Cargo.toml` bereits für sich selbst dokumentiert.
harw-sandbox = { path = "../../../harw-sandbox" }
# `SensorId`.
harw-types = { path = "../../../harw-types" }
jiff = { workspace = true }
tracing = { workspace = true }
# Version identisch zu `harw-sentinel`/`harw-probe-fs` — ein Sink für
# `tracing`, keine Zweitwahl je Binary.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# `--log`-Grammatik; Version identisch zu `harw-sentinel`/`harw-probe-fs`.
clap = { version = "4.6.1", features = ["derive"] }
# `completions`-Unterbefehl (Skriptausgabe und verwaltete Installation).
harw-completions = { path = "../../../harw-completions", features = ["clap-args"] }
# Sicherer `SOCK_SEQPACKET`-Unix-Socket ohne `unsafe` (`net`-Feature) — dieselbe
# Fassung, die `harw-sentinel::ipc` für die Empfangsseite dieses exakten
# Sockets nutzt und `harw-probe-fs::sink` für die Sendeseite ihres eigenen
# Sockets zum selben Sentinel.
rustix = { workspace = true, features = ["net"] }
# Sichere Landlock-Bindung. **Nicht** über `[workspace.dependencies]`
# verfügbar (dort bislang ungenutzt); direkte Versionsangabe wie bei den
# anderen Einzel-/Mehrfachkonsumenten dieser Crate im Workspace (z. B.
# `tikv-jemallocator` nur in `harw-cli/Cargo.toml`). Version 0.4.7 identisch
# zu `harw-sentinel/Cargo.toml` und `harw-probe-fs/Cargo.toml` übernommen
# (dort über `docs.rs/crate/landlock` nachgeschlagen) — `cargo add` konnte
# hier nicht laufen, siehe `src/landlock.rs`-Moduldoku.
landlock = "0.4.7"
# Wire-Kodierung für `harw_dod_signals::SecurityEvent` auf dem Sendeweg zum
# Sentinel — derselbe Vertrag, den `harw-sentinel::ipc` auf der Empfangsseite
# voraussetzt (`#[serde(deny_unknown_fields)]`, kebab-case `EventKind`-Tag).
serde_json = { workspace = true }
ipnet = { workspace = true }
# Parsen von `--egress-allow-cidr` in `harw_sandbox::EgressTarget::Cidr`.
# Dieselbe Fassung, die `harw-sandbox` selbst und `harw-dod-flow` (als
# Dev-Dependency, für seine eigenen Testfixturen) verwenden.

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
