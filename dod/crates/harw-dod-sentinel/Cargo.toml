[package]
name = "harw-dod-sentinel"
description = "Collects sensor readings, manages sensor health degradation, and buffers evidence."
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../../../harw-authority" }
# Identifiers (`SensorId`) for health state, metric labels, and evidence.
harw-types = { path = "../../../harw-types" }
# `SensorHandle<Bound>`, `SensorError`, `Permanence` — the access vocabulary
# through which this crate decides whether an error is retryable. Deliberately
# **no** dependency on any of the eleven sensor crates (see the `//!` docs of
# `lib.rs`, section "No parsing logic").
harw-dod-cap = { path = "../harw-dod-cap" }
# `trait Sensor`, `SensorReading`, `HostSample`, `SecurityEvent`, `EventKind`,
# `SecurityEvidence` — the data vocabulary that this crate fetches, buffers,
# and freezes without interpreting it itself.
harw-dod-signals = { path = "../harw-dod-signals" }
# `TelemetrySink`, `MetricKey`, `FieldName`/`FieldValue` for the metrics
# declared in `src/metrics.rs`.
harw-observe = { path = "../../../harw-observe" }
# `#[derive(harw_macros::HarwError)]` (`error.rs`) and `harw_macros::metrics!`
# / `harw_macros::field!` (`metrics.rs`).
harw-macros = { path = "../../../harw-macros" }
# Injected time (`jiff::Timestamp`) for the state machine and the ring buffer;
# this crate never reads the system clock itself (see the `//!` docs of `lib.rs`).
jiff = { workspace = true }
# `FindingSpool` (W3 C-FIND): records from harw-dod-rules, symlink-safe writing/reading.
harw-dod-rules = { path = "../harw-dod-rules" }
harw-fsutil = { path = "../../../harw-fsutil" }
serde_json = { workspace = true }

[dev-dependencies]
harw-sandbox = { path = "../../../harw-sandbox" }
tempfile = { workspace = true }
# Only for `spool.rs` tests: `correlate_advisories` is the only public
# way to a `Finding<RuleChecked>` outside `harw-dod-rules` and takes
# `LockedPackage`s or `semver::VersionReq` ranges.
harw-code-graph = { path = "../../../harw-code-graph" }
semver = { workspace = true }
# Only for `error.rs` tests: constructs a real `serde_json::Error` in order to
# test the `#[from]` path of `SentinelError::Evidence` without having to
# trigger the error path of `SecurityEvidence::capture` itself (which,
# per the `harw_dod_signals::error` module docs, is practically unreachable).
serde_json = { workspace = true }

[lints]
workspace = true
