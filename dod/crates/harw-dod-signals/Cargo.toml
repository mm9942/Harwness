[package]
name = "harw-dod-signals"
description = "Data vocabulary for host security observation: samples, events, evidence, sensors, verdicts"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Vocabulary foundation: identifiers (`SensorId`, `CgroupId`) and `ContentDigest`.
harw-types = { path = "../../../harw-types" }
# `trait Sensor` (defined here) names `SensorHandle<Bound>` and
# `SensorError` from the access vocabulary (contract F, node AW0-06).
harw-dod-cap = { path = "../harw-dod-cap" }
# Needed by eleven sensor crates, not by this vocabulary itself; per the
# work order nonetheless a mandatory dependency of this crate (contract,
# section AW0-07). Currently unused in `pub` signatures.
harw-observe = { path = "../../../harw-observe" }
# `#[derive(harw_macros::HarwError)]` for `error.rs`.
harw-macros = { path = "../../../harw-macros" }
serde = { workspace = true }
jiff = { workspace = true }
# Carries the formation rule for `SecurityEvidence::digest` (canonical
# serialization of the contained samples and events, see `evidence.rs`).
# Hence a regular dependency entry and not a mere dev-dependency:
# digest formation runs at runtime, not only in tests.
serde_json = { workspace = true }

[lints]
workspace = true
