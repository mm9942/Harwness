[package]
name = "harw-dod-escalate"
description = "Establishes escalation stages for triaged findings and authorizes actions through verdict-based rules with audit persistence."
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../../../harw-authority" }
# `ApprovalActor` (who authorized) — the same identifier that
# `AuthorizationProof::authorized_by` already requires, instead of inventing
# a second identity representation.
harw-types = { path = "../../../harw-types" }
# `TriageSubmission` (W3 C-WPROTO) is serializable.
serde = { workspace = true }
# `#[derive(harw_macros::HarwError)]` for `error.rs`. No `warden_actions!` —
# this crate produces no action types; it only authorizes ones already
# declared by `harw-dod-warden-proto`.
harw-macros = { path = "../../../harw-macros" }
# `Finding<Triaged>`, `Finding<RuleChecked>`, `Verdict`, `triage` — only this
# crate can establish the entitlement to hold a `Finding<Triaged>` (see the
# `lib.rs` module docs).
harw-dod-rules = { path = "../harw-dod-rules" }
# `Severity`/`Hardness` — fields of `Finding<S>` on which `Ladder::stage_for`
# evaluates the escalation rule. No additional weight class: `harw-dod-rules`
# already depends on this crate.
harw-dod-signals = { path = "../harw-dod-signals" }
# `ProposedAction`/`WardenAction`/`AuthorizationProof`/`EscalationStage`/
# `WardenActionRequest` — the wire vocabulary to the warden. Written by hand
# there, not via `warden_actions!` (see its `lib.rs` module docs, section
# "Check 2: harw-tools") — this crate therefore does not pull in
# `harw-tools`.
harw-dod-warden-proto = { path = "../harw-dod-warden-proto" }
# `FreezeStore`/`Freeze`/`FreezeResolution` (AW5-05) — this crate is the
# documented caller of `FreezeStore::reconcile_expired` at startup (see the
# `harw-session-store/src/freeze.rs` module docs, section "Expiry").
harw-session-store = { path = "../../../harw-session-store" }
jiff = { workspace = true }

[dev-dependencies]
# Tests only: builds a `serde_json::Error` to trigger the `#[from]` path of
# `EscalateError::ActionEncoding` (wraps `WardenProtoError`) without a real
# digest-formation failure.
serde_json = { workspace = true }
# Tests only: builds a real `Finding<Triaged>` via `EgressFlowRule` instead
# of bypassing a private constructor — `harw-dod-rules` itself uses the same
# crate for the same pattern in its own doctests.
harw-sandbox = { path = "../../../harw-sandbox" }
# Tests only: unlocks `triaged_finding_for_test` — the `Ladder` test fixtures
# need `Severity`/`Hardness` combinations (e.g. `Severity::Critical`) that no
# real rule produces. Because of `resolver = "2"` (workspace root) it is
# active only for this crate's test targets, never in the production build
# (see `harw-dod-rules`' `Cargo.toml` and the `src/finding.rs` module docs).
harw-dod-rules = { path = "../harw-dod-rules", features = ["test-support"] }
# Tests only: a `FreezeStore` needs a root directory; `tempfile` is the same
# crate that `harw-session-store` itself uses for its `FreezeStore`
# doctests/tests.
tempfile = { workspace = true }

[lints]
workspace = true
