[package]
publish.workspace = true
name = "harw-dod-netlink"
description = "Netlink access backend for audit record parsing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-dod-cap = { path = "../harw-dod-cap" }
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

# Syscalls without libc. Only the binding part (`src/socket.rs`, under
# `#[cfg(target_os = "linux")]`) uses them; the shaping part (tokenization,
# `parse_record`, netlink frame decomposition) is pure code on bytes/strings
# without any system dependency. A full-fledged netlink library (e.g.
# `neli`) would be disproportionate for the scope of this crate — open a
# socket, read lines; `rustix` already provides `socket`/`bind`/`recv` and the
# `AUDIT` netlink constants safely (no `unsafe` on the caller side)
# and is available as a workspace dependency anyway.
rustix = { workspace = true, features = ["net"] }

[lints]
workspace = true
