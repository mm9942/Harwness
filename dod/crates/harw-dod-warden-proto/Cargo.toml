[package]
name = "harw-dod-warden-proto"
description = "Wire protocol for escalation manager and warden: actions, authorization, requests, responses, denials, stages"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Vocabulary foundation: `FindingId`, `CgroupId`, `ApprovalActor`,
# `ContentDigest` (see lib.rs module docs, section "Prüfung 2").
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` for `error.rs`. Deliberately NOT
# `harw_macros::warden_actions!` — see lib.rs module docs, section
# "Prüfung 2: harw-tools".
harw-macros = { path = "../../../harw-macros" }
serde = { workspace = true }
# FINDING (gate run, `warden-no-c-build`/`warden-dependency-budget`): `jiff`
# pulls `defmt` (along with `defmt-macros`, `defmt-parser`) transitively in
# `Cargo.lock` into the runtime closure of `harw-warden` — with `jiff` 0.2.32,
# `defmt` is a purely optional `dep:defmt` behind the feature `defmt`
# (see `[features] defmt = ["dep:defmt"]` in the pinned source under
# `~/.cargo/registry/src/.../jiff-0.2.32/Cargo.toml`), and likewise `log`
# (feature `logging = ["dep:log"]`) and `jiff-static` (feature `static`).
# Checked, no feature disabled: **not a single** `Cargo.toml` in this
# workspace — neither here nor in any of the roughly fifty other
# `jiff = { workspace = true }` sites, neither under `[dependencies]` nor
# under `[dev-dependencies]` — requests `defmt`, `logging`, or `static`;
# the workspace root sets only `features = ["serde"]` for `jiff` (see the root
# `Cargo.toml`, `[workspace.dependencies]`). `jiff`'s own `default` feature
# set contains none of the three. So this finding **cannot** be eliminated by
# deselecting a feature — there is none active here. The most likely reason:
# `Cargo.lock` is stale at this point — the root `Cargo.toml` itself documents
# the preceding refactoring ("`jiff` in five spellings and three versions in
# the tree" before the consolidation to `workspace = true`); presumably one of
# the old spellings requested `logging`/`defmt`/`static`, and the
# consolidation removed those feature lines without any `cargo` run having
# re-resolved `Cargo.lock` since. Per the assignment, this file may not run
# `cargo` and may not write `Cargo.lock` — the fix is
# `cargo update -p jiff --precise 0.2.32` (or a full
# `cargo build --workspace --all-targets`), then re-run both gates.
jiff = { workspace = true }
# Carries the binding rule for `AuthorizationProof::bound_action`
# (canonical serialization of `WardenAction` before the digest, see
# `action.rs`). Hence a regular dependency entry and not a mere
# dev-dependency: digest construction runs at runtime, not only in tests.
# No additional weight for the warden dependency budget (check 2):
# `harw-types` already pulls in `serde_json`.
serde_json = { workspace = true }
# Proof v2 (C-WPROTO): keyed BLAKE3 for the MAC, constant-time `blake3::Hash`
# comparison. Already in the tree via `harw-types` — no additional weight for
# the warden dependency budget.
blake3 = { workspace = true }

[lints]
workspace = true
