[package]
name = "harw-dod-cgroup"
description = "cgroup-v2 sensor reading memory, process, and CPU counters from container control groups"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Access vocabulary: Capability, ReadScope, SensorHandle, SensorError.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary and the one `trait Sensor` that this sensor implements.
harw-dod-signals = { path = "../harw-dod-signals" }
# The one filesystem seam: `parse_u64`, `read_first_line`, `read_key_values`
# and `glob::glob` read the cgroup-v2 control files, never direct
# `std::fs` (see the src/lib.rs module docs).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` for `SensorHandle`.
harw-types = { path = "../../../harw-types" }
# Mandatory dependency of every sensor crate per work order AW2-13.
# `#[derive(harw_macros::SensorSource)]` itself supports exactly one
# glob-addressed field with exactly one metric name fixed at compile time
# per match (see `harw-macros/src/sensor_source.rs`). A cgroup needs
# four different control files with four different metric names per
# match and one label per match (the cgroup name) — the macro does not
# fit that (see the src/lib.rs module docs, section "Why no
# `#[derive(SensorSource)]`"). Currently unused, analogous to the unused
# `harw-macros` dependency in `harw-dod-cpu/Cargo.toml` and
# `harw-dod-netcounters/Cargo.toml`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
# `sensor_suite!` — the inherited fixture test suite (eight checks).
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }
# Exclusively for the crate's own additional test "no process name/no
# command line in the serialized result" (see the `src/sensor.rs` tests):
# `HostSample` implements `serde::Serialize`, but
# `harw_dod_fixtures::sensor_suite!` does not serialize publicly — this
# one additional, crate-specific test therefore serializes itself, analogous to
# `harw-dod-netcounters/Cargo.toml`.
serde_json = { workspace = true }

[lints]
workspace = true
