[package]
publish.workspace = true
name = "harw-warden"
description = "Privileged systemd socket binary for process isolation and enforcement"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The enforcer itself: `Warden`, `WardenOutcome`, `AuditSink`,
# `CgroupFreezer`/`CgroupReleaser`/`NetworkIsolator`/`ProcessTreeKiller`,
# `CgroupV2Executor`. This binary turns the library into a running
# process (node AW5-04b) — see the `src/main.rs` module docs.
harw-dod-warden = { path = "../harw-dod-warden" }
# Wire vocabulary: `WardenActionRequest`, `WardenResponse`,
# `AuthorizationProof`. `harw-dod-warden` does NOT re-export these types
# itself (see its `lib.rs`, `pub use` list) — this binary needs them
# directly in order to deserialize a received wire message at all and
# pass it to `Warden::handle`.
harw-dod-warden-proto = { path = "../harw-dod-warden-proto" }
# `FindingId` for this binary's own envelope (see the
# `src/protocol.rs` module docs): `WardenActionRequest` deliberately carries no
# `finding` field of its own (see the `harw_dod_warden::warden` module docs,
# section "The K43 trap") — this binary must therefore transport it
# itself.
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` for `src/error.rs` and `src/ipc.rs`.
harw-macros = { path = "../../../harw-macros" }
# `harw-warden completions <shell> [--install|--uninstall]`.
harw-completions = { path = "../../../harw-completions", features = ["clap-args"] }
# Wire encoding of the own envelope (`src/protocol.rs`) and of
# `WardenResponse`. Already present transitively through the chain above
# (`harw-dod-warden-proto` itself depends on `serde`/`serde_json`) — no
# new leaf crate.
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Version identical to `harw-sentinel`/`harw-probe-fs` — one sink for
# `tracing`, no second choice per binary.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# `--log` grammar; version identical to the sibling binaries.
clap = { version = "4.6.1", features = ["derive"] }
# `accept`, `sockopt::socket_peercred`, `recv`, `send` for
# SOCK_SEQPACKET reception on the descriptor passed by systemd —
# the same pinned version as `harw-sentinel`/`harw-probe-fs` (`net`
# feature). Every call used here is checked against the actually pinned
# source (`rustix-1.1.4/src/net/`), not against docs.rs or from
# memory — see the `src/ipc.rs` module docs.
rustix = { workspace = true, features = ["net"] }
# Safe Landlock binding, identical to `harw-sentinel`/`harw-probe-fs`
# (version 0.4.7, looked up there via docs.rs/crate/landlock — `cargo
# add` could not run here either, see the root instruction "Run NO
# cargo"). Unlike `harw-sentinel`, the outcome here is hard, as with
# `harw-probe-fs` (see the `src/landlock.rs` module docs, section "The
# hard decision").
landlock = "0.4.7"
# Reads the systemd socket activation environment and converts the passed
# raw descriptor into a `std::os::fd::OwnedFd` — **without** `unsafe`
# on this side. This conversion (at its core a `mem::transmute` of an
# integer into a descriptor type) is unavoidably unsafe at the actual FFI
# boundary; `#![forbid(unsafe_code)]` forbids it entirely in this
# crate, and `unsafe_code = "forbid"` in the workspace does too. That
# crate encapsulates exactly this one `unsafe` block itself (source cited in
# the `src/systemd.rs` module docs) and, by its own description, has
# **no** further dependency at all — the smallest conceivable leaf for
# this one problem, a better trade than writing `unsafe` ourselves
# or pulling in a heavier general-purpose crate (`listenfd`). Version 0.2.0
# looked up on the crates.io/docs.rs page (`cargo add`/`cargo
# search` could not run here). That crate already checks `LISTEN_PID`
# internally against its own process ID — `src/systemd.rs` nevertheless does
# not rely on that alone, but additionally performs the same check
# itself, testably (see the module docs there).
sd-listen-fds = "0.2.0"

[dev-dependencies]
# Only for tests that build a complete `AuthorizationProof` (requires
# a `jiff::Timestamp`) — the same reason as in `harw-dod-warden`'s
# own test suite. Pure dev-dependency, does not count against the
# runtime dependency budget (K53).
jiff = { workspace = true }

[lints]
workspace = true
