[package]
publish.workspace = true
name = "harw-dod-fsmon"
description = "Fanotify filesystem monitor: decode events, resolve paths and login UIDs, shape into security events."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Access vocabulary: `Capability`, `ReadScope`, `SensorHandle`, `SensorError`.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary: `SecurityEvent`, `EventKind`, `Actor`, `trait Sensor`.
harw-dod-signals = { path = "../harw-dod-signals" }
# The only filesystem seam for unprivileged reads (loginuid).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# Identifiers: `SensorId`.
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` for `error.rs`.
harw-macros = { path = "../../../harw-macros" }
# Time axis for `SecurityEvent::observed_at` (injected, never read itself).
jiff = { workspace = true }

[dev-dependencies]
# Fixture harness for sensor crates. At the time of this node (AW4-02a)
# still an empty scaffold without `sensor_suite!` (node AW2-05 follows in parallel):
# this crate therefore writes its checks by hand, but is already wired
# to the future dependency.
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }
# Only for the content-freedom test in `shape.rs` (serializes a shaped
# `SecurityEvent` and checks that no file content appears in it).
serde_json = { workspace = true }

[lints]
workspace = true
