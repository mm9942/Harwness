[package]
name = "harw-dod-flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# `BpfLoader`-Trait, `RawBpfEvent`, die wiederverwendbaren Byte-Leser
# (`read_u32_le`), `FixtureBpfLoader` für Tests ohne Kernel, sowie
# `BpfProgramSpec`/`BpfProgramKind`/`BpfProgramSource` für die
# Tracepoint-Entscheidung (siehe `src/lib.rs`).
harw-dod-bpf = { path = "../harw-dod-bpf" }
# `Capability::LoadBpfProgram` / `CapabilityClass::Bpf` — die eine Fähigkeit
# dieser Crate.
harw-dod-cap = { path = "../harw-dod-cap" }
# `EventKind::EgressFlow`, `SecurityEvent`, `Actor` — die Meldeform, in die
# diese Crate ein geparstes `FlowEvent` übersetzt.
harw-dod-signals = { path = "../harw-dod-signals" }
# `SensorId`.
harw-types = { path = "../../../harw-types" }
# `#[derive(HarwError)]` für `FlowError` — kein `anyhow`, kein `thiserror`.
harw-macros = { path = "../../../harw-macros" }
# `NetworkScope::allows_addr` trägt die Melderegel dieser Crate (siehe
# `src/lib.rs`, Abschnitt „Die Melderegel"). Zulässige Kantenrichtung:
# `harw-sandbox` hängt selbst an nichts aus dem `harw-dod-*`-Teilbaum (nur
# `harw-types`, `ipnet`, `serde`) — diese Abhängigkeit schließt also keinen
# Zyklus.
harw-sandbox = { path = "../../../harw-sandbox" }
# Zeitachse für den injizierten Beobachtungszeitpunkt.
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Zum Bauen von `EgressTarget::Cidr`-Werten in den Tests der Melderegel.
ipnet = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
