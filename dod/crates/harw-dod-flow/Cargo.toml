[package]
name = "harw-dod-flow"
description = "eBPF-based connection sensor: parses TCP events and reports outbound traffic beyond network scope"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../../../harw-authority" }
# `BpfLoader` trait, `RawBpfEvent`, the reusable byte readers
# (`read_u32_le`), `FixtureBpfLoader` for tests without a kernel, and
# `BpfProgramSpec`/`BpfProgramKind`/`BpfProgramSource` for the
# tracepoint decision (see `src/lib.rs`).
harw-dod-bpf = { path = "../harw-dod-bpf" }
# `Capability::LoadBpfProgram` / `CapabilityClass::Bpf` — the one capability
# of this crate.
harw-dod-cap = { path = "../harw-dod-cap" }
# `EventKind::EgressFlow`, `SecurityEvent`, `Actor` — the reporting shape into
# which this crate translates a parsed `FlowEvent`.
harw-dod-signals = { path = "../harw-dod-signals" }
# `SensorId`.
harw-types = { path = "../../../harw-types" }
# `#[derive(HarwError)]` for `FlowError` — no `anyhow`, no `thiserror`.
harw-macros = { path = "../../../harw-macros" }
# `NetworkScope::allows_addr` carries this crate's reporting rule (see
# `src/lib.rs`, section "The reporting rule"). Permitted edge direction:
# `harw-sandbox` itself depends on nothing from the `harw-dod-*` subtree (only
# `harw-types`, `ipnet`, `serde`) — so this dependency does not close a
# cycle.
harw-sandbox = { path = "../../../harw-sandbox" }
# Time axis for the injected observation timestamp.
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# For building `EgressTarget::Cidr` values in the reporting-rule tests.
ipnet = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
