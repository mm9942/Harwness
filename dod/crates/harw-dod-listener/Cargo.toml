[package]
publish = false
name = "harw-dod-listener"
description = "Listener socket sensor reporting ports with cgroup association"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Access vocabulary: `Capability::ReadProcNet`, `ReadScope`, `SensorError`,
# `SensorHandle<Bound>`. Exactly one capability (`ReadProcNet`) — see the module
# docs for the rationale on why that is an invariant.
harw-dod-cap = { path = "../harw-dod-cap" }
# `trait Sensor`, `SensorReading`, `SecurityEvent`, `EventKind::ListenerOpened`,
# `Actor`.
harw-dod-signals = { path = "../harw-dod-signals" }
# The only filesystem seam: `read_lines`, `read_to_string`,
# `read_first_line`. No sensor calls `std::fs` directly for file contents.
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `CgroupId`.
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` for `error.rs`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
