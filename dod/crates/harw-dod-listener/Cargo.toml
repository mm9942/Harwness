[package]
publish = false
name = "harw-dod-listener"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Zugriffsvokabular: `Capability::ReadProcNet`, `ReadScope`, `SensorError`,
# `SensorHandle<Bound>`. Genau eine Fähigkeit (`ReadProcNet`) — siehe Modul-
# Dokumentation für die Begründung, warum das eine Invariante ist.
harw-dod-cap = { path = "../harw-dod-cap" }
# `trait Sensor`, `SensorReading`, `SecurityEvent`, `EventKind::ListenerOpened`,
# `Actor`.
harw-dod-signals = { path = "../harw-dod-signals" }
# Die einzige Dateisystem-Naht: `read_lines`, `read_to_string`,
# `read_first_line`. Kein Sensor ruft `std::fs` für Dateiinhalte direkt auf.
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `CgroupId`.
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` für `error.rs`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
