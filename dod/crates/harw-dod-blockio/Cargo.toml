[package]
publish.workspace = true
name = "harw-dod-blockio"
description = "Cumulative block device I/O sensor from sysfs with device filtering and cardinality limits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Access vocabulary: Capability, ReadScope, SensorHandle, SensorError.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary and the one `trait Sensor` this sensor implements.
harw-dod-signals = { path = "../harw-dod-signals" }
# The one filesystem seam: `glob::glob` and `read_line_fields` read each
# `<device>/stat`, never `std::fs` directly (see the src/lib.rs module docs).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` for `SensorHandle`.
harw-types = { path = "../../../harw-types" }
# Mandatory dependency of every sensor crate per work order AW2-10.
# However, `#[derive(harw_macros::SensorSource)]` itself carries exactly one
# field via exactly one glob-addressed source with exactly one scalar value
# per match — `<device>/stat` is a file with many values in columns, so the
# macro does not fit (see the src/lib.rs module docs, section "Why no
# `#[derive(SensorSource)]`"). Currently unused, analogous to the unused
# `harw-macros` dependency in `harw-dod-cpu/Cargo.toml`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
