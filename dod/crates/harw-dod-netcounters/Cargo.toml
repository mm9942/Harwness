[package]
publish.workspace = true
name = "harw-dod-netcounters"
description = "Network interface counters from /proc/net/dev: rx/tx bytes, packets, errors, drops."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Access vocabulary: Capability, ReadScope, SensorHandle, SensorError.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary and the single `trait Sensor` that this sensor implements.
harw-dod-signals = { path = "../harw-dod-signals" }
# The single filesystem seam: `read_line_fields` reads `/proc/net/dev`, never
# `std::fs` directly (see the src/lib.rs module docs).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` for `SensorHandle`.
harw-types = { path = "../../../harw-types" }
# Mandatory dependency of every sensor crate per work order AW2-11.
# `#[derive(harw_macros::SensorSource)]` itself carries exactly one
# glob-addressed field with exactly one metric name fixed at compile time
# for every match (see `harw-macros/src/sensor_source.rs`,
# `expand_sensor_source`: "SensorSource allows exactly one field with
# `#[source(...)]`"). `/proc/net/dev` is neither a glob-addressable pattern
# over several files (it is a single file) nor does it carry a single scalar
# per match (each line carries sixteen columns, and each interface also needs
# its own label in the metric name, which the macro's field metric name
# cannot express) — the macro does not fit here (see the src/lib.rs module
# docs, section "Why no `#[derive(SensorSource)]`"). Currently unused, like
# the unused `harw-observe` dependency in `harw-dod-signals/Cargo.toml` and
# the unused `harw-macros` dependency in `harw-dod-cpu/Cargo.toml`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
# `sensor_suite!` — the inherited fixture test suite (six mandatory checks).
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }
# Solely for the content-freedom test "no address/no port in the serialized
# result" (see the `src/sensor.rs` tests): `HostSample` implements
# `serde::Serialize`, but `harw_dod_fixtures::sensor_suite!` does not
# serialize publicly — this one additional, crate-specific test therefore
# serializes on its own.
serde_json = { workspace = true }

[lints]
workspace = true
