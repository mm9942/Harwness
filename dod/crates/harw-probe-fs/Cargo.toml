[package]
publish.workspace = true
name = "harw-probe-fs"
description = "Filesystem monitor using fanotify; reports write access events to harw-sentinel in push-only mode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Shaping part, `FsEventSource`/`FixtureFsEventSource`, `FsMonSensor`.
harw-dod-fsmon = { path = "../harw-dod-fsmon" }
# Access vocabulary: `Capability`, `ReadScope`, `SensorHandle`.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary: `SecurityEvent`, `trait Sensor`.
harw-dod-signals = { path = "../harw-dod-signals" }
# Identifiers: `SensorId`.
harw-types = { path = "../../../harw-types" }
jiff = { workspace = true }
tracing = { workspace = true }
# Version identical to `harw-cli`/`harw-sentinel` — one sink for `tracing`,
# no second choice per binary.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# `--log` grammar; version identical to `harw-cli`/`harw-sentinel`.
clap = { version = "4.6.1", features = ["derive"] }
# `completions` subcommand (script output and managed installation).
harw-completions = { path = "../../../harw-completions", features = ["clap-args"] }
# Safe `SOCK_SEQPACKET` Unix socket without `unsafe` (`net` feature). The
# `event` feature provides `rustix::event::poll`, with which `src/source.rs`
# enforces the `timeout` parameter of `FsEventSource::read_events` against the
# real fanotify descriptor instead of ignoring it.
rustix = { workspace = true, features = ["net", "event"] }
# Provides `nix::sys::fanotify` — the safe fanotify binding that `rustix`
# 1.1.4 (see `[workspace.dependencies]`) lacks: there, `fanotify_init`/
# `fanotify_mark` sit in `src/not_implemented.rs` (module `yet`), without any
# wrapper. Version 0.31.3 was the current stable version according to the
# `crates.io` API at the time this node was researched (`max_stable_version`
# == `newest_version`); the `fanotify` module itself arrived with nix 0.28.0
# (CHANGELOG.md: "Added new fanotify API: wrappers for `fanotify_init` and
# `fanotify_mark`", #2194) and adopted I/O safety with 0.30.0
# (`BorrowedFd`/`OwnedFd` instead of raw `RawFd`, CHANGELOG.md #2443/#2575).
# `default-features = false`, because only the `fanotify` module is needed —
# according to the crate's `Cargo.toml`, `fanotify = []` is a standalone
# feature with no further dependencies (the modules `errno`, `fcntl`, `unistd`
# used by `fanotify.rs` are compiled unconditionally in `nix`, not behind a
# feature of their own). Every function this node calls from
# `nix::sys::fanotify` (`Fanotify::init`, `Fanotify::mark`,
# `Fanotify::read_events`, `FanotifyEvent::{mask,fd,pid,check_version}`) is,
# according to the source read on GitHub (`nix-rust/nix`, tag `v0.31.3`,
# `src/sys/fanotify.rs`), an ordinary safe function — any `unsafe` in them
# (e.g. `BorrowedFd::borrow_raw`) is an internal detail of the `nix` crate,
# not of this one.
nix = { version = "0.31", default-features = false, features = ["fanotify"] }
# Safe Landlock binding. **Not** available via `[workspace.dependencies]`
# (so far unused there) and this crate is one of two consumers — a direct
# version specification instead of a workspace detour, as this workspace also
# does for other single/double consumers (e.g. `tikv-jemallocator` only in
# `harw-cli/Cargo.toml`). Version 0.4.7 taken over identically from
# `harw-sentinel/Cargo.toml` (looked up there via `docs.rs/crate/landlock`) —
# `cargo add` could not run here, see the `src/landlock.rs` module docs.
landlock = "0.4.7"
# Wire encoding for `harw_dod_signals::SecurityEvent` on the send path to the
# sentinel — the same contract that `harw-sentinel::ipc` assumes on the
# receiving side (`#[serde(deny_unknown_fields)]`, kebab-case `EventKind` tag).
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
