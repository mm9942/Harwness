[package]
publish.workspace = true
name = "harw-dod-workspace"
description = "Security sensor that detects structural drift in the Cargo dependency graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Provides `WorkspaceGraph`/`parse_lockfile`: reads Cargo.toml/Cargo.lock without
# a subprocess. See the crate module docs (`src/lib.rs`) for the division of labor.
harw-code-graph = { path = "../../../harw-code-graph" }
# Access vocabulary: `ReadScope`, `SensorHandle<Bound>`, `Capability`,
# `SensorError` (the error type mandated by `harw_dod_signals::Sensor::poll`).
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary: `trait Sensor`, `SensorReading`, `EventKind::StructureDrift`.
harw-dod-signals = { path = "../harw-dod-signals" }
# `SensorId` (see `sensor.rs`) and the `#[derive(harw_macros::HarwError)]` base.
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` for `error.rs`.
harw-macros = { path = "../../../harw-macros" }
serde = { workspace = true }
jiff = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
