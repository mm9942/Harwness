[package]
publish = false
name = "harw-dod-bpf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# ID-Vokabular: `BpfProgramSpec`/`BpfHandle` tragen eine `SensorId`, damit ein
# geladenes Programm auf den Sensor zurückführbar bleibt, der es besitzt.
harw-types = { path = "../../../harw-types" }
# `#[derive(HarwError)]` für `BpfError` — kein `anyhow`, kein `thiserror`.
harw-macros = { path = "../../../harw-macros" }
# `Capability::LoadBpfProgram` / `CapabilityClass::Bpf`: diese Crate benennt
# die Fähigkeit, die ein echter (Nicht-Fixture-)Lader braucht, ohne sie selbst
# durchzusetzen — siehe `src/lib.rs` für die Abgrenzung.
harw-dod-cap = { path = "../harw-dod-cap" }
# Zeitachse für den dekodierten Ereignis-Zeitstempel (Formungsteil).
jiff = { workspace = true }
# `CLOCK_MONOTONIC` and `CLOCK_REALTIME` are sampled together by the loader;
# no `ktime` value is treated as Unix epoch time.
rustix = { workspace = true, features = ["time"] }
# Reale eBPF-Ladeschicht (`src/real.rs`, Nachtrag zu AW7-01a/AW7-01d): der
# `harw-dod-flow`-Konsument hängt inzwischen an einem Tracepoint statt an
# `SocketFilter`, was das zuvor dokumentierte Hindernis (ein generischer
# Lader dürfte keinen bereits offenen Socket besitzen) auflöst. Die hier
# genutzte Teilmenge (`Ebpf::load`, `TracePoint`/`KProbe` `load`/`attach`,
# `RingBuf::next`) ist laut gepinnter Quelle (siehe `src/real.rs`-Moduldoku)
# durchweg `unsafe`-frei; kein `build.rs`, keine `libbpf`-/`clang`-Abhängigkeit
# in diesem Crate. Version 0.14.0 über die crates.io-API verifiziert
# (`GET /api/v1/crates/aya/versions`, neuester, nicht zurückgezogener
# Eintrag zum Berichtszeitpunkt dieses Knotens) — nicht geraten. `cargo add`
# konnte in dieser Aufgabenform nicht laufen (Hauptregel: kein `cargo`), die
# Versionsnummer stammt deshalb aus der Registry-API, nicht aus dem
# lokalen `~/.cargo`-Zwischenspeicher (dort war `aya` nicht gepinnt).
aya = "0.14.0"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
