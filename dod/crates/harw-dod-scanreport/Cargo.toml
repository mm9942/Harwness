[package]
name = "harw-dod-scanreport"
description = "Reads and evaluates external scanner reports in SARIF and cargo audit formats."
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Access vocabulary: Capability, ReadScope, SensorHandle, SensorError (the
# only error type this crate returns — see `src/lib.rs`).
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary: `trait Sensor`, `SensorReading`, `SecurityEvent`,
# `EventKind`, `Hardness`.
harw-dod-signals = { path = "../harw-dod-signals" }
# The only filesystem seam of this crate: `read_to_string`, `glob::glob`.
harw-dod-readfs = { path = "../harw-dod-readfs" }
# Names `scan_reports_dir(home)` — path resolution only, no creation.
harw-home = { path = "../../../harw-home" }
# `SensorId`.
harw-types = { path = "../../../harw-types" }
# Path dependency prescribed for this node (contract). This crate covers its
# entire error surface via the already content-free
# `harw_dod_cap::SensorError` and invents no error set of its own —
# see `src/lib.rs`, section "Fehler" — so the import remains unused.
harw-macros = { path = "../../../harw-macros" }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
# Fixture harness (`sensor_suite!`, fully implemented in
# `harw-dod-fixtures/src/macros.rs`). It still does not apply here: it
# requires `From<harw_dod_cap::SensorHandle<harw_dod_cap::Bound>>` as the
# only construction path, but `ScanReportSensor` is constructed via
# `ScanReportSensor::for_home(id, &roots.home)` (convenience constructor
# over `harw_home::paths::scan_reports_dir`, see `src/sensor.rs`) rather than
# via `From` — the six checks are therefore written by hand below
# (see `src/sensor.rs`, test module).
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
