[package]
name = "harw-dod"
description = "Host observation and security finding evaluation via sensors, rules, and evidence aggregation"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../../../harw-authority" }
# Access vocabulary: Capability, CapabilityClass, ReadScope, SensorHandle,
# SensorError, Permanence -- without it no caller can build a handle that any
# of the sensor types below accepts (see the `//!` block in src/lib.rs).
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary: `trait Sensor`, `SensorReading`, `SecurityEvent`, `EventKind`,
# `Actor`, `AuthOutcome`, `DriftSeverity`, `HostSample`, `Severity`,
# `Hardness`, `SecurityEvidence` -- return and parameter types of
# `Sensor::poll`/`Sensor::handle` and of `harw-dod-rules::RuleContext`.
harw-dod-signals = { path = "../harw-dod-signals" }
# The aggregator: `Sentinel` polls a fixed list of sensors, tracks health per
# sensor, and buffers evidence -- the recommended entry point for "observe the
# host", instead of managing each sensor individually.
harw-dod-sentinel = { path = "../harw-dod-sentinel" }
# "evaluate a finding": `Finding<S>`, `triage`, `Verdict`, `run_rules`,
# `Rule`/`RuleContext`, the three bundled rules, `Baseline`.
harw-dod-rules = { path = "../harw-dod-rules" }

# Nine of the ten sensor crates listed as `RequiredPrivilege::Unprivileged` in
# `CRATE_PRIVILEGE` in `xtask/src/gate_privileges.rs` (the tenth,
# `harw-dod-cgroup`, is still scaffolding -- see the `//!` block in
# src/lib.rs, section "Bekannte Lücke"). Each provides exactly one concrete
# `Sensor` type -- the tool with which a caller can actually observe
# something, not just the vocabulary for it.
harw-dod-cpu = { path = "../harw-dod-cpu" }
harw-dod-thermal = { path = "../harw-dod-thermal" }
harw-dod-memory = { path = "../harw-dod-memory" }
harw-dod-blockio = { path = "../harw-dod-blockio" }
harw-dod-netcounters = { path = "../harw-dod-netcounters" }
harw-dod-gpu = { path = "../harw-dod-gpu" }
harw-dod-listener = { path = "../harw-dod-listener" }
harw-dod-scanreport = { path = "../harw-dod-scanreport" }
harw-dod-workspace = { path = "../harw-dod-workspace" }

# The three privilege classes (see `CRATE_PRIVILEGE`:
# `harw-dod-authlog` -> `RequiredPrivilege::Netlink`,
# `harw-dod-fsmon` -> `RequiredPrivilege::FileWatch`,
# `harw-dod-bpf`/`harw-dod-procmon`/`harw-dod-flow` -> `RequiredPrivilege::Bpf`).
# `optional = true`, enabled exclusively via the `privileged` feature
# below -- see the `//!` block in src/lib.rs, section "Die Privilegienfrage",
# for the rationale and the limits of this mechanism (K53/AW5-01).
harw-dod-authlog = { path = "../harw-dod-authlog", optional = true }
harw-dod-fsmon = { path = "../harw-dod-fsmon", optional = true }
harw-dod-bpf = { path = "../harw-dod-bpf", optional = true }
harw-dod-procmon = { path = "../harw-dod-procmon", optional = true }
harw-dod-flow = { path = "../harw-dod-flow", optional = true }

[features]
# Unlocks the five capability crates from the previous paragraph. No
# `default` entry enables this feature -- a consumer that only writes
# `harw-dod` into its `[dependencies]` gets none of the three privilege
# classes in its dependency closure. See the `//!` block for the limits of
# this guarantee.
privileged = [
    "dep:harw-dod-authlog",
    "dep:harw-dod-fsmon",
    "dep:harw-dod-bpf",
    "dep:harw-dod-procmon",
    "dep:harw-dod-flow",
]

[dev-dependencies]
# Identifiers (`SensorId`) for every example/test that builds a
# `SensorHandle`. Same convention as in every sensor crate itself
# (e.g. the `harw-dod-cpu/src/sensor.rs` doctests): a facade does not
# re-export `harw-types`, because every consumer already knows this base
# vocabulary directly anyway (precedent: `harw-lens` likewise does not
# re-export `harw-macros`, even though `LensError` needs it internally).
harw-types = { path = "../../../harw-types" }
# `NetworkScope::from_hosts` for the rule example doctest
# (`EgressFlowRule`/`RuleContext::network_scope`). `harw-sandbox` is already
# the landed, standalone vocabulary for network scopes (see the
# `harw-dod-rules/Cargo.toml` comment) -- this facade does not re-export it
# (see the `//!` block).
harw-sandbox = { path = "../../../harw-sandbox" }
jiff = { workspace = true }
# `triaged_finding_for_test` (feature `test-support`): `run_rules` returns
# `Finding<Raw>`; the transition to `Finding<RuleChecked>` is `pub(crate)` in
# `harw-dod-rules`. The facade integration test therefore triages the real
# rule finding via this test helper; never active in the release build.
harw-dod-rules = { path = "../harw-dod-rules", features = ["test-support"] }
# Builds a synthetic `stat` file for the sensor integration test, instead of
# relying on a real `/proc` (test policy: no filesystem without `#[ignore]`).
tempfile = { workspace = true }

[lints]
workspace = true
