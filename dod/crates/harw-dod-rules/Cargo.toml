[package]
name = "harw-dod-rules"
description = "Rules engine for security findings: generates findings from observations and baselines"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Data vocabulary of the observation side: `HostSample`, `SecurityEvent`,
# `EventKind`, `Severity`, `Hardness`. `Finding<S>` deliberately lives in this
# crate and not there — see the `src/finding.rs` module docs for the
# rationale (contract-master correction §G.1).
harw-dod-signals = { path = "../harw-dod-signals" }
# `EgressFlow` rule: `NetworkScope::allows`/`allows_addr`, instead of writing
# the scope check a second time.
harw-authority = { path = "../../../harw-authority" }
# `FindingId` (identity from `RuleChecked` onward) and `Confidence` (target
# scale of `epistemic_confidence_for`).
harw-types = { path = "../../../harw-types" }
# `FindingRecord` (W3 C-FIND) is serializable.
serde = { workspace = true }
# Source type of this crate's only real conversion:
# `epistemic_confidence_for`. No cycle: `harw-research` depends only on
# `harw-macros`/`harw-types`/serde/jiff.
harw-research = { path = "../../../harw-research" }
jiff = { workspace = true }
# `LockedPackage`/`parse_lockfile`/`find_locked` (node AW7-06, intel scout):
# the already-landed, sole `Cargo.lock` parser of the tree (see the
# `src/advisory.rs` module docs) — no second lockfile parser here. No cycle:
# `harw-code-graph` depends only on `serde`, `toml`, `harw-macros`,
# `harw-types` (whose `Cargo.toml` was checked) — no back edge to
# `harw-dod-rules`.
harw-code-graph = { path = "../../../harw-code-graph" }
# `VersionReq`/`Version`: correct numeric version-range checking instead of a
# string comparison (`1.10.0` < `1.9.0` as a string, but not as a version) —
# see the `src/advisory.rs` module docs.
semver = { workspace = true }
rayon = "1.12.0"

[dev-dependencies]
# Tests only: builds a `NetworkScope` with a `Cidr` target via its public
# `Deserialize` implementation (`harw_authority::NetworkScope` offers no other
# public constructor for a `Cidr` target).
serde_json = { workspace = true }
# Tests/doctests only: `crate::rules::baseline_deviation` conveniently
# constructs a `harw_knowledge::artifact::ArtifactId` there to show that it
# satisfies `Baseline::new`'s `impl std::fmt::Display` bound (see the
# `src/baseline.rs` module docs, section "Der gewählte Weg"). Deliberately
# `[dev-dependencies]`, not `[dependencies]`: this keeps the entire
# `harw-knowledge` chain (incl. `harw-model-catalog` → `reqwest`/`tokio`) out
# of every production consumer of this crate, namely `harw-sentinel` — exactly
# the edge that was cut. No cycle: `harw-knowledge` in turn depends
# (productively) on `harw-dod-rules`, but dev-dependency cycles are explicitly
# supported in Cargo — they never flow into the production dependency graph.
harw-knowledge = { path = "../../../harw-knowledge" }

[features]
# Only for test fixtures of dependent crates (e.g. `harw-dod-escalate`'s
# `Ladder` tests): unlocks `finding::triaged_finding_for_test`, which produces
# arbitrary `Severity`/`Hardness` combinations that no real rule yields.
# Because of `resolver = "2"` (workspace root), only active when a crate
# requests it under `[dev-dependencies]` — never in the build of a production
# consumer. See the `src/finding.rs` module docs, section "Der Besitz des
# Wertes ist die Berechtigung", for the invariant this leaves untouched.
test-support = []

[lints]
workspace = true
