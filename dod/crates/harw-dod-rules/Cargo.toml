[package]
name = "harw-dod-rules"
description = "Rules engine for security findings: generates findings from observations and baselines"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Daten-Vokabular der Beobachtungsseite: `HostSample`, `SecurityEvent`,
# `EventKind`, `Severity`, `Hardness`. `Finding<S>` lebt bewusst in dieser
# Crate und nicht dort — siehe `src/finding.rs` Moduldoku für die Begründung
# (Contract-Master-Korrektur §G.1).
harw-dod-signals = { path = "../harw-dod-signals" }
# `EgressFlow`-Regel: `NetworkScope::allows`/`allows_addr`, statt die
# Bereichsprüfung ein zweites Mal zu schreiben.
harw-authority = { path = "../../../harw-authority" }
# `FindingId` (Identität ab `RuleChecked`) und `Confidence` (Zielskala von
# `epistemic_confidence_for`).
harw-types = { path = "../../../harw-types" }
# `FindingRecord` (W3 C-FIND) ist serialisierbar.
serde = { workspace = true }
# Quelltyp der einzigen echten Konvertierung dieser Crate:
# `epistemic_confidence_for`. Kein Zyklus: `harw-research` hängt nur auf
# `harw-macros`/`harw-types`/serde/jiff.
harw-research = { path = "../../../harw-research" }
jiff = { workspace = true }
# `LockedPackage`/`parse_lockfile`/`find_locked` (Knoten AW7-06, Intel-Scout):
# der bereits gelandete, einzige `Cargo.lock`-Parser des Baums (siehe
# `src/advisory.rs` Moduldoku) — kein zweiter Lockfile-Parser hier. Kein
# Zyklus: `harw-code-graph` hängt nur auf `serde`, `toml`, `harw-macros`,
# `harw-types` (dessen `Cargo.toml` geprüft) — keine Rückkante auf
# `harw-dod-rules`.
harw-code-graph = { path = "../../../harw-code-graph" }
# `VersionReq`/`Version`: korrekte numerische Versionsbereichsprüfung statt
# eines Zeichenkettenvergleichs (`1.10.0` < `1.9.0` als String, aber nicht als
# Version) — siehe `src/advisory.rs` Moduldoku.
semver = { workspace = true }
rayon = "1.12.0"

[dev-dependencies]
harw-test-support = { path = "../../../harw-test-support" }
# Nur für Tests: baut einen `NetworkScope` mit einem `Cidr`-Ziel über dessen
# öffentliche `Deserialize`-Implementierung (`harw_authority::NetworkScope`
# bietet keinen anderen öffentlichen Konstruktor für ein `Cidr`-Ziel).
serde_json = { workspace = true }
# Nur für Tests/Doctest: `crate::rules::baseline_deviation` konstruiert dort
# bequem einen `harw_knowledge::artifact::ArtifactId`, um zu zeigen, dass er
# `Baseline::new`s `impl std::fmt::Display`-Schranke erfüllt (siehe
# `src/baseline.rs` Moduldoku, Abschnitt „Der gewählte Weg"). Bewusst
# `[dev-dependencies]`, nicht `[dependencies]`: das hält die gesamte
# `harw-knowledge`-Kette (inkl. `harw-model-catalog` → `reqwest`/`tokio`)
# aus jedem produktiven Konsumenten dieser Crate heraus, namentlich
# `harw-sentinel` — genau die Kante, die geschnitten wurde. Kein Zyklus:
# `harw-knowledge` hängt seinerseits (produktiv) auf `harw-dod-rules`, aber
# Dev-Dependency-Zyklen sind in Cargo ausdrücklich unterstützt — sie fließen
# nie in den produktiven Abhängigkeitsgraphen ein.
harw-knowledge = { path = "../../../harw-knowledge" }

[features]
# Nur für Testfixtures abhängiger Crates (z. B. `harw-dod-escalate`s
# `Ladder`-Tests): schaltet `finding::triaged_finding_for_test` frei, das
# beliebige `Severity`/`Hardness`-Kombinationen erzeugt, die keine echte Regel
# liefert. Wegen `resolver = "2"` (Workspace-Root) nur aktiv, wenn eine Crate
# es unter `[dev-dependencies]` anfordert — nie im Build eines produktiven
# Konsumenten. Siehe `src/finding.rs`-Moduldoku, Abschnitt „Der Besitz des
# Wertes ist die Berechtigung", für die dadurch unangetastete Invariante.
test-support = []

[lints]
workspace = true
