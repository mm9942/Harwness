[package]
name = "harw-dod-procmon"
description = "Process execution monitoring via eBPF: who started what"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# eBPF loading layer: `BpfLoader`, `BpfProgramSpec`, `BpfHandle`, `RawBpfEvent`,
# `BpfError`, `REQUIRED_CAPABILITY`, `FixtureBpfLoader` (for own tests, part
# of the normal API of this dependency).
harw-dod-bpf = { path = "../harw-dod-bpf" }
# Access vocabulary: `Capability`, `SensorHandle<Bound>`, `ReadScope`,
# `SensorError`.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary and the one `trait Sensor`: `Actor`, `EventKind::ProcessExec`,
# `SecurityEvent`, `SensorReading`.
harw-dod-signals = { path = "../harw-dod-signals" }
# `SensorId` (indirectly via `SensorHandle`) and `ContentDigest` for
# `ExecEvent::argv_digest`.
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` for `ProcmonError` — no `anyhow`,
# no `thiserror`.
harw-macros = { path = "../../../harw-macros" }
# Time axis for `RawBpfEvent::observed_at` / the injected `now` of `Sensor::poll`.
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
