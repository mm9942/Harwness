[package]
publish = false
name = "harw-dod-procmon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# eBPF-Ladeschicht: `BpfLoader`, `BpfProgramSpec`, `BpfHandle`, `RawBpfEvent`,
# `BpfError`, `REQUIRED_CAPABILITY`, `FixtureBpfLoader` (für eigene Tests, Teil
# der normalen API dieser Abhängigkeit).
harw-dod-bpf = { path = "../harw-dod-bpf" }
# Zugriffsvokabular: `Capability`, `SensorHandle<Bound>`, `ReadScope`,
# `SensorError`.
harw-dod-cap = { path = "../harw-dod-cap" }
# Daten-Vokabular und der eine `trait Sensor`: `Actor`, `EventKind::ProcessExec`,
# `SecurityEvent`, `SensorReading`.
harw-dod-signals = { path = "../harw-dod-signals" }
# `SensorId` (indirekt über `SensorHandle`) und `ContentDigest` für
# `ExecEvent::argv_digest`.
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` für `ProcmonError` — kein `anyhow`,
# kein `thiserror`.
harw-macros = { path = "../../../harw-macros" }
# Zeitachse für `RawBpfEvent::observed_at` / `Sensor::poll`'s injiziertes `now`.
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
