[package]
publish.workspace = true
name = "harw-dod-cpu"
description = "CPU utilization from /proc/stat as cumulative jiffies counters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Zugriffsvokabular: Capability, ReadScope, SensorHandle, SensorError.
harw-dod-cap = { path = "../harw-dod-cap" }
# Datenvokabular und der eine `trait Sensor`, den dieser Sensor implementiert.
harw-dod-signals = { path = "../harw-dod-signals" }
# Die eine Dateisystem-Naht: `read_line_fields` liest `/proc/stat`, nie
# direktes `std::fs` (siehe src/lib.rs-Moduldoku).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` für `SensorHandle`.
harw-types = { path = "../../../harw-types" }
# Verbindliche Abhängigkeit jeder Sensor-Crate laut Arbeitsauftrag AW2-08.
# `#[derive(harw_macros::SensorSource)]` selbst trägt aber genau ein Feld
# über genau eine glob-adressierte Quelle mit genau einem Skalarwert je
# Treffer — `/proc/stat` ist eine Datei mit vielen Werten in Spalten, dafür
# passt das Makro nicht (siehe src/lib.rs-Moduldoku, Abschnitt „Warum kein
# `#[derive(SensorSource)]`"). Aktuell ungenutzt, analog zur unbenutzten
# `harw-observe`-Abhängigkeit in `harw-dod-signals/Cargo.toml`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
harw-test-support = { path = "../../../harw-test-support" }
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
