[package]
publish.workspace = true
name = "harw-dod-cpu"
description = "CPU utilization from /proc/stat as cumulative jiffies counters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Access vocabulary: Capability, ReadScope, SensorHandle, SensorError.
harw-dod-cap = { path = "../harw-dod-cap" }
# Data vocabulary and the one `trait Sensor` this sensor implements.
harw-dod-signals = { path = "../harw-dod-signals" }
# The one filesystem seam: `read_line_fields` reads `/proc/stat`, never
# `std::fs` directly (see the src/lib.rs module docs).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` for `SensorHandle`.
harw-types = { path = "../../../harw-types" }
# Mandatory dependency of every sensor crate per work order AW2-08.
# However, `#[derive(harw_macros::SensorSource)]` itself carries exactly one
# field via exactly one glob-addressed source with exactly one scalar value
# per match — `/proc/stat` is a file with many values in columns, so the
# macro does not fit (see the src/lib.rs module docs, section "Why no
# `#[derive(SensorSource)]`"). Currently unused, analogous to the unused
# `harw-observe` dependency in `harw-dod-signals/Cargo.toml`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
