schema_version = 1
mode = "observe"

# Monitoriert den kompletten Host (Prozess-Starts und ausgehende TCP-Verbindungen).
# Achtung: produziert viele Events. Fuer Tests ohne konkrete Cgroups geeignet.
active_profile = "host"

[profiles.host]
scope = "host"
sensors = ["exec", "tcp-connect"]
egress_allow_cidrs = []
