[workspace]
resolver = "2"
members = [
    "crates/harw-dod-authlog",
    "crates/harw-dod-blockio",
    "crates/harw-dod-bpf",
    "crates/harw-dod-cap",
    "crates/harw-dod-cgroup",
    "crates/harw-dod-config",
    "crates/harw-dod-cpu",
    "crates/harw-dod-escalate",
    "crates/harw-dod-fixtures",
    "crates/harw-dod-flow",
    "crates/harw-dod-fsmon",
    "crates/harw-dod-gpu",
    "crates/harw-dod-listener",
    "crates/harw-dod-memory",
    "crates/harw-dod-netcounters",
    "crates/harw-dod-netlink",
    "crates/harw-dod-netpolicy",
    "crates/harw-dod-procmon",
    "crates/harw-dod-readfs",
    "crates/harw-dod-rules",
    "crates/harw-dod-scanreport",
    "crates/harw-dod-sentinel",
    "crates/harw-dod-signals",
    "crates/harw-dod-thermal",
    "crates/harw-dod-warden",
    "crates/harw-dod-warden-proto",
    "crates/harw-dod-workspace",
    # Fassade + laufende Prozesse (aus dem Produkt-Workspace hierher verschoben):
    "crates/harw-dod",
    "crates/harw-sentinel",
    "crates/harw-probe-fs",
    "crates/harw-probe-bpf",
    "crates/harw-warden",
]

# Dieser Workspace erbt nichts mehr vom Produkt-Workspace: eigene Paket- und
# Abhängigkeitsvorgaben, damit `dod/` eigenständig baut und testet.
# Werte spiegeln den Produkt-Workspace bewusst (gleiche Fassung je geteilter
# Abhängigkeit), damit Pfad-Kanten zwischen beiden Builddomänen konsistent
# auflösen.
[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Zeitachse.
jiff = { version = "0.2.32", features = ["serde"] }

# Serialisierung.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.3"

# Inhaltsadressierung.
blake3 = "1.8.7"

# Netzmengen (NetworkScope::EgressTarget).
ipnet = { version = "2.12.1", features = ["serde"] }

# Dateien und Nebenläufigkeit.
fs4 = "1.1.0"
tempfile = "3.27.0"

# Beobachtung.
tracing = "0.1.44"

# Syscalls ohne libc.
rustix = "1.1.4"

# Versionsvergleich (Security-Signal, kein Stringvergleich).
semver = { version = "1.0.28", features = ["serde"] }

# `forbid` statt `deny`: nicht per `#[allow]` überstimmbar. Gleiche Regel wie
# im Produkt-Workspace, damit das Sicherheitsniveau je Crate identisch bleibt.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 0
