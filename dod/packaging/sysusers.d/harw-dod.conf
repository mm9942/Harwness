# DoD system accounts. Neither account has a login shell or a personal home.
g harw-dod-ipc - -
g harw-dod-config - -
u harw-dod - "HARW DoD sentinel" - /usr/sbin/nologin
u harw-dod-bpf - "HARW DoD eBPF probe" - /usr/sbin/nologin
m harw-dod harw-dod-ipc
m harw-dod-bpf harw-dod-ipc
m harw-dod harw-dod-config
m harw-dod-bpf harw-dod-config
