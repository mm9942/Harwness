# Exact first output lines of the tools validated on the target host by
# building all four objects, checking their ELF contracts, and generating
# the manifest. Revalidate the build before changing these pins; `make`
# rejects mismatches and UNVALIDATED values.
schema_version = 1
clang_version = "Ubuntu clang version 18.1.3 (1ubuntu1)"
bpftool_version = "bpftool v7.4.0"
llvm_objdump_version = "Ubuntu LLVM version 19.1.1"
