[package]
publish.workspace = true
name = "harw-job-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Linux job mechanics without unsafe code: pidfd process handles, process-group and cgroup v2 job boundaries, procfs recovery identity, rlimits, NO_NEW_PRIVS, capability drop and Landlock (Job-Runtime-Doc §8-§12, Phases 2-5)."

# Feature layout per Job-Runtime-Doc §17. `rustix` is not optional: every
# Linux path of this crate needs it (pidfd, waitid, signals, rlimits).
[features]
default = ["linux-basic"]
# procfs-based observation and recovery identity (`proc`, `recovery`).
linux-basic = ["dep:procfs"]
# Landlock + capability-oriented filesystem authority (`sandbox::apply_*`,
# `filesystem`).
linux-sandbox = ["linux-basic", "dep:landlock", "dep:cap-std"]
# In-house minimal cgroup v2 backend over cgroupfs files (no libcgroups, no
# C, no BPF). Uses cap-std so a backend only ever holds its delegated
# directory, never ambient `/sys/fs/cgroup` authority.
linux-cgroup-v2 = ["linux-basic", "dep:cap-std"]

[dependencies]
# Platform-neutral model: ExitOutcome, EnforcementState, SandboxReport,
# AttemptId, RunnerId, SandboxProfileName.
harw-job-core = { path = "../harw-job-core" }
# LinuxRecoveryIdentity / JobResources are persisted metadata.
serde = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# process: pidfd_open, pidfd_send_signal, waitid(P_PIDFD), kill, rlimits.
# event:   poll(2) on a pidfd (exit readiness without reaping).
# thread:  PR_SET_NO_NEW_PRIVS, capget/capset, bounding/ambient sets.
# fs:      fstatfs (cgroup2 mount detection).
rustix = { workspace = true, features = ["process", "event", "thread", "fs"] }
# 0.18: first release on rustix 1.x (0.17 still pulls rustix 0.38), declared
# MSRV 1.70. No default features: no chrono, no flate2.
procfs = { workspace = true, optional = true }
# Same version as the dod/ crates (harw-probe-fs, harw-sentinel, harw-warden).
landlock = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
