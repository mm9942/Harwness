# Lieferketten-Prüfung für `cargo deny check`.
#
# Aufgenommen im Knoten AW0-00. Begründung für den Zeitpunkt: das
# Ausbauprogramm legt rund fünfzig neue Crates an, und jede neue
# Abhängigkeit, die nach dieser Prüfung hereinkommt, muss einzeln
# nachgeholt werden. Ein Lauf zu Beginn kostet nichts, ein Nachziehen über
# fünfzig Crates schon.
#
# `cargo-vet` folgt erst ab Welle AW5 und nur im DoD-Teilbaum: es verlangt
# Audit-Einträge je Abhängigkeit und ist dort begründet, wo ein Binary mit
# erhöhten Berechtigungen läuft — nicht workspaceweit.

[graph]
all-features = true

[advisories]
version = 2
# Bekannte, bewusst getragene Meldungen kommen hierher — jede mit einem
# Kommentar, der sagt, warum sie getragen wird. Leer heißt: es gibt keine.
ignore = [
    # Nicht mehr gepflegt, kein sicheres Upgrade: kommt nur transitiv über
    # `scraper` → `selectors` (HTML-Parsing in `harw-tool-web`).
    { id = "RUSTSEC-2025-0057", reason = "fxhash transitiv über scraper/selectors; kein Upgrade verfügbar" },
    # Nicht mehr gepflegt, reines Proc-Macro zur Übersetzungszeit über `ratatui`.
    { id = "RUSTSEC-2024-0436", reason = "paste transitiv über ratatui (nur Compile-Zeit)" },
    # Nicht mehr gepflegt, Proc-Macro über `hax-lib-macros` (libcrux-Kette).
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 transitiv über hax-lib-macros (nur Compile-Zeit)" },
    # libcrux-Meldungen: blockiert durch `crypt_guard = "=3.0.1"` (auch 3.0.2),
    # das `libcrux-ml-kem = "=0.0.9"` exakt pinnt. Ein Upgrade braucht ein
    # neues crypt_guard-Release und ein Neu-Blessing der KEM-KATs in
    # `harw-secrets` (siehe dortige Cargo.toml). Offen, nicht erledigt.
    { id = "RUSTSEC-2026-0207", reason = "libcrux-sha3 0.0.9 über crypt_guard =3.0.1; wartet auf crypt_guard-Upgrade" },
    { id = "RUSTSEC-2026-0208", reason = "libcrux-sha3 0.0.9 über crypt_guard =3.0.1; wartet auf crypt_guard-Upgrade" },
    { id = "RUSTSEC-2026-0212", reason = "libcrux-secrets 0.0.5 über crypt_guard =3.0.1; wartet auf crypt_guard-Upgrade" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Mozillas Root-Zertifikatsdaten in `webpki-roots`/`webpki-root-certs`.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Eigene Crates sind alle `publish = false` (siehe `[workspace.package]`);
# für sie ist noch kein Lizenzmodell entschieden, also nicht prüfen.
[licenses.private]
ignore = true

[bans]
# Mehrfach vorhandene Fassungen derselben Crate sind eine Warnung, kein
# Fehler: der Baum zieht sie über fremde Abhängigkeiten, nicht über eigene
# Entscheidungen. Was wir selbst wählen, steht in [workspace.dependencies].
multiple-versions = "warn"
wildcards = "deny"
# Pfad-Abhängigkeiten zwischen eigenen, unveröffentlichten Crates tragen
# keine Versionsangabe.
allow-wildcard-paths = true
# Die Zeitachse ist eine bewusste Festlegung: `jiff` für Neues. `time` liegt
# noch in Bestandscrates und wird nicht im Rahmen dieses Programms migriert.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
