# Supply-chain check for `cargo deny check`.
#
# Introduced in node AW0-00. Reason for the timing: the expansion program
# creates around fifty new crates, and every new dependency that arrives after
# this check has to be backfilled individually. A run at the start costs
# nothing; catching up across fifty crates does.
#
# `cargo-vet` follows only from wave AW5 and only in the DoD subtree: it
# requires audit entries per dependency and is justified where a binary runs
# with elevated privileges — not workspace-wide.

[graph]
all-features = true

[advisories]
version = 2
# Known advisories that are knowingly tolerated go here — each with a
# comment saying why it is tolerated. Empty means: there are none.
ignore = [
    # Unmaintained, no safe upgrade: only comes in transitively via
    # `scraper` → `selectors` (HTML parsing in `harw-tool-web`).
    { id = "RUSTSEC-2025-0057", reason = "fxhash transitively via scraper/selectors; no upgrade available" },
    # Unmaintained, pure compile-time proc macro via `ratatui`.
    { id = "RUSTSEC-2024-0436", reason = "paste transitively via ratatui (compile time only)" },
    # Unmaintained, proc macro via `hax-lib-macros` (libcrux chain).
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 transitively via hax-lib-macros (compile time only)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Mozilla's root certificate data in `webpki-roots`/`webpki-root-certs`.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Workspace crates are not published to crates.io (see `[workspace.package]`).
# They are dual-licensed MIT OR Apache-2.0; this setting skips cargo-deny's
# license check for unpublished workspace packages, not their license grant.
[licenses.private]
ignore = true

[bans]
# Multiple versions of the same crate are a warning, not an error: the tree
# pulls them in through third-party dependencies, not through our own
# decisions. What we choose ourselves is listed in [workspace.dependencies].
multiple-versions = "warn"
# Expected and knowingly tolerated since PL-60 (DoD in the root workspace, one
# lockfile): `nix` 0.29 (transitively via `zbus`, OS keyring in `harw-secrets`)
# alongside `nix` 0.31 (direct, `harw-probe-fs`, feature `fanotify`). Two
# major versions, no common choice possible; `warn` suffices, no `skip`.
wildcards = "deny"
# Path dependencies between our own, unpublished crates carry no version
# specification.
allow-wildcard-paths = true
# The time library is a deliberate choice: `jiff` for new code. `time` still
# lives in existing crates and is not migrated as part of this program.
skip = []
# Tier C (docs/architecture/dependency-review.md): no OpenSSL in the tree.
# TLS runs exclusively via rustls + aws-lc-rs (Ring A).
deny = [
    { crate = "openssl-sys" },
    { crate = "openssl" },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
