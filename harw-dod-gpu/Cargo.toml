[package]
name = "harw-dod-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Zugriffsvokabular: Capability, ReadScope, SensorError, SensorHandle<Bound>.
harw-dod-cap = { path = "../harw-dod-cap" }
# Datenvokabular (HostSample) und der eine `trait Sensor`, den diese Crate
# implementiert.
harw-dod-signals = { path = "../harw-dod-signals" }
# Die einzige Dateisystem-Naht: `parse_i64`, `parse_u64`, `glob::glob`. Kein
# `std::fs` in dieser Crate (siehe `src/sensor.rs`-Moduldoku).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` für den Sensor-Griff.
harw-types = { path = "../harw-types" }
# Laut AW2-07-Brief verbindliche Abhängigkeit jeder Sensor-Crate. Aktuell
# ungenutzt: `Sensor` ist von Hand implementiert statt über
# `#[derive(harw_macros::SensorSource)]` (Begründung: `src/lib.rs`-Moduldoku,
# Abschnitt „Warum kein `#[derive(SensorSource)]`" — mehrere Metriken samt
# Kartenlabel je Treffer und eine Einheitenumrechnung sprengen, was das Makro
# heute trägt), und `metrics!` bräuchte zusätzlich `harw-observe`, das nicht
# im Abhängigkeitsumfang dieses Knotens liegt. Vorbild für dieses Muster
# (verbindliche, aktuell ungenutzte Abhängigkeit mit Begründungskommentar):
# `harw-dod-thermal/Cargo.toml`.
harw-macros = { path = "../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
# `sensor_suite!` — die geerbte Fixture-Testsuite (sechs Pflichtprüfungen
# plus optionale Adversarial-Prüfung).
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }

[lints]
workspace = true
