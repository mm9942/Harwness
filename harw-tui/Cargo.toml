[package]
publish.workspace = true
name = "harw-tui"
description = "Command-shell primitives for Harwness TUI: input classification, parsing, command dispatch, and permission enforcement."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
toml = { workspace = true }
harw-authority = { path = "../harw-authority" }
crossterm = "0.29.0"
harw-agent-artifact = { path = "../harw-agent-artifact" }
harw-agent-dsl = { path = "../harw-agent-dsl" }
harw-catalog = { path = "../harw-catalog" }
harw-config = { path = "../harw-config" }
harw-core = { path = "../harw-core" }
harw-explorer = { path = "../harw-explorer" }
harw-context = { path = "../harw-context" }
harw-lens-types = { path = "../harw-lens-types" }
harw-extension-api = { path = "../harw-extension-api" }
# Atomares, überschreibsicheres Schreiben der `/export`-Markdown-Datei (src/export.rs).
harw-fsutil = { path = "../harw-fsutil" }
harw-registry-defaults = { path = "../harw-registry-defaults" }
harw-model-catalog = { path = "../harw-model-catalog" }
harw-operations = { path = "../harw-operations" }
harw-memory = { path = "../harw-memory" }
harw-ops = { path = "../harw-ops" }
# Plan- und Ziel-Darstellung in der Verlaufsansicht (`PlanGraphCell`, `GoalCell`).
harw-plan = { path = "../harw-plan" }
harw-protocol = { path = "../harw-protocol" }
harw-sandbox = { path = "../harw-sandbox" }
harw-tool-shell = { path = "../harw-tool-shell" }
# Runde 5, Teil F: Plan-Fragekanal (`plan.exit`/`plan.enter`/`ask_user`) und
# geteilter Plan-Zustand (`/plan show|edit|list|open`, Shift+Tab-Sperre).
harw-tool-plan = { path = "../harw-tool-plan" }
# Plan R9, Teil F: Jobs-Gruppe im Agenten-Panel, Detailansicht mit Log-Ende,
# Beenden-Dialog (stoppen oder ablösen).
harw-tool-job = { path = "../harw-tool-job" }
harw-tools = { path = "../harw-tools" }
# Terminalgroessen-Klassifikation (wide/portrait-dock/summary/compact) und
# Dock-Geometrie fuer den angehefteten Agenten-/Jobs-Bereich in schmalen,
# hohen Terminals (src/panes.rs).
harw-tui-layout = { path = "../harw-tui-layout" }
harw-session-store = { path = "../harw-session-store" }
harw-types = { path = "../harw-types" }
# `unstable-rendered-line-info` schaltet `Paragraph::line_count` frei. Ohne sie
# müsste die Chat-Historie ihre Zeilen doppelt zählen (einmal ungewrappt für den
# Scroll-Offset, einmal gewrappt beim Rendern), was das Scrollen verfälscht.
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
# Strukturierte Diagnose im Approval-/Child-Resume-Treiber (`src/approval.rs`).
# Version bewusst identisch zu harw-cli/Cargo.toml.
tracing = "0.1.44"
serde_json = "1"
harw-home = { version = "0.9.2", path = "../harw-home" }
harw-runtime = { path = "../harw-runtime" }
# `PendingApproval::requested_at`/`timeout_at` (harw-core) sind `jiff::Timestamp`;
# der Freigabe-/Wiederaufnahme-Treiber (`src/approval.rs`) liest den
# kernseitigen Ablaufzeitpunkt statt eine eigene Frist zu führen.
jiff = { workspace = true }
# Uhrzeit und Datum für die einmalige, kontextbezogene TUI-Begrüßung.
time = { version = "0.3.53", features = ["formatting"] }
# Runde 5, Teil B: genullter Passwortpuffer des sudo-Fensters (`src/sudo_dialog.rs`);
# dieselbe Fassung wie im übrigen Baum (Cargo.lock: zeroize 1.8).
zeroize = "1"

[dev-dependencies]
harw-tools = { path = "../harw-tools" }
harw-operations = { path = "../harw-operations" }
harw-provider = { path = "../harw-provider" }
secrecy = "0.8"
tempfile = "3.27.0"
# Zeitstempel für Plan-/Knoten-Fixtures in den Zellen-Tests. Version und Features
# bewusst identisch zu harw-plan/Cargo.toml, damit im Workspace nur eine
# `time`-Auflösung existiert.
time = { version = "0.3.53", features = [
    "serde",
    "serde-well-known",
    "formatting",
    "parsing",
] }

[lints]
workspace = true
