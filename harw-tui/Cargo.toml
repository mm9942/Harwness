[package]
publish.workspace = true
name = "harw-tui"
description = "Command-shell primitives for Harwness TUI: input classification, parsing, command dispatch, and permission enforcement."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
toml = { workspace = true }
harw-authority = { path = "../harw-authority" }
crossterm = "0.29.0"
harw-agent-artifact = { path = "../harw-agent-artifact" }
harw-agent-dsl = { path = "../harw-agent-dsl" }
harw-catalog = { path = "../harw-catalog" }
harw-config = { path = "../harw-config" }
harw-core = { path = "../harw-core" }
harw-explorer = { path = "../harw-explorer" }
harw-context = { path = "../harw-context" }
harw-lens-types = { path = "../harw-lens-types" }
harw-extension-api = { path = "../harw-extension-api" }
# Atomic, overwrite-safe writing of the `/export` Markdown file (src/export.rs).
harw-fsutil = { path = "../harw-fsutil" }
harw-registry-defaults = { path = "../harw-registry-defaults" }
harw-model-catalog = { path = "../harw-model-catalog" }
harw-operations = { path = "../harw-operations" }
harw-memory = { path = "../harw-memory" }
harw-ops = { path = "../harw-ops" }
# Plan and goal rendering in the history view (`PlanGraphCell`, `GoalCell`).
harw-plan = { path = "../harw-plan" }
harw-protocol = { path = "../harw-protocol" }
harw-sandbox = { path = "../harw-sandbox" }
harw-tool-shell = { path = "../harw-tool-shell" }
# Round 5, part F: plan question channel (`plan.exit`/`plan.enter`/`ask_user`)
# and shared plan state (`/plan show|edit|list|open`, Shift+Tab lock).
harw-tool-plan = { path = "../harw-tool-plan" }
# Plan R9, part F: jobs group in the agents panel, detail view with log tail,
# termination dialog (stop or detach).
harw-tool-job = { path = "../harw-tool-job" }
harw-tools = { path = "../harw-tools" }
# Terminal size classification (wide/portrait-dock/summary/compact) and
# dock geometry for the pinned agents/jobs area in narrow, tall terminals
# (src/panes.rs).
harw-tui-layout = { path = "../harw-tui-layout" }
harw-session-store = { path = "../harw-session-store" }
harw-types = { path = "../harw-types" }
# `unstable-rendered-line-info` unlocks `Paragraph::line_count`. Without it,
# the chat history would have to count its lines twice (once unwrapped for the
# scroll offset, once wrapped when rendering), which distorts scrolling.
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
# Structured diagnostics in the approval/child-resume driver (`src/approval.rs`).
# Version deliberately identical to harw-cli/Cargo.toml.
tracing = "0.1.44"
serde_json = "1"
harw-home = { version = "0.9.1", path = "../harw-home" }
harw-runtime = { path = "../harw-runtime" }
# `PendingApproval::requested_at`/`timeout_at` (harw-core) are `jiff::Timestamp`;
# the approval/resume driver (`src/approval.rs`) reads the core-side expiry
# time instead of keeping its own deadline.
jiff = { workspace = true }
# Time and date for the one-time, context-aware TUI greeting.
time = { version = "0.3.53", features = ["formatting"] }
# Round 5, part B: zeroized password buffer of the sudo window (`src/sudo_dialog.rs`);
# same version as in the rest of the tree (Cargo.lock: zeroize 1.8).
zeroize = "1"

[dev-dependencies]
harw-tools = { path = "../harw-tools" }
harw-operations = { path = "../harw-operations" }
harw-provider = { path = "../harw-provider" }
secrecy = "0.8"
tempfile = "3.27.0"
# Timestamps for plan/node fixtures in the cell tests. Version and features
# deliberately identical to harw-plan/Cargo.toml, so that the workspace has
# only one `time` resolution.
time = { version = "0.3.53", features = [
    "serde",
    "serde-well-known",
    "formatting",
    "parsing",
] }

[lints]
workspace = true
