[package]
publish.workspace = true
name = "harwness-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Stable, documented embedding API for Harwness"

# The SDK is the semver boundary: its public surface names no type from any
# `harw-*` crate. Everything beneath it is an implementation detail and may
# change without a major bump of the SDK. The only exception is the
# `unstable-internals` feature, which explicitly unlocks raw extension points
# without any stability guarantee.

[features]
default = ["browser"]
# Browser tools of the root session (passes through to `harw-runtime/browser`).
browser = ["harw-runtime/browser"]
# Raw extension points (custom `ToolProvider`/`ContextProvider`/
# `ModelProvider`, `secrets:` resolver). NO semver guarantee.
unstable-internals = ["dep:harw-provider-http"]

[dependencies]
harw-config = { path = "../harw-config" }
harw-core = { path = "../harw-core" }
harw-extension-api = { path = "../harw-extension-api" }
harw-home = { path = "../harw-home" }
harw-protocol = { path = "../harw-protocol" }
harw-provider-http = { path = "../harw-provider-http", optional = true }
harw-runtime = { path = "../harw-runtime", default-features = false }
harw-session-store = { path = "../harw-session-store" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
# Public: tool arguments/results and event payloads are JSON.
serde_json = { workspace = true }
# `Stream` trait for `EventStream` (identical to `tokio_stream::Stream`).
futures-core = "0.3.32"
# No `[workspace.dependencies]` entry for tokio; version = Cargo.lock.
tokio = { version = "1.53.0", features = ["rt", "sync", "time", "macros"] }
# `BroadcastStream` over the `AgentEventHub` (version = Cargo.lock).
tokio-stream = { version = "0.1.18", features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal"] }
# `tests/embedded_session.rs` (#22 wave 3A): builds a test artifact directly
# via the compiler and artifact path, no network, no runtime coupling.
harw-agent-artifact = { path = "../harw-agent-artifact" }
harw-agent-dsl = { path = "../harw-agent-dsl" }
time = "0.3.53"

[[example]]
name = "minimal_chat"

[[example]]
name = "streaming_events"

[[example]]
name = "custom_tool"

[lints]
workspace = true
