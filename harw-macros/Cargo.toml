[package]
publish.workspace = true
name = "harw-macros"
description = "Proc-macros for error enums, tool bindings, argument parsing, and observability."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
harw-operations = { path = "../harw-operations" }
harw-observe = { path = "../harw-observe" }
# AW2-06 (`#[derive(SensorSource)]`): target types for positive tests and trybuild.
# Cyclic with these crates' normal dependencies on `harw-macros`
# (the same Cargo dev-dependency exception as for `harw-observe`
# above) — Cargo allows this because dev-dependencies are not part of the
# graph that a consumer of this crate sees as a library.
harw-dod-cap = { path = "../dod/crates/harw-dod-cap" }
harw-dod-signals = { path = "../dod/crates/harw-dod-signals" }
harw-dod-readfs = { path = "../dod/crates/harw-dod-readfs" }
harw-types = { path = "../harw-types" }
# AW5-01 (`warden_actions!`): `ProposedAction::tool_schema()` returns a
# `harw_tools::ToolSpec`; needed for positive tests and trybuild. Likewise
# cyclic with `harw-tools`' normal dependency on `harw-macros`
# (the same dev-dependency exception as above for `harw-observe`).
harw-tools = { path = "../harw-tools" }
blake3 = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
jiff = { workspace = true }
tempfile = { workspace = true }
trybuild = "1.0.118"

[lints]
workspace = true
