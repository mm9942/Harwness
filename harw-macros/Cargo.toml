[package]
publish.workspace = true
name = "harw-macros"
description = "Proc-macros for error enums, tool bindings, argument parsing, and observability."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
harw-test-support = { path = "../harw-test-support" }
harw-operations = { path = "../harw-operations" }
harw-observe = { path = "../harw-observe" }
# AW2-06 (`#[derive(SensorSource)]`): Zieltypen für Positivtests und trybuild.
# Zyklisch mit den normalen Abhängigkeiten dieser Crates auf `harw-macros`
# zurück (dieselbe Cargo-Dev-Dependency-Ausnahme wie bei `harw-observe`
# oben) — Cargo erlaubt das, weil Dev-Dependencies nicht Teil des
# Graphen sind, den ein Abnehmer dieser Crate als Bibliothek sieht.
harw-dod-cap = { path = "../dod/crates/harw-dod-cap" }
harw-dod-signals = { path = "../dod/crates/harw-dod-signals" }
harw-dod-readfs = { path = "../dod/crates/harw-dod-readfs" }
harw-types = { path = "../harw-types" }
# AW5-01 (`warden_actions!`): `ProposedAction::tool_schema()` returns a
# `harw_tools::ToolSpec`; needed for Positivtests und trybuild. Ebenfalls
# zyklisch mit `harw-tools`' normaler Abhängigkeit auf `harw-macros` zurück
# (dieselbe Dev-Dependency-Ausnahme wie oben bei `harw-observe`).
harw-tools = { path = "../harw-tools" }
blake3 = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
jiff = { workspace = true }
tempfile = { workspace = true }
trybuild = "1.0.118"

[lints]
workspace = true
