[package]
publish.workspace = true
name = "harw-session-host"
description = "Persistent session control plane host: single writer of hosted sessions, attach/replay/fan-out, input arbitration, approvals and capability/tenant admission (W00 §2.4)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
owner-creation-receipts = ["dep:aws-lc-rs"]

[dependencies]
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"], optional = true }
harw-protocol = { path = "../harw-protocol" }
harw-types = { path = "../harw-types" }
harw-session-store = { path = "../harw-session-store" }
harw-job-core = { path = "../harw-job-core" }
harw-fsutil = { path = "../harw-fsutil" }
harw-media = { path = "../harw-media" }
base64 = "0.23.1"
blake3 = { version = "1.8.7", features = ["zeroize"] }
chacha20poly1305 = "0.11.0"
crypt_guard = { workspace = true }
zeroize = "1.9.0"
# R18 D-A: gateway tool host. Executors and their vocabulary (`harw-tools`),
# the gateway-side sandbox authority (`harw-authority`: `SandboxSpec`,
# `ensure_child_of`) and the process sandbox probe (`harw-sandbox`:
# `BwrapLauncher::discover`). None of them reaches hyper or tungstenite.
harw-tools = { path = "../harw-tools" }
harw-authority = { path = "../harw-authority" }
harw-sandbox = { path = "../harw-sandbox" }
# stepup: Nonce und Hash.
getrandom = { version = "0.4.2", features = ["std"] }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
tokio ={ version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
fs4 = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }

[lints]
workspace = true
