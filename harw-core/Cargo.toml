[package]
publish.workspace = true
name = "harw-core"
description = "Agent session finite state machine, turn loop, and session orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-agent-dsl = { path = "../harw-agent-dsl" }
harw-types = { path = "../harw-types" }
harw-protocol = { path = "../harw-protocol" }
harw-tools = { path = "../harw-tools" }
harw-extension-api = { path = "../harw-extension-api" }
# AW1-03: `Assembly<Gathered|Admitted|Budgeted>` in `context_budget.rs` packs
# `harw_context::Fragment`s against a `ContextCeiling`/`ContextBudgetSpec`.
harw-context = { path = "../harw-context" }
# AW1-03: `Fragment::cost` and `ContextAssemblyV2::spent` are both
# `harw_lens_types::CostEstimate` — named directly, not just transitively.
harw-lens-types = { path = "../harw-lens-types" }
harw-macros = { path = "../harw-macros" }
harw-sandbox = { path = "../harw-sandbox" }
harw-catalog = { path = "../harw-catalog" }
harw-config = { path = "../harw-config" }
harw-session-store = { path = "../harw-session-store" }
harw-job-core = { path = "../harw-job-core" }
# AW4-01: `context_budget::render_trust_blocks` embeds the canonical data-block
# notice from `harw_instructions::DATA_BLOCK_NOTICE`, defined exactly once so
# the system-prompt-level explanation and the rendered data block always agree.
harw-instructions = { path = "../harw-instructions" }
harw-observe = { path = "../harw-observe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
# Randomness source for fresh span IDs on trace handoff to a child
# (AW1-01b). Version/feature line identical to `harw-types`, which binds the same
# crate for its ID newtypes — no new, uncoordinated version.
uuid = { version = "1", features = ["v4"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
