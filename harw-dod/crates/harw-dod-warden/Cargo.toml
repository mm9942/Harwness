[package]
publish.workspace = true
name = "harw-dod-warden"
description = "Executes security actions on cgroups and processes: freeze, isolate, terminate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Wire-Vokabular und die Prüfung von Proof v2 (`WardenRequest::verify`,
# `SignedAuthorization`, `KeyRing`, `ProofPolicy`, `NonceLedger`) — siehe
# lib.rs-Moduldoku, Abschnitt „Abhängigkeitsbudget".
harw-dod-warden-proto = { path = "../harw-dod-warden-proto" }
# `CgroupId`/`FindingId`/`ApprovalActor` direkt: der Warden liest
# cgroup-Kennungen aus WardenAction-Varianten, um sie an Ausführungs-Traits
# zu reichen, und schreibt Befund und Freigebenden ins Aktions-Ledger.
# Bereits vollständig durch `harw-dod-warden-proto` transitiv mitgebracht —
# kein einziges neues Blatt-Crate.
harw-types = { path = "../../../harw-types" }
# `#[derive(harw_macros::HarwError)]` für `error.rs` — wie bei der
# proto-Crate ausschließlich dafür, nie für `warden_actions!`. Ebenfalls
# bereits transitiv vorhanden.
harw-macros = { path = "../../../harw-macros" }
# PL-100 WP 3.1: Zustandsdateien im StateDirectory (Aktions-Ledger, Holds)
# als JSON. `serde`/`serde_json` liegen über `harw-dod-warden-proto` bereits
# in der Warden-Hülle — kein neues Paket.
serde = { workspace = true }
serde_json = { workspace = true }
# PL-100 WP 3.1: Zeitpunkte für Nonce-Aufbewahrung, Hold-Fälligkeit und
# Ledger-Einträge. Bereits über `harw-dod-warden-proto` in der Hülle.
jiff = { workspace = true }
# PL-100 WP 3.1: Hash-Kette des Aktions-Ledgers. Bereits über
# `harw-dod-warden-proto` (MAC) in der Hülle.
blake3 = { workspace = true }
# PL-100 WP 3.1 (B21, Prüfung und Eingriff über denselben Deskriptor):
# `openat` für das cgroup-Verzeichnis (`O_DIRECTORY | O_NOFOLLOW`) und die
# Kontrolldatei relativ dazu, `O_NOFOLLOW` für die Zustandsdateien,
# `geteuid` für den Eigentümer des StateDirectory. Dieselbe gepinnte
# Fassung, die `harw-warden` bereits (mit `net`) nutzt: kein neues Paket in
# der Warden-Hülle; die Features `fs` und `process` ziehen keine weitere
# Abhängigkeit (geprüft gegen `rustix-1.1.5/Cargo.toml`, `[features]`).
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
harw-test-support = { path = "../../../harw-test-support" }
# Nur für die Dateisystem-Tests (Tempdir statt echtem `/sys/fs/cgroup`,
# `/etc/harw-dod` und StateDirectory). Reine Dev-Dependency.
tempfile = { workspace = true }

[lints]
workspace = true
