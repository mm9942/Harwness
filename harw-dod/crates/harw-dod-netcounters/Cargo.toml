[package]
publish.workspace = true
name = "harw-dod-netcounters"
description = "Network interface counters from /proc/net/dev: rx/tx bytes, packets, errors, drops."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Zugriffsvokabular: Capability, ReadScope, SensorHandle, SensorError.
harw-dod-cap = { path = "../harw-dod-cap" }
# Datenvokabular und der eine `trait Sensor`, den dieser Sensor implementiert.
harw-dod-signals = { path = "../harw-dod-signals" }
# Die eine Dateisystem-Naht: `read_line_fields` liest `/proc/net/dev`, nie
# direktes `std::fs` (siehe src/lib.rs-Moduldoku).
harw-dod-readfs = { path = "../harw-dod-readfs" }
# `SensorId` für `SensorHandle`.
harw-types = { path = "../../../harw-types" }
# Verbindliche Abhängigkeit jeder Sensor-Crate laut Arbeitsauftrag AW2-11.
# `#[derive(harw_macros::SensorSource)]` selbst trägt genau ein
# glob-adressiertes Feld mit genau einem zur Kompilierzeit festen Metriknamen
# für jeden Treffer (siehe `harw-macros/src/sensor_source.rs`,
# `expand_sensor_source`: "SensorSource erlaubt genau ein Feld mit
# `#[source(...)]`"). `/proc/net/dev` ist weder ein glob-adressierbares Muster
# über mehrere Dateien (es ist eine einzige Datei) noch trägt es einen
# einzigen Skalar je Treffer (jede Zeile trägt sechzehn Spalten, und jede
# Schnittstelle braucht außerdem ein eigenes Label im Metriknamen, das der
# Feld-Metrikname des Makros nicht ausdrücken kann) — dafür passt das Makro
# nicht (siehe src/lib.rs-Moduldoku, Abschnitt „Warum kein
# `#[derive(SensorSource)]`"). Aktuell ungenutzt, analog zur unbenutzten
# `harw-observe`-Abhängigkeit in `harw-dod-signals/Cargo.toml` und zur
# unbenutzten `harw-macros`-Abhängigkeit in `harw-dod-cpu/Cargo.toml`.
harw-macros = { path = "../../../harw-macros" }
jiff = { workspace = true }

[dev-dependencies]
harw-test-support = { path = "../../../harw-test-support" }
# `sensor_suite!` — die geerbte Fixture-Testsuite (sechs Pflichtprüfungen).
harw-dod-fixtures = { path = "../harw-dod-fixtures" }
tempfile = { workspace = true }
# Ausschließlich für den Inhaltsfreiheits-Test „keine Adresse/kein Port im
# serialisierten Ergebnis" (siehe `src/sensor.rs`-Tests): `HostSample`
# implementiert `serde::Serialize`, aber `harw_dod_fixtures::sensor_suite!`
# serialisiert nicht öffentlich — dieser eine zusätzliche, crate-eigene Test
# serialisiert deshalb selbst.
serde_json = { workspace = true }

[lints]
workspace = true
