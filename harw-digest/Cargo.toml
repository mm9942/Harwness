[package]
publish.workspace = true
name = "harw-digest"
description = "Blake3 content digest: stable 32-byte hashes serialized as lowercase hex"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `ContentDigest::of` hashes with blake3 (moved here from `harw-types` along
# with `ContentDigest`, including the finding):
# FINDING (gate run, `warden-no-c-build`): `blake3` 1.8.7 requires in its
# own pinned source (`~/.cargo/registry/src/.../blake3-1.8.7/Cargo.toml`)
# `[build-dependencies.cc]` **without** `optional = true` — this edge is
# unconditional, for every feature combination. Verified: the `pure` feature
# (`pure = []`) only disables the SIMD assembly / C intrinsics paths in
# `build.rs` (pure Rust intrinsics are built) — it neither removes the
# `cc` build dependency from the manifest nor prevents the
# C-compiler probe call `c_compiler_support()` in `build.rs`, which on
# x86/x86_64 targets is executed regardless of `pure` (only the
# *failure* of this probe is harmless with `pure`, see the `main()` logic
# there). So there is **no** feature whose deselection eliminates this
# finding without changing the version (forbidden by the task) — a
# genuine violation that cannot be fixed with the permitted means.
# `ContentDigest` stays unchanged on `blake3` with default features (`std`),
# since a feature change would bring no benefit here and unverified
# deselection is forbidden.
# Dated exception for this: `C_BUILD_EXCEPTIONS` in `xtask/src/gate_warden.rs`.
blake3 = { workspace = true }
# Hex string as wire format (`Serialize`/`Deserialize` by hand).
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
