[package]
name = "harw-tool-cargo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typisierte Cargo-Werkzeuge (cargo.check/build/test/clippy/fmt_check/metadata/tree/doc) mit zusammengefasster Ausgabe; Prozessstart ausschließlich über den injizierten shell.exec-Ausführer."
publish.workspace = true

[dependencies]
harw-extension-api = { path = "../harw-extension-api" }
harw-macros = { path = "../harw-macros" }
harw-tool-fsread = { path = "../harw-tool-fsread" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
# Gleiche Fassungen wie im Workspace (Cargo.lock): keine neue Abhängigkeit.
# `fs`: `unlinkat` zum Entfernen der eigenen Metadata-Zwischendatei (dirfd-relativ).
rustix = { workspace = true, features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
harw-authority = { path = "../harw-authority" }
harw-test-support = { path = "../harw-test-support" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
