[package]
publish.workspace = true
name = "harw-lens-embed"
description = "Embedding catalog: model specifications, descriptors, runtime profiles, and embedder routing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-lens-types = { path = "../harw-lens-types" }
harw-types = { path = "../harw-types" }
harw-macros = { path = "../harw-macros" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
blake3 = { workspace = true }
# Transport for `http_backend::HttpEmbedBackend` (node AW7-06). Version and
# feature selection ("blocking", "json", "rustls-tls") deliberately follow
# `harw-provider-http`'s already existing, already vetted choice -- no
# second, divergent reqwest configuration in the tree. "blocking" is added
# because `Embedder::embed` is synchronous (see the module docs of `http_backend` for the
# resulting caller obligation in async contexts).
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
# Keeps the API key out of debug output -- the same crate that
# `harw-provider-http` already uses for the same purpose.
secrecy = "0.10.3"

[lints]
workspace = true
