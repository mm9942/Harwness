# Embedding catalog for `harw-lens-embed` (node AW4-07).
#
# Embedded at compile time via `include_str!` in `EmbeddingCatalog::load_default`
# -- no filesystem access at runtime.
#
# Each `[[model]]` entry carries three separate static layers:
#   - `model.spec`       -- what the model IS (immutable)
#   - `model.descriptor` -- how to USE it (prefixes, normalization)
#   - `model.runtime`    -- what APPLIES at runtime (backend, location, batch size)
# The fourth layer, `ObservedBehavior` (what was measured), is intentionally
# not in this file -- it starts out empty and is filled at runtime, never
# prescribed statically.
#
# `roles` binds a model to the `EmbeddingRole` values for which `route`
# considers it.
#
# Since node AW7-06 the second `[[model]]` below carries the real model name
# of an existing OpenAI-compatible embedding model
# (`text-embedding-3-large`, 3072 dimensions) instead of a generic
# placeholder -- its `model.runtime.backend` value
# (`http-embed-openai-compatible`) describes the transport that
# `src/http_backend.rs::HttpEmbedBackend` implements. The catalog entry only
# describes WHAT the model is and WHAT it is responsible for; it does not
# construct an `Embedder` itself -- that remains the caller's job
# (see `HttpEmbedBackend::new`, which takes a base URL and API key that no
# `embeddings.toml` field can carry without putting a secret into an
# embedded file).

[[model]]
roles = ["code", "confidential"]

[model.spec]
name = "local-minilm-l6-v2"
dimensions = 384
metric = "cosine"
max_input_chars = 2048

[model.descriptor]
document_prefix = "passage: "
query_prefix = "query: "
normalize = true

[model.runtime]
backend = "onnx-local"
locality = "local"
batch_size = 32

[[model]]
roles = ["prose", "query"]

[model.spec]
name = "text-embedding-3-large"
dimensions = 3072
metric = "cosine"
max_input_chars = 8192

[model.descriptor]
document_prefix = "passage: "
query_prefix = "query: "
normalize = false

[model.runtime]
backend = "http-embed-openai-compatible"
locality = "remote"
batch_size = 64
