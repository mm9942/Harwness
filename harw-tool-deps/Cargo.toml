[package]
publish.workspace = true
name = "harw-tool-deps"
description = "Workspace dependency graph, locked versions, and dependency source code inspection tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-code-graph = { path = "../harw-code-graph" }
harw-extension-api = { path = "../harw-extension-api" }
harw-macros = { path = "../harw-macros" }
harw-sandbox = { path = "../harw-sandbox" }
harw-tools = { path = "../harw-tools" }
# `serde`/`serde_json` are mandatory dependencies for `#[harw_macros::tool]`:
# the generated executor prologue calls `::serde_json::from_value`.
# Version specification deliberately identical to harw-tool-fs (workspace convention);
# the exact resolution is taken care of by the workspace Cargo.lock.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
harw-types = { path = "../harw-types" }
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
