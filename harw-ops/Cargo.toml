[package]
publish.workspace = true
name = "harw-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# /analyze: projektneutraler Einheiten-Graph (Projekte + Relationen).
harw-explorer = { path = "../harw-explorer" }
harw-authority = { path = "../harw-authority" }
harw-operations = { path = "../harw-operations" }
harw-macros = { path = "../harw-macros" }
harw-types = { path = "../harw-types" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
harw-config = { path = "../harw-config" }
harw-home = { path = "../harw-home" }
# Auslastungskanal (`ProviderLoadStatus`/`ProviderLoadControl`/
# `ProviderLoadRegistry`) für `/provider show`, `/status` und
# `/provider-concurrency`. Kein Zyklus: harw-provider-http hängt nur von
# harw-config/harw-core/harw-oauth/harw-fsutil/harw-protocol/harw-provider/
# harw-sandbox/harw-tools/harw-types ab, keiner davon zurück auf harw-ops
# (geprüft, siehe Cargo.toml-Audit dieser Zeile).
harw-provider-http = { path = "../harw-provider-http" }
harw-memory = { path = "../harw-memory" }
harw-model-catalog = { path = "../harw-model-catalog" }
harw-provider = { path = "../harw-provider" }
harw-session-store = { path = "../harw-session-store" }
harw-job-runtime = { path = "../harw-job-runtime" }
harw-extension-api = { path = "../harw-extension-api" }
harw-tool-shell = { path = "../harw-tool-shell" }
harw-tools = { path = "../harw-tools" }
# `sandbox-lease` wartet mit
# `tokio::time::timeout` auf die Antwort eines `HostPermitPrompt` (dieselbe
# Frist wie `harw_tool_shell::HOST_PERMIT_PROMPT_TIMEOUT`). `tokio` stand
# bislang nur unter `[dev-dependencies]` (für `#[tokio::test]`); das reicht
# für Produktionscode nicht, weil ein Crate `tokio::...`-Pfade nur benutzen
# darf, wenn es selbst als Abhängigkeit deklariert ist — auch wenn `tokio`
# bereits transitiv über harw-tool-shell im Graphen liegt. Nur `time`
# zusätzlich zur ohnehin vorhandenen dev-dependency-Featureliste, keine neue
# externe Crate. `process`/`io-util`/`macros`: das `diff`-Werkzeug startet
# `git` als rein lesenden Prozess in einer eigenen bwrap-Sandbox
# (`src/diff.rs`), mit Zeitlimit und begrenzter Ausgabe.
tokio = { version = "1.52.3", features = ["time", "process", "io-util", "macros"] }
# UIA-Delegationsrouting (`explore`/`research_web`): `AgentRoleId` wird
# gebraucht, um die aufrufende `organizational_role` gegen `UserInterface`
# zu prüfen. Vormals nur dev-dependency für Test-Fixtures — jetzt auch in
# Produktionscode benötigt.
harw-agent-dsl = { path = "../harw-agent-dsl" }
jiff = { workspace = true }
# Wellen-Fortschritt des `analyze`-Fan-outs (Spans je Ebene, Events je Kind).
tracing = "0.1.44"
harw-core = { path = "../harw-core" }
# Planungs-Fläche (`/plan`, `/goal`): Kern-Typen und Store-Trait aus harw-plan,
# die Kontext-Anbindung (`OpContextPlanExt`) und der Controller aus der Bridge.
harw-plan = { path = "../harw-plan" }
harw-plan-bridge = { path = "../harw-plan-bridge" }
# Runde 5, Teil P: Bestätigungskanal (`PlanConfirmChannel`) der `plan`-Operation
# zum Freigabefenster der TUI. Kein Zyklus: harw-tool-plan hängt nicht an harw-ops.
harw-tool-plan = { path = "../harw-tool-plan" }
# Strukturierte Kind-Rückgaben: `explore`/`research_*` parsen und validieren
# `ResearchFinding`, `analyze` legt sie über den FindingStore ab.
harw-research = { path = "../harw-research" }
# `analyze` baut den Crate-Graphen des Workspaces (leaf-first Ebenen) ohne
# cargo-Subprozess — read-only Kinder haben kein `ExecuteProcess`.
harw-code-graph = { path = "../harw-code-graph" }
# Rollennamen (`role_names::EXPLORER` …) als Single Source of Truth für
# `Surface::AgentTool.child_name`; kein Zyklus, weil registry-defaults die
# Tool-Provider zusammenbaut und keine Operationen kennt.
harw-registry-defaults = { path = "../harw-registry-defaults" }
# Fan-out aus einer Operation heraus (`analyze`): Kind-Kontext und
# Return-Contract-Auflösung laufen über die Core-Bridge.
harw-core-bridge = { path = "../harw-core-bridge" }
# Autoritätsreduktion für Kind-Sandboxes (`SandboxSpec::restrict`) — bislang
# nur Testabhängigkeit, jetzt auf dem Produktivpfad von `explore`/`analyze`.
harw-sandbox = { path = "../harw-sandbox" }
# `harw_plan::PlanNode`/`EvidenceRef`/`Goal` datieren in `time::OffsetDateTime`;
# diese Crate muss dieselbe Zeitachse benutzen, damit die Typen identisch sind.
# Version bewusst identisch zu harw-plan/harw-plan-bridge gepinnt.
time = "0.3.53"
# AW5-09: `/context-proposal`-Prüffläche (list/view/accept/reject) über
# `ContextProposal` (AW5-09). Kein Zyklus: `harw-knowledge` hängt nicht von
# `harw-ops` ab.
harw-knowledge = { path = "../harw-knowledge" }
# Bestätigungsfläche (`approval.pending`/`approval.resolve`, UI-06-Folgeknoten):
# `security::pending_approval`/`security::resolve_approval`, `PeerCredentials`
# und `ApprovalActorResolver` stammen aus `harw-web`. Kein Zyklus: `harw-web`
# hängt nicht von `harw-ops` ab (geprüft).
harw-web = { path = "../harw-web" }
# Slice B4 (`/permissions`): liest `[permissions]` aus einer Projekt-/Global-
# Datei zurück, um Herkunft und Löschziele einer Regel zu bestimmen —
# `harw_config::ConfigWriter` selbst bietet dafür keine Enumerations-API.
toml = { workspace = true }
# `/provider switch`/`/model switch` verankern die zuletzt gewählte
# Auswahl bestes Bemühen als Profil-Default (`config_util::persist_default_selection`)
# über denselben kommentarerhaltenden Editor wie `/permissions`.
# Version bewusst identisch zu harw-config gepinnt (ein einziges resolvtes toml_edit).
toml_edit = "0.25.13"
# `/matrix` (Matrix Game live): deterministischer Spielkern (Szenario,
# Journal, Sichtbarkeit, Phasen, Prompts, AAR). Kein Zyklus: `harw-matrix-game`
# hat keine harw-Abhängigkeiten.
harw-matrix-game = { path = "../harw-matrix-game" }
# Plan R9, Teil F: `/jobs` (Hintergrund-Jobs der Sitzung ansehen, stoppen,
# Logs lesen). Kein Zyklus: `harw-tool-job` hängt nicht von `harw-ops` ab.
harw-tool-job = { path = "../harw-tool-job" }
# #22 Welle 2B: `/agent check|build|inspect|graph|explain|…` (dieselben
# Befehle wie `harw agent …`; `build` läuft als Job).
harw-agent-compiler = { path = "../harw-agent-compiler" }
# Crypto-Infrastruktur H5: `infra.*`-Operationen (`src/infra.rs`) lesen
# `Arc<InfrastructureAvailability>` aus dem `OpContext` und rufen die typisierten
# Clients (AuthHub/NetSec/SecurityHub); keine Operation öffnet selbst einen
# Socket. Kein Zyklus: `harw-infra-client` (Schicht I) hängt von keiner
# harw-Crate ab.
harw-infra-client = { path = "../harw-infra-client" }

[features]
# Forwards to harw-provider's ChatGPT OAuth flag so `--features chatgpt-oauth`
# on this crate actually enables the corresponding cfg in harw-provider.
chatgpt-oauth = ["harw-provider/chatgpt-oauth"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
secrecy = "0.8"
# Slice B4: Persistenz-Rundlauf-Tests (`/permissions`, `/add-workdir`,
# `/memory`) gegen ein temporäres Verzeichnis statt echter `HARW_HOME`/`HOME`-
# Env-Mutation (nicht thread-sicher, würde parallele Tests gefährden).
tempfile = { workspace = true }
# Runde 9, E7: `runner/tests/spawner_chain.rs` implementiert
# `ChildRegistryFactory`, dessen Signatur `harw_catalog::AgentSuggestions`
# nennt. Kein Zyklus: harw-catalog hängt nicht von harw-ops ab (liegt ohnehin
# transitiv über harw-core im Graphen).
harw-catalog = { path = "../harw-catalog" }
# AW5-09: `context_proposal.rs`-Tests bauen einen `DefinitionId`
# (`harwness.context.base@1`) als Fixture. Kein Zyklus: `harw-agent-dsl`
# hängt nicht von `harw-ops` ab (geprüft).
# (harw-agent-dsl ist jetzt eine normale [dependencies]-Zeile oben, da es
# auch in Produktionscode gebraucht wird — hier keine Dopplung nötig.)

[lints]
workspace = true
