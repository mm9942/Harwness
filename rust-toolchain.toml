# Pinned Rust toolchain for local builds and CI.
#
# rustup reads this file in the repo root and in every
# subdirectory (also under `dod/`, whose crates have been members of the
# root workspace since PL-60 and therefore need no file of their own). Locally and
# in CI, the same compiler, rustfmt and clippy version is thus checked.
# Updates deliberately come via Dependabot (ecosystem `rust-toolchain`,
# see `.github/dependabot.yml`).
# The MSRV in `Cargo.toml` (`rust-version`) remains unaffected.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
