[package]
publish.workspace = true
name = "harw-mcp-client"
description = "Minimal MCP client for remote HTTP servers with JSON-RPC, Bearer auth, and SSE responses"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-extension-api = { path = "../harw-extension-api" }
harw-tools = { path = "../harw-tools" }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"

[lints]
workspace = true
