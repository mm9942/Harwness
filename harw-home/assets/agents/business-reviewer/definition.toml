# Mitgelieferter Agent `business-reviewer` (Plan R9, Teil B: migriert aus dem
# Legacy-Format `agent.toml`; `system.md` bleibt die Arbeitsanweisung und
# wird per `instructions_file` in den Kontext des Kindes gelegt).
#
# Benutzerdefinierter Worker auf `worker-base@1`. Die Laufzeit klemmt ihn
# unter die Decke des generischen read-only Workers (Analyst-
# Decke, ohne Netz, Spawn-Tiefe höchstens 1) — siehe
# `harw_registry_defaults::roster`.

schema = "harwness.agent/v1"
id = "harwness.agent.business-reviewer@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "business-reviewer"

name = "Business Reviewer"
description = "Prüft Business-Entwürfe auf Logik, Kernaussage-zuerst, überschneidungsfreie Gruppierung, Belege und Risiken und liefert strukturierte Befunde, ohne umzuschreiben."
instructions_file = "system.md"

skills = ["author-review-pipeline", "business-writing-pyramid"]

[work]
mode = "review"
may_write_code = false
may_research_web = false

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "explore.tree",
  "explore.projects",
  "explore.relations",
  "explore.find",
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
  "parent.message",
  "skills.search",
  "skills.load",
]
forbidden = [
  "fs.write",
  "fs.edit",
  "shell.exec",
  "web.fetch",
  "web.search",
  "web.docs_rs",
  "web.crates_io",
]

[spawn]
max_depth = 0

[spawn.budget]
max_tokens = 100000
max_tool_calls = 50
max_wall_secs = 300

[return]
contract = "harwness.return.execution-summary@1"
