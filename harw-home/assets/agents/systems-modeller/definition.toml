# Analyse-Familie (Plan R9, Teil D): Systems Modeller.
#
# Benutzerdefinierter Worker auf `worker-base@1`. Die Basis besitzt
# `[lifecycle]` und `[context]`; diese Datei besitzt `[work]`, `[tools]`,
# `[spawn]` und `[return]`. Die Laufzeit klemmt die Definition unter die
# Rechtedecke ihrer Basisrolle: `[tools]` kann nur verengen, nie erweitern.
# Die Arbeitsanweisung steht in `system.md` neben dieser Datei
# (`instructions_file`); weitere Methoden-Skills lädt der Agent bei Bedarf
# über `skills.load`.

schema = "harwness.agent/v1"
id = "harwness.agent.systems-modeller@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "systems-modeller"

name = "Systems Modeller"
description = "Analysiert die Struktur eines Sachverhalts als System: verstärkende und ausgleichende Rückkopplungen, Schwellen und Kipppunkte, Verschiedenartigkeit der Akteure, Hebel; Struktur, keine Simulation. Read-only."
instructions_file = "system.md"

skills = ["feedback-loops-and-thresholds"]

[work]
mode = "read-only-analysis"
may_write_code = false
may_research_web = false

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
  "parent.message",
  "skills.search",
  "skills.load",
]
forbidden = [
  "fs.write",
  "fs.edit",
  "shell.exec",
  "web.fetch",
  "web.search",
  "web.docs_rs",
  "web.crates_io",
]

[spawn]
max_depth = 0

[spawn.budget]
max_tokens = 80000
max_tool_calls = 40
max_wall_secs = 600

[return]
contract = "harwness.return.execution-summary@1"
