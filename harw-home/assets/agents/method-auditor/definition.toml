# Analyse-Familie (Plan R9, Teil D): Method Auditor.
#
# Benutzerdefinierter Worker auf `worker-base@1`. Die Basis besitzt
# `[lifecycle]` und `[context]`; diese Datei besitzt `[work]`, `[tools]`,
# `[spawn]` und `[return]`. Die Laufzeit klemmt die Definition unter die
# Rechtedecke ihrer Basisrolle: `[tools]` kann nur verengen, nie erweitern.
# Die Arbeitsanweisung steht in `system.md` neben dieser Datei
# (`instructions_file`); weitere Methoden-Skills lädt der Agent bei Bedarf
# über `skills.load`.

schema = "harwness.agent/v1"
id = "harwness.agent.method-auditor@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "method-auditor"

name = "Method Auditor"
description = "Bewertet die Methode eines Analyseprodukts: Passung zur Frage, Prozess- und Produktqualität, Reproduzierbarkeit, Kalibrierung, Wirksamkeitsnachweis; liefert Punktzahl mit Begründung. Read-only."
instructions_file = "system.md"

skills = ["method-validation"]

[work]
mode = "review"
may_write_code = false
may_research_web = false

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
  "parent.message",
  "skills.search",
  "skills.load",
]
forbidden = [
  "fs.write",
  "fs.edit",
  "shell.exec",
  "web.fetch",
  "web.search",
  "web.docs_rs",
  "web.crates_io",
]

[spawn]
max_depth = 0

[spawn.budget]
max_tokens = 60000
max_tool_calls = 40
max_wall_secs = 480

[return]
contract = "harwness.return.execution-summary@1"
