# Analyse-Familie (Plan R9, Teil D): Evidence Critic.
#
# Benutzerdefinierter Worker auf `worker-base@1`. Die Basis besitzt
# `[lifecycle]` und `[context]`; diese Datei besitzt `[work]`, `[tools]`,
# `[spawn]` und `[return]`. Die Laufzeit klemmt die Definition unter die
# Rechtedecke ihrer Basisrolle: `[tools]` kann nur verengen, nie erweitern.
# Die Arbeitsanweisung steht in `system.md` neben dieser Datei
# (`instructions_file`); weitere Methoden-Skills lädt der Agent bei Bedarf
# über `skills.load`.

schema = "harwness.agent/v1"
id = "harwness.agent.evidence-critic@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "evidence-critic"

name = "Evidence Critic"
description = "Prüft Belege eines Analyseprodukts: Quellenzuverlässigkeit, Auswahlverzerrung, plausible aber unbelegte Behauptungen, Wirksamkeitsnachweise, Rahmung; liefert eine Behalten/Verwerfen-Liste. Read-only."
instructions_file = "system.md"

skills = ["evidence-quality-review"]

[work]
mode = "review"
may_write_code = false
may_research_web = false

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
  "parent.message",
  "skills.search",
  "skills.load",
]
forbidden = [
  "fs.write",
  "fs.edit",
  "shell.exec",
  "web.fetch",
  "web.search",
  "web.docs_rs",
  "web.crates_io",
]

[spawn]
max_depth = 0

[spawn.budget]
max_tokens = 80000
max_tool_calls = 50
max_wall_secs = 600

[return]
contract = "harwness.return.execution-summary@1"
