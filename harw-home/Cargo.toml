[package]
publish.workspace = true
name = "harw-home"
description = "Home directory initialization and path resolution for harw"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uuid = { version = "1.23.5", features = ["v7"] }
# Projekt-Trust (W1-06a): Digest über die sicherheitsrelevanten Dateien eines
# repo-lokalen `.harw`, symlinkfestes Lesen/Walken und atomares 0600-Schreiben
# des Trust-Stores, TOML-(De-)Serialisierung von `trusted-projects.toml`.
# Bewusst KEINE Abhängigkeit auf `harw-config` (Zyklus: harw-config-Tests und
# spätere Aufrufer kombinieren beide Crates, nicht umgekehrt).
blake3 = { workspace = true }
harw-fsutil = { path = "../harw-fsutil" }
serde = { workspace = true }
# Runde 7, Teil T6: SHA-256 der installierten Bundle-Dateien im Manifest
# `<home>/.bundle-manifest.toml` (dieselbe Version wie harw-catalog).
sha2 = "0.11.0"
toml = { workspace = true }

[dev-dependencies]
harw-config = { path = "../harw-config" }
# #22: temporäre Verzeichnisse in den Import-Tests (`src/import.rs`).
tempfile = { workspace = true }
# Plan R9, Teil D: `tests/analysis_family.rs` parst die mitgelieferten
# `definition.toml` als `RawAgentDefinition`. Nur Test-Kante, kein Zyklus:
# harw-agent-dsl hängt nicht von harw-home ab.
harw-agent-dsl = { path = "../harw-agent-dsl" }

[lints]
workspace = true
