[package]
publish.workspace = true
name = "harw-lens"
description = "Facade for the Lens retrieval subsystem: builds and queries searchable indices from documents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The four inner crates whose vocabulary/entry points actually become part of
# the facade surface (see the `//!` block in src/lib.rs for the rationale
# per type/function). `harw-lens-rank`, `harw-lens-chunk`, `harw-lens-store`
# and `harw-lens-index` are deliberately NOT included: no re-exported
# name of this crate refers to their types, and no logic of this
# crate calls them directly (chunking/storage/ranking/search run
# exclusively inside harw-lens-source/harw-lens-query).
harw-lens-types = { path = "../harw-lens-types" }
harw-lens-embed = { path = "../harw-lens-embed" }
harw-lens-source = { path = "../harw-lens-source" }
harw-lens-query = { path = "../harw-lens-query" }
harw-macros = { path = "../harw-macros" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
