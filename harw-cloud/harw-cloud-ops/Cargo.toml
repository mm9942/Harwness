[package]
name = "harw-cloud-ops"
version.workspace = true
edition = "2024"
rust-version = "1.85"
publish = false
license.workspace = true

[dependencies]
harw-macros = { path = "../../harw-macros" }
harw-operations = { path = "../../harw-operations" }
harw-tools = { path = "../../harw-tools" }
harw-cloud-gateway = { path = "../harw-cloud-gateway" }
harw-home = { path = "../../harw-home" }
harw-types = { path = "../../harw-types" }
harw-node-listener = { path = "../../harw-node-listener" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
harw-authority = { path = "../../harw-authority" }
tempfile = { workspace = true }

[lints]
workspace = true
