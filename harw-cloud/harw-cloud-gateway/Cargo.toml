[package]
name = "harw-cloud-gateway"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Harwness cloud gateway configuration and status probing"
publish = false
license.workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tracing = "0.1"
pingora = { version = "0.9", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }

[features]
proxy = ["dep:pingora", "pingora/proxy"]

[lints]
workspace = true
