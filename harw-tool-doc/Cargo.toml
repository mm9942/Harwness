[package]
publish.workspace = true
name = "harw-tool-doc"
description = "Tool for page-by-page PDF reading with Mistral OCR or native text extraction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Higher than workspace.package.rust-version (1.85): oxidize-pdf >=5 (the API
# generation used by doc.read_pdf/native.rs, see design doc
# doc_read_pdf_design.md) itself declares rust-version 1.88. With the
# inherited workspace default, `cargo add`/the MSRV resolver silently falls back to the
# incompatible 2.x series. The installed compiler (1.98.1) satisfies
# 1.88 without trouble; only this crate needs the higher declared MSRV.
rust-version = "1.88"

[dependencies]
harw-authority = { path = "../harw-authority" }
# W5 N-DOC: HTTP client and egress policy for Mistral OCR exclusively from
# harw-egress (scoped resolver, address classes, no auto-redirects, no proxy).
harw-egress = { path = "../harw-egress" }
# Symlink-safe, ELOOP-strict opening of the PDF file below the workspace root.
harw-fsutil = { path = "../harw-fsutil" }
harw-extension-api = { path = "../harw-extension-api" }
harw-macros = { path = "../harw-macros" }
harw-tools = { path = "../harw-tools" }
oxidize-pdf = { version = "5.1.3", default-features = false, features = ["compression"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
base64 = "0.23.1"
secrecy = "0.10"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt", "time"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
