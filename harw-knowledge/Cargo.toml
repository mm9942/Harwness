[package]
publish.workspace = true
name = "harw-knowledge"
description = "Unified markdown+frontmatter knowledge and work artifact store with memory, diary, kanban, and workbench surfaces."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-types = { path = "../harw-types" }
harw-macros = { path = "../harw-macros" }
harw-job-core = { path = "../harw-job-core" }
harw-session-store = { path = "../harw-session-store" }
# `SecurityEvidence`, `Hardness`, `Severity` behind `SecurityFinding` /
# `Baseline` (AW4-05). No cycle: `harw-dod-signals` does not depend on
# `harw-knowledge` (checked at AW4-05 time).
harw-dod-signals = { path = "../dod/crates/harw-dod-signals" }
# `Baseline::to_rule_baseline` converts into
# `harw_dod_rules::baseline::{Baseline, PalaceStatus}` — the edge-cut that
# stops this crate's whole graph (notably `harw-model-catalog` ->
# `reqwest`/`tokio`) from reaching `harw-sentinel` through a reexport (see
# `src/security.rs` module doc). No cycle: `harw-dod-rules` depends back on
# this crate only as a `[dev-dependencies]` entry (checked in
# `harw-dod-rules/Cargo.toml`) for its own test/doctest convenience; Cargo
# explicitly supports dev-dependency cycles since they never enter the
# production dependency graph.
harw-dod-rules = { path = "../dod/crates/harw-dod-rules" }
# AW3-03: source binding; `KnowledgeContextProvider` yields `harw_context::Fragment`.
# No cycle: `harw-context` depends only on harw-types/harw-lens-types/harw-macros,
# none of which knows harw-knowledge.
harw-context = { path = "../harw-context" }
harw-lens-types = { path = "../harw-lens-types" }
# AW5-09: `ContextProposal::target_program` references the `DefinitionId`
# of a context program (`harwness.context.<name>@<major>`, see
# `context_program.rs` §grammar) and `ProposedChange` embeds
# `RawContextSectionSpec`/`SectionStrength` instead of duplicating them.
# No cycle: `harw-agent-dsl` depends only on `harw-context` (which
# `harw-knowledge` already knows), `semver`, `serde`, `time`, `toml`, `blake3`
# — none of which knows `harw-knowledge` (checked at AW5-09 time).
harw-agent-dsl = { path = "../harw-agent-dsl" }
# AW5-09: `ContextProposal::evidence: Vec<EvidenceRef>` — the same chain of
# evidence that `harw-plan` nodes carry (incl. `digest: Option<ContentDigest>`, AW4-04).
# No cycle: `harw-plan` depends only on `harw-macros`/`harw-types`/`serde`/
# `serde_json`/`time`/`tracing`, none of which knows `harw-knowledge`.
# `harw-plan-bridge` (which conversely already depends on `harw-knowledge`, see
# `fragment_registry.rs`) is deliberately NOT accessed — that would be the cycle.
# AW6-06: `ModelBehaviorProposal` embeds `harw_model_catalog::descriptor`'s
# `ToolCallingSupport`/`TokenCount` and `harw_model_catalog::observed::Score`
# read-only, instead of duplicating that vocabulary. No cycle: as checked at
# AW6-06 time, `harw-model-catalog` depends only on `harw-config`,
# `harw-context`, `harw-lens-types`, `harw-types` (path) and external crates
# (reqwest/secrecy/serde/serde_json/tokio/time/toml) — none of these
# path dependencies knows `harw-knowledge` (the same check that AW5-09
# already performed for `harw-agent-dsl`/`harw-context`).
harw-model-catalog = { path = "../harw-model-catalog" }
harw-plan = { path = "../harw-plan" }
# AW6-08: the Context Steward's three null counters (`context_steward.rs`)
# need `harw_observe::{NullCounter, NullCounterRegistry, NullSink,
# TelemetrySink, Cardinality, MetricKey, MetricKind, Unit}` to make the
# invariants it hangs a counter on observable, per the mechanic `harw-observe`
# built in AW1-07 (deliberately without any concrete counters of its own).
# No cycle: `harw-observe` depends only on `harw-macros` and `serde`
# (see `harw-observe/Cargo.toml`), none of which knows `harw-knowledge` —
# checked at AW6-08 time.
harw-observe = { path = "../harw-observe" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
jiff = { workspace = true }
serde_norway = "0.9.42"
# `kanban/boards/<board-id>/board.toml` persistence (§1.2, §6). Pinned via the
# workspace default (`[workspace.dependencies] toml`, root `Cargo.toml`), same
# as `harw-home`/`harw-authority`/`harw-lens-embed`.
toml = { workspace = true }
# Cross-process file locks (`src/lock.rs`, round 4 D0) — the same
# workspace version that `harw-session-store` uses for transcript/job locks.
fs4 = { workspace = true }
# External crates are LISTED here for the parent build to `cargo add` (this
# worker never runs cargo); no version is invented for them.

[lints]
workspace = true
