[package]
publish.workspace = true
name = "harw-session-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-types = { path = "../harw-types" }
harw-macros = { path = "../harw-macros" }
harw-job-runtime = { path = "../harw-job-runtime" }
# Eco-Doc §33: generic job store mechanics (records/locks layout, fs4 locks,
# atomic persist, fencing). `job_store.rs` is a thin adapter over it.
harw-job-store = { path = "../harw-job-store" }
# F-006: symlinkfestes Öffnen (korrektes O_NOFOLLOW je Architektur, `harw-fsutil`).
harw-fsutil = { path = "../harw-fsutil" }
# AW1-01: ChildLeaseRecord carries a TraceContext (frozen wire form,
# docs/design/build-history.md §A.4). Path dependency only — no version pin.
harw-observe = { path = "../harw-observe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { workspace = true }
# C-APPR: defekte Approval-Einträge werden in `pending_all` mit `warn!` übersprungen.
tracing = { workspace = true }
fs4 = "1.1.0"
tempfile = "3.27.0"

# External deps — parent resolves exact versions via `cargo add` (no invented pins).

[lints]
workspace = true
