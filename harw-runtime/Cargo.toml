[package]
publish.workspace = true
name = "harw-runtime"
description = "Common runtime assembly for all harw entry points"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["browser"]
browser = ["harw-registry-defaults/browser"]

[dependencies]
harw-explorer = { path = "../harw-explorer" }
harw-command = { path = "../harw-command" }
harw-authority = { path = "../harw-authority" }
# #22 Welle 3A: eingebettete Agenten-Artefakte (`EntryKind::CompiledAgent`,
# `embedded.rs`) — Bundle, Artifact und ArtifactDigest.
harw-agent-artifact = { path = "../harw-agent-artifact" }
# Gemeinsame Runtime-Montage (L12): darf nur von `harw-tui` und `harw-cli`
# genutzt werden, sonst entsteht ein Zyklus.
harw-agent-dsl = { path = "../harw-agent-dsl" }
# `AgentSuggestions` steht in der Signatur von `ChildRegistryFactory::build_registry`
# (harw-core/src/child_controller.rs:393-398); harw-extension-api re-exportiert den
# Typ nicht (harw-extension-api/src/capabilities.rs:3).
harw-catalog = { path = "../harw-catalog" }
harw-config = { path = "../harw-config" }
harw-context = { path = "../harw-context" }
harw-core = { path = "../harw-core" }
# `delegate_wave` (Operation + Politik) für die Registries der
# Orchestrator-Kinder (`children.rs`). Kein Zyklus: `harw-core-bridge` hängt
# nicht von `harw-runtime` ab (nur harw-authority/-types/-sandbox/-operations/
# -core/-extension-api/-research und `harw-dod-signals`).
harw-core-bridge = { path = "../harw-core-bridge" }
harw-extension-api = { path = "../harw-extension-api" }
# `handoff.rs` (Agent OPS): symlinkfestes, atomares Schreiben der
# `handoff.json` (Tempdatei im Zielverzeichnis + `rename`), analog zu
# `harw-session-store/src/meta.rs`.
harw-fsutil = { path = "../harw-fsutil" }
harw-home = { path = "../harw-home" }
# Crypto-Infrastruktur H4: `InfrastructureAvailability` aus `[infrastructure]`
# (`src/infrastructure.rs`), als Dienst auf Slash/Web (`services.rs`). Kein
# Zyklus: `harw-infra-client` (Schicht I) hängt von keiner harw-Crate ab.
harw-infra-client = { path = "../harw-infra-client" }
harw-job-core = { path = "../harw-job-core" }
harw-job-runtime = { path = "../harw-job-runtime" }
# L6: `Arc<KnowledgeStore>` für Slash/Modell-Werkzeug (`services.rs`). Kein
# Zyklus: `harw-knowledge` hängt nicht von `harw-runtime` ab.
harw-knowledge = { path = "../harw-knowledge" }
harw-lens-types = { path = "../harw-lens-types" }
harw-macros = { path = "../harw-macros" }
harw-memory = { path = "../harw-memory" }
harw-context-ledger = { path = "../harw-context-ledger" }
harw-model-catalog = { path = "../harw-model-catalog" }
harw-observe = { path = "../harw-observe" }
harw-operations = { path = "../harw-operations" }
harw-ops = { path = "../harw-ops" }
harw-plan = { path = "../harw-plan" }
harw-plan-bridge = { path = "../harw-plan-bridge" }
harw-project-discovery = { path = "../harw-project-discovery" }
# `SessionEvent`/`TurnEvent` fuer `new_root_session`; harw-core re-exportiert beide
# nicht (harw-core/src/session.rs:108-109 importiert sie selbst so).
harw-protocol = { path = "../harw-protocol" }
harw-provider-http = { path = "../harw-provider-http" }
harw-registry-defaults = { path = "../harw-registry-defaults" }
harw-sandbox = { path = "../harw-sandbox" }
harw-secrets = { path = "../harw-secrets" }
harw-session-store = { path = "../harw-session-store" }
# Geteilter Host-Permit-Fragekanal (`host_permit_prompt`): `RuntimeAssembly`
# baut ihn hier, damit `harw-tui` ihn übernimmt statt einen eigenen zu bauen,
# ohne dass `harw-tool-shell` selbst je von `harw-tui` abhängen müsste.
harw-tool-shell = { path = "../harw-tool-shell" }
# Runde 5, Teil F: Plan-Werkzeuge der Wurzel, Plan-Sperre und angehefteter Plan.
harw-tool-plan = { path = "../harw-tool-plan" }
# Plan R9, Teil F: Job-Verwaltung je Sitzung (`job.*`), Freigabetext von
# `job.start` und Zustellung der Job-Ereignisse.
harw-tool-job = { path = "../harw-tool-job" }
# `[tools.container]`: `container.images` / `container.run` (`src/container_wiring.rs`).
harw-tool-container = { path = "../harw-tool-container" }
harw-tool-container-run = { path = "../harw-tool-container-run" }
# R18 D-A: der entfernte Werkzeug-Proxy eines an ein Gateway angebundenen
# Laufs (`RuntimeAssemblyBuilder::remote_tools`). Kein Zyklus:
# `harw-tool-remote` hängt nur an harw-protocol/-tools/-extension-api/-types.
harw-tool-remote = { path = "../harw-tool-remote" }
harw-types = { path = "../harw-types" }
# Kein `[workspace.dependencies]`-Eintrag für tokio; Version = Cargo.lock.
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "sync", "time"] }
harw-mcp-client = { path = "../harw-mcp-client" }
tracing = { workspace = true }
# secrecy 0.10 wie harw-provider-http/harw-model-catalog (Version = Cargo.lock)
secrecy = "0.10.3"
serde = { workspace = true }
# `handoff.rs` (Agent OPS): `SessionHandoff::written_at` über
# `jiff::Timestamp::now().to_string()` (RFC3339), wie `harw-session-store`.
jiff = { workspace = true }
# `handoff.rs` (Agent OPS): (De-)Serialisierung von `SessionHandoff` als
# `handoff.json`. War zuvor nur Dev-Dependency; jetzt auch für den
# Produktivpfad benötigt.
serde_json = { workspace = true }
toml = { workspace = true }
# `security_signals.rs`: RFC-3339-Zeitstempel des DoD-Exports.
time = { version = "0.3.53", features = ["parsing"] }

[dev-dependencies]
tempfile = { workspace = true }
# `tests/remote_tools.rs`: `#[tokio::test]` über den entfernten Proxy und
# `harw_tools::executor::ExecutionPlacement`/Spezifikationen der Test-Attrappen.
tokio = { version = "1.53.0", features = ["rt", "macros"] }
harw-tools = { path = "../harw-tools" }
# `embedded.rs` tests: `compile_agent(..., now: OffsetDateTime, ...)`
# (`harw-agent-dsl`), Version wie dort (kein `[workspace.dependencies]`-Eintrag).

[lints]
workspace = true
