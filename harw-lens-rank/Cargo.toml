[package]
publish.workspace = true
name = "harw-lens-rank"
description = "Pure ranking functions: reciprocal rank fusion, maximal marginal relevance, deduplication, budget packing, and BM25 scoring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-lens-types = { path = "../harw-lens-types" }

# Only for tests and documentation examples: builds ChunkDigest fixtures via
# ContentDigest::of. Never flows into a shipped binary — cargo excludes
# dev-dependencies from `cargo build --release`. The hard requirement
# "no dependency that can do I/O, system time or randomness" applies to the
# production dependency surface of this crate; blake3 (via ContentDigest)
# is pure and deterministic anyway, but appears here exclusively in
# #[cfg(test)] code and doctests.
[dev-dependencies]
harw-types = { path = "../harw-types" }

[lints]
workspace = true
