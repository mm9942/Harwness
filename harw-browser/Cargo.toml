[package]
publish.workspace = true
name = "harw-browser"
description = "Contract layer defining browser automation vocabulary for Harwness agent tool runtime backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.53", features = ["serde", "formatting"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[lints]
workspace = true
