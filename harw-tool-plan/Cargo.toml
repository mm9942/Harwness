[package]
publish.workspace = true
name = "harw-tool-plan"
description = "Plan mode tools: write, exit, enter operations, mode gate, pinned context, and user dialog interaction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Round 5, part F: plan mode as in Claude Code — `plan.write`, `plan.exit`,
# `plan.enter`, `ask_user`, the immediate plan lock (`PlanModeGate`) and the
# pinned plan as a context contribution. No cycle: the crate depends neither on
# `harw-core` nor on `harw-runtime`/`harw-tui`; both depend on it.
[dependencies]
harw-authority = { path = "../harw-authority" }
harw-extension-api = { path = "../harw-extension-api" }
# Symlink-safe opening of the plan files via directory descriptors (O_NOFOLLOW/openat2).
harw-fsutil = { path = "../harw-fsutil" }
harw-home = { path = "../harw-home" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Question channel to the TUI (mpsc/oneshot) and wait time for the decision.
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[lints]
workspace = true
