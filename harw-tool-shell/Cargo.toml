[package]
publish.workspace = true
name = "harw-tool-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-extension-api = { path = "../harw-extension-api" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
harw-sandbox = { path = "../harw-sandbox" }
# Runde 5, Teil B (`host.sudo_exec`): `#[derive(Redact)]` für den Audit-Datensatz,
# argv-Hash und genullte Passwortpuffer (alle bereits im Cargo.lock).
harw-macros = { path = "../harw-macros" }
harw-observe = { path = "../harw-observe" }
blake3 = { workspace = true }
# Runde 7, Teil T2 (`latex.template`): heutiges Datum in lokaler Zeitzone
# (bereits im Cargo.lock, Workspace-Abhängigkeit).
jiff = { workspace = true }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros", "sync"] }

[lints]
workspace = true
