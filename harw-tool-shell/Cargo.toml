[package]
name = "harw-tool-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
harw-extension-api = { path = "../harw-extension-api" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
harw-sandbox = { path = "../harw-sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros"] }

[lints]
workspace = true
