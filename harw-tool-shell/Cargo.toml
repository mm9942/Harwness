[package]
publish.workspace = true
name = "harw-tool-shell"
description = "Shell execution tool provider with sandbox isolation for the Harwness agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-extension-api = { path = "../harw-extension-api" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
harw-sandbox = { path = "../harw-sandbox" }
# Round 5, part B (`host.sudo_exec`): `#[derive(Redact)]` for the audit record,
# argv hash and zeroed password buffers (all already in Cargo.lock).
harw-macros = { path = "../harw-macros" }
harw-observe = { path = "../harw-observe" }
blake3 = { workspace = true }
# Round 7, part T2 (`latex.template`): today's date in the local time zone
# (already in Cargo.lock, workspace dependency).
jiff = { workspace = true }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros", "sync"] }

[lints]
workspace = true
