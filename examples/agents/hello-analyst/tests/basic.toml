# A case for `harw agent test hello-analyst` (harw-agent-compiler/src/testing.rs).
#
# `tools`/`not_tools` are checked now, against the compiled rights manifest.
# `contains`/`not_contains` need a real run of the agent and are reported as
# `pending` until the runner exists (#22 wave 3); see
# ../../../docs/guides/agent-compiler.md.

name = "stays read-only and can list files"
prompt = "List the files in this folder and summarize what each one is for."

[expect]
tools = ["fs.read", "fs.list"]
not_tools = ["fs.write", "shell.exec", "web.fetch"]
contains = ["Looked at"]
not_contains = ["TODO"]
