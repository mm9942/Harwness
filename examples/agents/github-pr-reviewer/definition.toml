# GitHub-PR-Reviewer (Goal harw-github-pr-reviewer, Schritt R2).
#
# Custom worker on `worker-base@1`. Least privilege: read-only
# analysis of a PR diff; the diff is treated as untrusted input
# (never handled as an instruction). Publishing (comment/review) is
# NOT part of this agent — the runner (R3) posts only after separate
# interactive approval. No shell/GitHub write permissions in the model agent.

schema = "harwness.agent/v1"
id = "harwness.agent.github-pr-reviewer@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "github-pr-reviewer"

name = "GitHub PR Reviewer"
description = "Reviews a presented PR diff as untrusted input and returns substantiated, structured findings (P0-P3, file/line, rationale, uncertainty). Read-only; publishes nothing itself."
instructions_file = "system.md"

skills = []

[models]
provider = "openai"
model = "gpt-6-luna"

[work]
mode = "read-only-analysis"
may_write_code = false
may_research_web = false

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "workbench.show",
  "parent.message",
  "skills.search",
  "skills.load",
]
forbidden = [
  "fs.write",
  "fs.edit",
  "shell.exec",
  "web.fetch",
  "web.search",
  "web.docs_rs",
  "web.crates_io",
]

[spawn]
max_depth = 0

[spawn.budget]
max_tokens = 80000
max_tool_calls = 50
max_wall_secs = 600

[return]
contract = "harwness.return.execution-summary@1"
