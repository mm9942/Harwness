[package]
publish.workspace = true
name = "harw-tools"
description = "Tool vocabulary boundary defining schema, specification, invocation, output, and execution trait"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-types = { path = "../harw-types" }
harw-sandbox = { path = "../harw-sandbox" }
harw-authority = { path = "../harw-authority" }
harw-macros = { path = "../harw-macros" }
# AW5-07: `context.load` (`context_load.rs`) resolves `DetailMode::References`
# load keys (`SectionName`/`FragmentLabel`) and enforces the same
# `ContextBudgetSpec`/`TrustClass` vocabulary the montage uses — no second,
# parallel truth about section names or trust ranks.
harw-context = { path = "../harw-context" }
# AW5-07: `context.load`'s per-turn load cap is expressed in the same cost
# unit (`CostEstimate`) as `harw_context::Fragment::cost`.
harw-lens-types = { path = "../harw-lens-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1.44"

[dev-dependencies]
# AW5-07 tests build `harw_context::FragmentOrigin` values directly, which
# carry a `jiff::Timestamp`.
jiff = { workspace = true }
# Tests only: unlocks `harw_authority::SandboxSpec::from_resolved_for_test`,
# which builds a sandbox with a real, non-empty `NetworkScope` —
# the production API of `harw-authority` (already above under
# `[dependencies]`) does not allow that anywhere else. Needed so that
# `sandbox_guard` tests can actually check a host allow list against
# `require_host_access`. Because of `resolver = "2"` only active in the
# test build, never in this crate's production build.
harw-authority = { path = "../harw-authority", features = ["test-support"] }

[lints]
workspace = true
