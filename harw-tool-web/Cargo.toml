[package]
publish.workspace = true
name = "harw-tool-web"
description = "Web research tools for agents without browser stack; fetches docs and crate metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../harw-authority" }
# W5 N-WEB: HTTP client and egress policy exclusively from harw-egress
# (scoped resolver, address classes, no auto-redirects, no proxy).
harw-egress = { path = "../harw-egress" }
# Symlink-safe reading/writing of the response cache (0600, owner check).
harw-fsutil = { path = "../harw-fsutil" }
harw-extension-api = { path = "../harw-extension-api" }
harw-macros = { path = "../harw-macros" }
harw-sandbox = { path = "../harw-sandbox" }
# PDF responses from `web.fetch` are extracted to text locally (oxidize-pdf).
harw-tool-doc = { path = "../harw-tool-doc" }
harw-tools = { path = "../harw-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cache key and scope digest (Cargo.lock: blake3 1.8.7).
blake3 = { workspace = true }
# Identical feature set as harw-egress/harw-core (Cargo.lock: reqwest 0.12.28);
# a differing configuration would yield an incompatible `Client` type.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
# `rt`: `spawn_blocking` for parsing and cache I/O; `time`: overall deadline.
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1.44"
# Versions from Cargo.lock (scraper 0.23.1, htmd 0.2.2); the only touchpoints
# are `crate::html` and `crate::docs_rs::extract_main_content`.
scraper = "0.23.1"
htmd = "0.2.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lints]
workspace = true
