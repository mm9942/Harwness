# Architecture policy for the `arch` gate (`cargo run -q -p xtask -- gates arch`).
#
# Implements docs/planning/10-ecosystem-workspace/
# HARW_ECOSYSTEM_WORKSPACE_ARCHITECTURE.md, §6 (dependency direction),
# §23 (TCB budgets), §40–§43 (native dependencies, classes),
# §47 (classification F/I/C/J/D/A + T) and §55–§56 (architecture tests,
# policy file).
#
# Principle (§41): Membership in the same Cargo workspace is NOT permission
# to depend on one another. Permission comes from this file alone.
#
# What the gate checks (details in xtask/src/gate_arch.rs):
# - Every package in the graph (a single workspace since PL-60, including
#   `dod/crates/*`) is listed under `[packages]`. A new, unclassified
#   package is a violation.
#   Packages listed here that do not (yet) exist are allowed.
# - Every internal normal edge (`[dependencies]`, not dev/build) follows
#   `[rules]` — or is present as an `[[exceptions]]` entry.
# - Ratchet: an exception without a matching edge, or for an edge that is
#   allowed anyway, is a violation ("stale"). The list can only shrink.
# - TCB packages (`tcb = true`) may point directly only at the internal
#   crates named in `[tcb."<name>"].allowed_internal`. An allowlist entry
#   that is no longer used is likewise stale.
# - Layers with `forbid_sys_crates = true` and all TCB packages must not
#   reach any `*-sys` crate in their transitive closure (via
#   `[dependencies]` and `[build-dependencies]`), except those justified
#   under `[[sys_crates.allow]]`.

# ---------------------------------------------------------------------------
# Schichten
# ---------------------------------------------------------------------------
[layers]
F = "foundation — broadly consumable, little outward knowledge (§7, §42)"
I = "shared infrastructure — wiederverwendbare Mechanismen (§13, §17, §42)"
C = "compiler domain — DSL, Artefakt, Compiler (§11)"
J = "job infrastructure — without Harwness or DoD semantics (§14)"
D = "DoD domain — dod/crates/* (§18)"
A = "application/composition — darf breit zusammensetzen (§24)"

# Who may point at which layer. A layer may only ever point inward
# (towards F), never outward (§6).
[rules]
F.may_depend_on = ["F"]
I.may_depend_on = ["F", "I"]
C.may_depend_on = ["F", "I", "C"]
J.may_depend_on = ["F", "I", "J"]
# §14/§40: Job infrastructure builds native execution paths; no C bindings
# via `*-sys` in the closure.
J.forbid_sys_crates = true
D.may_depend_on = ["F", "I", "D"]
A.may_depend_on = ["*"]

# ---------------------------------------------------------------------------
# `*-sys`-Crates (§40)
# ---------------------------------------------------------------------------
# Applies to layers with `forbid_sys_crates = true` and — via
# `forbid_for_tcb` — to every package with `tcb = true`. The closure is built
# from the `[dependencies]` and `[build-dependencies]` of the workspace crates
# and then from the edges in `Cargo.lock` (the only lock file since PL-60).
# `Cargo.lock` has no platform or feature filters, so the closure is an
# overestimate. That is why the crates whose name ends in `-sys` but which
# build no C code are listed here.
# Limit: the closure does not see `[target.'cfg(..)'.…]` tables. J crates
# that declare their platform-specific dependencies only there
# (e.g. harw-job-linux: rustix, landlock, …) are therefore not effectively
# checked by this rule (a limit of the workspace graph, see
# xtask/src/gate_arch.rs).
[sys_crates]
forbid_for_tcb = true

[[sys_crates.allow]]
name = "linux-raw-sys"
reason = "pure Rust: Linux syscall ABI constants for rustix, no C build, no linking against libc"

[[sys_crates.allow]]
name = "windows-sys"
reason = "Windows targets only (tokio/mio/rustix/…); never built on Linux, bindings without a C build"

[[sys_crates.allow]]
name = "js-sys"
reason = "wasm32 targets only (uuid/getrandom); never built on Linux, no C build"

