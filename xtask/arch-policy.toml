# Architektur-Richtlinie für das Gate `arch` (`cargo run -q -p xtask -- gates arch`).
#
# Umsetzung von docs/planning/10-ecosystem-workspace/
# HARW_ECOSYSTEM_WORKSPACE_ARCHITECTURE.md, §6 (Abhängigkeitsrichtung),
# §23 (TCB-Budgets), §40–§43 (native Abhängigkeiten, Klassen),
# §47 (Klassifikation F/I/C/J/D/A + T) und §55–§56 (Architekturtests,
# Richtliniendatei).
#
# Grundsatz (§41): Mitgliedschaft im selben Cargo-Workspace ist KEINE
# Erlaubnis, voneinander abzuhängen. Die Erlaubnis kommt allein aus dieser
# Datei.
#
# Was das Gate prüft (Details in xtask/src/gate_arch.rs):
# - Jedes Paket im Graphen (seit PL-60 ein Workspace, `dod/crates/*`
#   eingeschlossen) steht unter `[packages]`. Ein neues, nicht
#   klassifiziertes Paket ist ein Verstoß.
#   Hier gelistete, aber (noch) nicht existierende Pakete sind zulässig.
# - Jede interne normale Kante (`[dependencies]`, nicht dev/build) folgt
#   `[rules]` — oder steht als `[[exceptions]]`-Eintrag da.
# - Ratsche: eine Ausnahme ohne passende Kante oder für eine ohnehin
#   erlaubte Kante ist ein Verstoß ("veraltet"). Die Liste kann nur
#   schrumpfen.
# - TCB-Pakete (`tcb = true`) dürfen direkt nur auf die in
#   `[tcb."<name>"].allowed_internal` genannten internen Crates zeigen.
#   Eine nicht mehr genutzte Allowlist-Zeile ist ebenfalls veraltet.
# - Schichten mit `forbid_sys_crates = true` und alle TCB-Pakete dürfen in
#   ihrer transitiven Hülle (über `[dependencies]` und
#   `[build-dependencies]`) keine `*-sys`-Crate erreichen, außer den unter
#   `[[sys_crates.allow]]` begründeten.

# ---------------------------------------------------------------------------
# Schichten
# ---------------------------------------------------------------------------
[layers]
F = "foundation — breit konsumierbar, kaum Wissen nach außen (§7, §42)"
I = "shared infrastructure — wiederverwendbare Mechanismen (§13, §17, §42)"
C = "compiler domain — DSL, Artefakt, Compiler (§11)"
J = "job infrastructure — ohne Harwness- und DoD-Semantik (§14)"
D = "DoD domain — dod/crates/* (§18)"
A = "application/composition — darf breit zusammensetzen (§24)"

# Wer auf welche Schicht zeigen darf. Eine Schicht darf immer nur nach
# innen (Richtung F) zeigen, nie nach außen (§6).
[rules]
F.may_depend_on = ["F"]
I.may_depend_on = ["F", "I"]
C.may_depend_on = ["F", "I", "C"]
J.may_depend_on = ["F", "I", "J"]
# §14/§40: Job-Infrastruktur baut native Ausführungspfade; keine C-Bindings
# per `*-sys` in der Hülle.
J.forbid_sys_crates = true
D.may_depend_on = ["F", "I", "D"]
A.may_depend_on = ["*"]

# ---------------------------------------------------------------------------
# `*-sys`-Crates (§40)
# ---------------------------------------------------------------------------
# Gilt für Schichten mit `forbid_sys_crates = true` und – über
# `forbid_for_tcb` – für jedes Paket mit `tcb = true`. Die Hülle wird über
# die `[dependencies]` und `[build-dependencies]` der Workspace-Crates und
# danach über die Kanten in `Cargo.lock` gebildet (seit PL-60 die einzige
# Lock-Datei). `Cargo.lock` kennt keine Plattform- oder Feature-Filter; die
# Hülle ist also eine Überschätzung. Deshalb stehen hier die Crates, deren
# Name auf `-sys` endet, die aber keinen C-Code bauen.
# Grenze: Tabellen `[target.'cfg(..)'.…]` sieht die Hülle nicht. J-Crates,
# die ihre plattformspezifischen Abhängigkeiten nur dort deklarieren
# (z. B. harw-job-linux: rustix, landlock, …), prüft diese Regel damit
# nicht wirksam (Grenze des Workspace-Graphen, siehe
# xtask/src/gate_arch.rs).
[sys_crates]
forbid_for_tcb = true

[[sys_crates.allow]]
name = "linux-raw-sys"
reason = "reines Rust: Linux-Syscall-ABI-Konstanten für rustix, kein C-Build, kein Linken gegen libc"

[[sys_crates.allow]]
name = "windows-sys"
reason = "nur für Windows-Ziele (tokio/mio/rustix/…); auf Linux nie gebaut, Bindings ohne C-Build"

[[sys_crates.allow]]
name = "js-sys"
reason = "nur für wasm32-Ziele (uuid/getrandom); auf Linux nie gebaut, kein C-Build"

