# ---------------------------------------------------------------------------
# TCB allowlists (§22, §23, §51): direct internal dependencies.
# State = today's edges. Every new internal edge is a violation; an entry
# without an edge is stale and must be removed.
# ---------------------------------------------------------------------------
[tcb."harw-warden"]
allowed_internal = [
    "harw-completions",
    "harw-dod-warden",
    "harw-dod-warden-proto",
    "harw-macros",
    "harw-types",
]

[tcb."harw-dod-warden"]
allowed_internal = ["harw-dod-warden-proto", "harw-macros", "harw-types"]

[tcb."harw-dod-warden-proto"]
allowed_internal = ["harw-macros", "harw-types"]

[tcb."harw-dod-readfs"]
allowed_internal = ["harw-dod-cap", "harw-macros"]

[tcb."harw-dod-signals"]
allowed_internal = ["harw-dod-cap", "harw-macros", "harw-observe", "harw-types"]

# ---------------------------------------------------------------------------
# Exceptions: inversions that exist today (§48). Each carries a reason and
# a target date. Ratchet: if the edge goes away, the entry must go.
# ---------------------------------------------------------------------------
[[exceptions]]
from = "harw-session-store"
to = "harw-job-core"
reason = "I → J: harw-session-store/src/job_store.rs persists job model types from harw-job-core (Budget, JobState, StoredJob …); belongs in harw-job-store (J, §33, §34)"
until = "R11 W2"

[[exceptions]]
from = "harw-session-store"
to = "harw-job-store"
reason = "I → J: harw-session-store::JobStore is an adapter over the generic storage mechanism in harw-job-store (§33); goes away once job persistence moves entirely into the J ring"
until = "R12"

# ---------------------------------------------------------------------------
# Forbidden external crates (transitive, via [dependencies] and
# [build-dependencies] plus Cargo.lock)
# ---------------------------------------------------------------------------
# W00 D10 / ARC-02: The WebSocket library belongs solely to the ring-A adapter
# `harw-session-ws`. Jobs (J), DoD (D), the TCB and everything inner do not
# reach it.
[[forbidden_crates]]
names = ["tungstenite", "tokio-tungstenite"]
layers = ["F", "I", "C", "J", "D"]
tcb = true
reason = "W00 D10/ARC-02: WebSocket transport is owned by ring A (harw-session-ws) only"

# W00 §2.1 / ARC-01: The session contract stays free of network transport and
# application crates. `tokio` is deliberately not in the list: harw-types
# reaches it via `tokio-util` (only `CancellationToken`, no runtime feature,
# see harw-types/Cargo.toml). The public `SessionPort` API itself uses
# only std futures; harw-protocol/tests/session_wire_compat.rs guarantees that.
[[forbidden_crates]]
names = ["hyper", "tungstenite", "tokio-tungstenite", "harw-node-transport", "harw-web", "harw-cli", "harw-tui", "harw-session-host", "harw-session-ws"]
packages = ["harw-protocol"]
reason = "W00 §2.1/ARC-01: harw-protocol has no async runtime or network transport dependency"
