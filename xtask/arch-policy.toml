# ---------------------------------------------------------------------------
# TCB-Allowlisten (§22, §23, §51): direkte interne Abhängigkeiten.
# Stand = die heutigen Kanten. Jede neue interne Kante ist ein Verstoß; eine
# Zeile ohne Kante ist veraltet und muss gestrichen werden.
# ---------------------------------------------------------------------------
[tcb."harw-warden"]
allowed_internal = [
    "harw-completions",
    "harw-dod-warden",
    "harw-dod-warden-proto",
    "harw-macros",
    "harw-types",
]

[tcb."harw-dod-warden"]
allowed_internal = ["harw-dod-warden-proto", "harw-macros", "harw-types"]

[tcb."harw-dod-warden-proto"]
allowed_internal = ["harw-macros", "harw-types"]

[tcb."harw-dod-readfs"]
allowed_internal = ["harw-dod-cap", "harw-macros"]

[tcb."harw-dod-signals"]
allowed_internal = ["harw-dod-cap", "harw-macros", "harw-observe", "harw-types"]

# ---------------------------------------------------------------------------
# Ausnahmen: heute existierende Inversionen (§48). Jede trägt Grund und
# Zieltermin. Ratsche: fällt die Kante weg, muss der Eintrag gehen.
# ---------------------------------------------------------------------------
[[exceptions]]
from = "harw-session-store"
to = "harw-job-core"
reason = "I → J: harw-session-store/src/job_store.rs persistiert Job-Modelltypen aus harw-job-core (Budget, JobState, StoredJob …); gehört nach harw-job-store (J, §33, §34)"
until = "R11 W2"

[[exceptions]]
from = "harw-session-store"
to = "harw-job-store"
reason = "I → J: harw-session-store::JobStore ist ein Adapter über die generische Speichermechanik in harw-job-store (§33); verschwindet, wenn die Job-Persistenz ganz in den J-Ring wandert"
until = "R12"

# ---------------------------------------------------------------------------
# Verbotene externe Crates (transitiv, über [dependencies] und
# [build-dependencies] plus Cargo.lock)
# ---------------------------------------------------------------------------
# W00 D10 / ARC-02: Die WebSocket-Bibliothek gehört allein dem Ring-A-Adapter
# `harw-session-ws`. Jobs (J), DoD (D), die TCB und alles Innere erreichen sie
# nicht.
[[forbidden_crates]]
names = ["tungstenite", "tokio-tungstenite"]
layers = ["F", "I", "C", "J", "D"]
tcb = true
reason = "W00 D10/ARC-02: WebSocket transport is owned by ring A (harw-session-ws) only"

# W00 §2.1 / ARC-01: Der Session-Vertrag bleibt ohne Netzwerk-Transport und
# ohne Anwendungs-Crates. `tokio` steht bewusst nicht in der Liste: harw-types
# erreicht es über `tokio-util` (nur `CancellationToken`, kein Runtime-Feature,
# siehe harw-types/Cargo.toml). Die öffentliche `SessionPort`-API selbst nutzt
# nur std-Futures; das sichert harw-protocol/tests/session_wire_compat.rs.
[[forbidden_crates]]
names = ["hyper", "tungstenite", "tokio-tungstenite", "harw-node-transport", "harw-web", "harw-cli", "harw-tui", "harw-session-host", "harw-session-ws"]
packages = ["harw-protocol"]
reason = "W00 §2.1/ARC-01: harw-protocol has no async runtime or network transport dependency"

[packages."harw-session-com"]
layer = "A"

[packages."harw-session-daemon"]
layer = "A"

[packages."harw-reverse-proxy"]
layer = "A"

[packages."harw-context-ledger"]
layer = "I"

[packages."harw-tool-container"]
layer = "A"
