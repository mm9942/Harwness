[package]
publish.workspace = true
name = "xtask"
description = "Toolkit for CI gates and control plane UI type generation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Reads Cargo.toml and Cargo.lock without a subprocess and delivers the
# workspace graph including layers. Basis of gate 1 and gate 2 — both
# would otherwise have to call `cargo metadata`, i.e. start a subprocess.
harw-code-graph = { path = "../harw-code-graph" }
# Reads `xtask/arch-policy.toml` for the `arch` gate (layer rules,
# exceptions, TCB allowlists). Already in the tree via `harw-code-graph` —
# no new version, only a direct edge. No `serde` derive: the
# policy is read as a `toml::Table` and validated by hand, so that
# every shape error becomes a readable message instead of a deserialization error.
toml = { workspace = true }

[lints]
workspace = true
