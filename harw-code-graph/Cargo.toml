[package]
publish.workspace = true
name = "harw-code-graph"
description = "Analyzes Cargo workspaces and registry sources without executing subprocesses."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# update — this worker has no ExecuteProcess permission and
# could not run `cargo`. "1.1.3" corresponds to the version already resolved in the
# workspace Cargo.lock (toml 1.1.3+spec-1.1.0), as also used by
# harw-agent-dsl, harw-cli and harw-model-catalog, among others.
toml = "1.1.3"
harw-macros = { path = "../harw-macros" }
harw-types = { path = "../harw-types" }

[lints]
workspace = true
