[package]
publish.workspace = true
name = "harw-code-graph"
description = "Analyzes Cargo workspaces and registry sources without executing subprocesses."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# aktualisieren lassen — dieser Worker hat keine ExecuteProcess-Permission und
# konnte `cargo` nicht ausführen. "1.1.3" entspricht der bereits im
# Workspace-Cargo.lock aufgelösten Version (toml 1.1.3+spec-1.1.0), wie sie
# u.a. auch harw-agent-dsl, harw-cli und harw-model-catalog verwenden.
toml = "1.1.3"
harw-macros = { path = "../harw-macros" }
harw-types = { path = "../harw-types" }

[dev-dependencies]
harw-test-support = { path = "../harw-test-support" }

[lints]
workspace = true
