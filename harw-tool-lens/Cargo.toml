[package]
publish.workspace = true
name = "harw-tool-lens"
description = "Agent-facing Lens search tool with federated queries across visibility-scoped indices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-extension-api = { path = "../harw-extension-api" }
harw-home = { path = "../harw-home" }
harw-lens = { path = "../harw-lens" }
harw-lens-federation = { path = "../harw-lens-federation" }
harw-macros = { path = "../harw-macros" }
harw-tools = { path = "../harw-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `ask_embedder()` (see `src/provenance.rs`) builds a `harw_lens::HttpEmbedBackend`
# when an endpoint is configured, which takes a `secrecy::SecretString`
# as API key -- the same version `harw-lens-embed` has already resolved
# against `Cargo.lock` (0.10.3), no second resolution.
secrecy = "0.10.3"
# `lens_ask` (see `src/ask_tool.rs`) calls `ask_with_home` -- a
# synchronous function that goes through `reqwest::blocking` when a remote
# embedder is configured -- via `tokio::task::spawn_blocking`,
# so that a call from within this async fn does not abort with "Cannot start a
# runtime from within a runtime" (see the module docs of
# `harw_lens_embed::http_backend` and the `//!` block in `provenance.rs`).
# Previously only `dev-dependencies`; now a runtime dependency,
# because the call is on the production path, not just in tests.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
harw-lens-query = { path = "../harw-lens-query" }
harw-sandbox = { path = "../harw-sandbox" }
harw-types = { path = "../harw-types" }

[lints]
workspace = true
