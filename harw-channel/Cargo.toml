[package]
name = "harw-channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
harw-types = { path = "../harw-types" }
harw-macros = { path = "../harw-macros" }
harw-secrets = { path = "../harw-secrets" }
harw-session-store = { path = "../harw-session-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { workspace = true }
fs4 = "1.1.0"
tempfile = "3.27.0"

