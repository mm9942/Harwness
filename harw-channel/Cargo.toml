[package]
publish.workspace = true
name = "harw-channel"
description = "Transport-agnostic channel-ingress core with session management, pairing codes, and admission control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-types = { path = "../harw-types" }
harw-macros = { path = "../harw-macros" }
harw-secrets = { path = "../harw-secrets" }
harw-session-store = { path = "../harw-session-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { workspace = true }
fs4 = "1.1.0"
tempfile = "3.27.0"

# External deps — parent resolves exact versions via `cargo add` (no invented pins).

[dev-dependencies]
harw-test-support = { path = "../harw-test-support" }

[lints]
workspace = true
