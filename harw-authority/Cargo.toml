[package]
publish.workspace = true
name = "harw-authority"
description = "Authority primitives separating requests and snapshots from granted contexts in HARW"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = { workspace = true }
harw-types = { path = "../harw-types" }
ipnet = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Only `geteuid` for the ownership check of the OperatorHome policy
# (`process_euid` in `src/lib.rs`): a safe wrapper instead of the owner
# of `/proc/self`, which is root for non-dumpable processes.
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
# Private scratch directories cleaned up via `Drop` for the
# filesystem tests (`scratch_dir` in `src/lib.rs`).
tempfile = { workspace = true }

[features]
# Only for test fixtures of dependent crates (`harw-tools`, `harw-core-bridge`):
# unlocks `SandboxSpec::from_resolved_for_test`, which embeds an arbitrary
# (even non-empty) `NetworkScope` into a sandbox — the real API
# otherwise allows this nowhere outside this crate (`SandboxSpec::from_resolved`
# always starts with `NetworkScope::empty()`, `restrict` only narrows by
# intersection, and `PolicyBootstrap::issue`/`reissue` accept only
# the two hard-wired policy paths). Because of `resolver = "2"`
# (workspace root), only active if a crate requests it under `[dev-dependencies]`
# — never in the build of a production consumer. See the
# `src/lib.rs` docs on `SandboxSpec::from_resolved_for_test` for the invariant
# this leaves untouched (`restrict` remains a pure intersection procedure).
test-support = []

[lints]
workspace = true
