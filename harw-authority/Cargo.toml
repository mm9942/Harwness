[package]
publish.workspace = true
name = "harw-authority"
description = "Authority primitives separating requests and snapshots from granted contexts in HARW"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = { workspace = true }
harw-types = { path = "../harw-types" }
ipnet = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Nur `geteuid` für die Eigentümerprüfung der OperatorHome-Policy
# (`process_euid` in `src/lib.rs`): sicherer Wrapper statt des Eigentümers
# von `/proc/self`, der bei nicht-dumpbaren Prozessen root ist.
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
# Private, per `Drop` aufgeräumte Scratch-Verzeichnisse für die
# Dateisystem-Tests (`scratch_dir` in `src/lib.rs`).
tempfile = { workspace = true }

[features]
# Nur für Testfixtures abhängiger Crates (`harw-tools`, `harw-core-bridge`):
# schaltet `SandboxSpec::from_resolved_for_test` frei, das einen beliebigen
# (auch nicht-leeren) `NetworkScope` in eine Sandbox einbettet — die reale API
# erlaubt das sonst nirgends außerhalb dieser Crate (`SandboxSpec::from_resolved`
# startet stets mit `NetworkScope::empty()`, `restrict` verengt nur per
# Schnittmenge, und `PolicyBootstrap::issue`/`reissue` akzeptieren ausschließlich
# die zwei fest verdrahteten Policy-Pfade). Wegen `resolver = "2"`
# (Workspace-Root) nur aktiv, wenn eine Crate es unter `[dev-dependencies]`
# anfordert — nie im Build eines produktiven Konsumenten. Siehe
# `src/lib.rs`-Doku an `SandboxSpec::from_resolved_for_test` für die dadurch
# unangetastete Invariante (`restrict` bleibt reines Schnittmengen-Verfahren).
test-support = []

[lints]
workspace = true
