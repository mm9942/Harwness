[package]
publish.workspace = true
name = "harw-tool-container-run"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Agent tools container.images and container.run: run a validated, hardened rootless-Podman plan with bounded output, a runtime inspect read-back and kill-on-violation."

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-extension-api = { path = "../harw-extension-api" }
harw-tool-container = { path = "../harw-tool-container" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "process", "time", "io-util", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util"] }

[lints]
workspace = true
