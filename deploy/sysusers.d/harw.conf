# harw.conf -- system accounts of the DoD and infrastructure daemons.
#
# Canonical source: deploy/sysusers.d/ (Crypto Masterplan v2 §22, WP-17, H10).
# Installed verbatim (no placeholders) by dod/scripts/install.sh and embedded
# into harw-install. No account has a login shell or a personal home.
#
# One account per daemon (the stricter H10 variant): a compromised probe is
# not the sentinel, and no probe identity reaches the Warden.

# -- Groups --
# harw-ipc: may create/connect in /run/harw (the sentinel socket).
g harw-ipc - -
# harw-dod-config: read-only access to /etc/harw-dod.
g harw-dod-config - -
# harw-warden-clients: may connect to /run/harw/warden.sock. Empty by default;
# the operator adds the escalation client explicitly.
g harw-warden-clients - -
# Client groups of the infrastructure sockets under /run/harw/infra/.
g harw-secure - -
g harw-network - -
g harw-security - -
# harw-control-clients: may connect to /run/harw/infra/control.sock
# (harw-control.socket, SocketGroup=). Empty by default; admins add the users
# that should reach the control plane (`harw web` still grants the owner tier
# only to its own UID, see harw-control.service).
g harw-control-clients - -
# No harw-infra group any more: every infrastructure daemon is
# socket-activated, so /run/harw/infra is 0755 root:root and no daemon
# creates a socket there itself.

# -- DoD --
u harw-sentinel - "HARW DoD sentinel" - /usr/sbin/nologin
u harw-probe-fs - "HARW DoD fanotify probe" - /usr/sbin/nologin
u harw-probe-bpf - "HARW DoD eBPF probe" - /usr/sbin/nologin
u harw-warden - "HARW DoD Warden" - /usr/sbin/nologin
m harw-sentinel harw-ipc
m harw-probe-fs harw-ipc
m harw-probe-bpf harw-ipc
m harw-sentinel harw-dod-config
m harw-probe-bpf harw-dod-config

# -- Infrastructure --
u harw-auth - "HARW Auth/Crypto Hub" - /usr/sbin/nologin
u harw-netsec - "HARW NetSec daemon" - /usr/sbin/nologin
u harw-security-hub - "HARW SecurityHub" - /usr/sbin/nologin
u harw-control - "HARW control plane" /var/lib/harw-control /usr/sbin/nologin
