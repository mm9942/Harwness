# harw.conf -- runtime, state, and log directories.
#
# Canonical source: deploy/tmpfiles.d/ (Crypto Masterplan v2 §22.3, WP-17,
# H10). Rendered by dod/scripts/install.sh (STATEDIR, LOGDIR) and
# embedded into harw-install.
#
# Runtime layout:
#   /run/harw/sentinel.sock        DoD, SOCK_SEQPACKET (harw-sentinel binds)
#   /run/harw/warden.sock          DoD, SOCK_SEQPACKET (harw-warden.socket)
#   /run/harw/infra/secure.sock    harw-auth-hub.socket
#   /run/harw/infra/network.sock   harw-netsec.socket
#   /run/harw/infra/security.sock  harw-security-hub.socket
#   /run/harw/infra/control.sock   harw-control.socket
#
# These directories belong to tmpfiles, not to any unit's RuntimeDirectory=:
# several units share them, and a RuntimeDirectory= would be removed (with
# every socket in it) as soon as its one owning service stops.
#
# /run/harw 3771 root:harw-ipc -- root-owned, so no service can rename
# infra/ or the Warden socket; group-writable + setgid for harw-ipc, so the
# sentinel creates sentinel.sock with group harw-ipc; sticky, so harw-ipc
# members cannot remove each other's entries; others may traverse only.
d /run/harw 3771 root harw-ipc -
# /run/harw/infra 0755 root:root -- every infrastructure daemon is
# socket-activated, so only systemd (root) creates sockets here; no daemon
# can add, remove or replace one. Access is governed by each socket's own
# mode and group (the *.socket units).
d /run/harw/infra 0755 root root -
# DoD state and telemetry, written by the sentinel only.
d @STATEDIR@ 0750 harw-sentinel harw-sentinel -
d @LOGDIR@ 0750 harw-sentinel harw-sentinel -
