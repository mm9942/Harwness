user www-data;
worker_processes 1;
pid /var/lib/harw-website/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
    include /opt/harw-nginx/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /var/lib/harw-website/body;
    proxy_temp_path /var/lib/harw-website/proxy;
    fastcgi_temp_path /var/lib/harw-website/fastcgi;
    uwsgi_temp_path /var/lib/harw-website/uwsgi;
    scgi_temp_path /var/lib/harw-website/scgi;
    server {
        listen 127.0.0.1:3011 default_server;
        server_name harw.dev www.harw.dev;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=60";
        location ~ ^/(de|docs|architecture|archive/overview-0-3-0)$ {
            return 308 https://$host$uri/$is_args$args;
        }
        location / {
            limit_except GET { deny all; }
            rewrite ^(.*/)$ /harw.dev/site$1index.html? break;
            rewrite ^(.*)$ /harw.dev/site$1? break;
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host 127.0.0.1:9000;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Cache-Control;
            proxy_intercept_errors on;
            error_page 403 404 =404 @not_found;
        }
        location @not_found {
            default_type text/plain;
            return 404 "Not found\n";
        }
    }
}
