[package]
publish.workspace = true
name = "harw-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-types = { path = "../harw-types" }
harw-macros = { path = "../harw-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
url = "2"
secrecy = "0.8"

[features]
# ChatGPT OAuth lives behind a feature flag and is OFF by default
# (Note 11 §10: empfohlen `off`). v0.1 only ships API-key / static-bearer auth.
default = []
chatgpt-oauth = []

[lints]
workspace = true
