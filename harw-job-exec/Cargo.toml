[package]
publish.workspace = true
name = "harw-job-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Safe re-exec trampoline for Linux jobs: joins the job cgroup, applies rlimits and the sandbox (NO_NEW_PRIVS, capability drop, Landlock) to itself, reports what was enforced, then execs the job. Replaces an unsafe `pre_exec` hook (Job-Runtime-Doc §9-§12, §24)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "harw-job-exec"
path = "src/main.rs"

[dependencies]
# SandboxRequirement, SandboxReport, EnforcementState.
harw-job-core = { path = "../harw-job-core" }
# ExecPlanV1 and the parent-side report are JSON documents.
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# RlimitSet, SandboxPolicy (+ Landlock enforcement), CgroupV2Fs::attach_self.
harw-job-linux = { path = "../harw-job-linux", features = ["linux-sandbox", "linux-cgroup-v2"] }
# fs:      open(2) with O_NOFOLLOW/O_EXCL for the plan and report files.
# process: geteuid for the plan-file ownership check.
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
