[package]
publish.workspace = true
name = "harw-explorer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Universeller, projektunabhängiger Explorer: durchsucht den gesamten Baum ab einer Wurzel und erkennt Projekte, Dateitypen und Relationen."

[dependencies]
ignore = "0.4.32"
infer = "0.22.0"
globset = "0.4.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
