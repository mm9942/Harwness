[package]
publish.workspace = true
name = "harw-oauth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
harw-config = { path = "../harw-config" }
rand = "0.10.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
# Für den Datei-Lock-Retry-Backoff des Codex-Refresh-Flows (kein Blocking im
# Async-Kontext); Version an bereits im Workspace verwendeter tokio-Version
# ausgerichtet (siehe harw-provider-http/Cargo.toml).
tokio = { version = "1.52.3", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[lints]
workspace = true
