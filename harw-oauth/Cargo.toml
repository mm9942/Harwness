[package]
publish.workspace = true
name = "harw-oauth"
description = "PKCE-based OAuth setup, token exchange, and proactive refresh for Claude and ChatGPT"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
# OS advisory lock (flock on Unix) for the Codex refresh lock; replaces the
# nonce/stale heuristic (gap-hunt pattern M8). std::fs::File::try_lock only exists
# from Rust 1.89, MSRV is 1.85.
fs4 = { workspace = true }
harw-config = { path = "../harw-config" }
rand = "0.10.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
# For the file-lock retry backoff of the Codex refresh flow (no blocking in the
# async context); version aligned with the tokio version already used in the workspace
# (see harw-provider-http/Cargo.toml).
tokio = { version = "1.52.3", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[lints]
workspace = true
