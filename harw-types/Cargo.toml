[package]
publish.workspace = true
name = "harw-types"
description = "Phase-0 Harness vocabulary: core serde types for IDs, roles, security, and infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `ContentDigest`/`InvalidDigest` live in the leaf crate `harw-digest`
# (only blake3 + serde) and are re-exported here, so that crates which only
# need the digest do not inherit `jiff`/`uuid`/`tokio-util` (rule L7).
harw-digest = { path = "../harw-digest" }
# C-APPR: `Clock::now() -> jiff::Timestamp` (server clock, F-122).
jiff = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# `CancelToken` (moved from harw-core, F-160/G-017) wraps
# `tokio_util::sync::CancellationToken` — the only async dependency of this
# otherwise purely sync/data-type crate, deliberately minimal (no tokio
# runtime feature, only the cancellation primitive).
tokio-util = "0.7.18"

[dev-dependencies]
# FINDING (this task): `harw-core/src/cancel.rs` contains not only the
# `tokio_util` import but also `#[tokio::test]` functions (among them
# `test_cancelled_future_completes_after_cancel`, which uses `tokio::spawn`)
# and a `#[tokio::main(flavor = "current_thread")]` doctest in the module
# doc. Neither compiles without `tokio` itself — `tokio-util` alone (above)
# is not enough. Since both occur only in tests/doctests, `tokio` as a
# dev-dependency suffices; the features `rt` + `macros` are the minimum that
# `#[tokio::test]`, `tokio::spawn`, and `#[tokio::main]` need (no
# `sync`/`time`, which harw-core binds only for other modules).
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
