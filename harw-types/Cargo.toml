[package]
publish.workspace = true
name = "harw-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# BEFUND (Gate-Lauf, `warden-no-c-build`): `blake3` 1.8.7 verlangt in seiner
# eigenen, gepinnten Quelle (`~/.cargo/registry/src/.../blake3-1.8.7/Cargo.toml`)
# `[build-dependencies.cc]` **ohne** `optional = true` — diese Kante ist
# bedingungslos, für jede Feature-Kombination. Geprüft: das Feature `pure`
# (`pure = []`) schaltet in `build.rs` nur die SIMD-Assembly-/C-Intrinsics-
# Pfade ab (reine Rust-Intrinsics werden gebaut) — es hebt weder die
# `cc`-Build-Dependency im Manifest auf, noch verhindert es den
# C-Compiler-Sondierungsaufruf `c_compiler_support()` in `build.rs`, der auf
# x86/x86_64-Targets unabhängig von `pure` ausgeführt wird (nur der
# *Fehlschlag* dieser Sondierung ist bei `pure` unschädlich, siehe dortige
# `main()`-Logik). Damit gibt es **kein** Merkmal, dessen Abwahl diesen Fund
# beseitigt, ohne die Version zu wechseln (verboten laut Auftrag) — ein
# echter, mit den erlaubten Mitteln nicht behebbarer Verstoß. `ContentDigest`
# bleibt unverändert auf `blake3` mit Default-Features (`std`), da eine
# Featureänderung hier keinen Nutzen hätte und ungeprüfte Abwahl verboten
# ist.
blake3 = { workspace = true }
# C-APPR: `Clock::now() -> jiff::Timestamp` (Serveruhr, F-122).
jiff = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# `CancelToken` (verschoben aus harw-core, F-160/G-017) wickelt
# `tokio_util::sync::CancellationToken` — die einzige async-Abhängigkeit
# dieser sonst reinen Sync-/Datentyp-Crate, bewusst minimal (kein
# tokio-Runtime-Feature, nur der Cancellation-Primitive). Version/Feature-Zeile
# identisch zu `harw-core/Cargo.toml`.
tokio-util = "0.7.18"

[dev-dependencies]
# BEFUND (dieser Auftrag): `harw-core/src/cancel.rs` enthält nicht nur den
# `tokio_util`-Import, sondern auch `#[tokio::test]`-Funktionen (u. a.
# `test_cancelled_future_completes_after_cancel`, die `tokio::spawn` nutzt)
# sowie einen `#[tokio::main(flavor = "current_thread")]`-Doctest im
# Moduldoc. Beides kompiliert nicht ohne `tokio` selbst — nur `tokio-util`
# (oben) reicht nicht. Da beides ausschließlich in Tests/Doctests auftritt,
# genügt `tokio` als Dev-Dependency; Features `rt` + `macros` sind das
# Minimum, das `#[tokio::test]`, `tokio::spawn` und `#[tokio::main]`
# brauchen (kein `sync`/`time`, die harw-core nur für andere Module bindet).
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
