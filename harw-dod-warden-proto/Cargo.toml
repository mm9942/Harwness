[package]
name = "harw-dod-warden-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Vokabular-Grundlage: `FindingId`, `CgroupId`, `ApprovalActor`,
# `ContentDigest` (siehe lib.rs-Moduldoku, Abschnitt „Prüfung 2").
harw-types = { path = "../harw-types" }
# `#[derive(harw_macros::HarwError)]` für `error.rs`. Bewusst NICHT
# `harw_macros::warden_actions!` — siehe lib.rs-Moduldoku, Abschnitt
# „Prüfung 2: harw-tools".
harw-macros = { path = "../harw-macros" }
serde = { workspace = true }
# BEFUND (Gate-Lauf, `warden-no-c-build`/`warden-dependency-budget`): `jiff`
# zieht in `Cargo.lock` transitiv `defmt` (samt `defmt-macros`,
# `defmt-parser`) in die Laufzeit-Hülle von `harw-warden` — `defmt` ist bei
# `jiff` 0.2.32 ein rein optionales `dep:defmt` hinter dem Feature `defmt`
# (siehe `[features] defmt = ["dep:defmt"]` in der gepinnten Quelle unter
# `~/.cargo/registry/src/.../jiff-0.2.32/Cargo.toml`), und ebenso `log`
# (Feature `logging = ["dep:log"]`) sowie `jiff-static` (Feature `static`).
# Geprüft, kein Merkmal abgeschaltet: **keine** einzige `Cargo.toml` in
# diesem Workspace — weder hier noch in einer der rund fünfzig anderen
# `jiff = { workspace = true }`-Stellen, weder unter `[dependencies]` noch
# unter `[dev-dependencies]` — fordert `defmt`, `logging` oder `static` an;
# die Workspace-Wurzel setzt für `jiff` ausschließlich `features = ["serde"]`
# (siehe Root-`Cargo.toml`, `[workspace.dependencies]`). `jiff`s eigener
# `default`-Featuresatz enthält keines der drei. Damit lässt sich dieser
# Fund **nicht** durch ein abzuwählendes Feature beseitigen — es gibt keins,
# das hier aktiv ist. Der wahrscheinlichste Grund: `Cargo.lock` ist an dieser
# Stelle veraltet — die Root-`Cargo.toml` dokumentiert selbst den
# vorausgegangenen Umbau („`jiff` in fünf Schreibweisen und drei Fassungen im
# Baum“ vor der Konsolidierung auf `workspace = true`); vermutlich forderte
# eine der alten Schreibweisen `logging`/`defmt`/`static` an, und die
# Konsolidierung hat diese Feature-Zeilen entfernt, ohne dass seither ein
# `cargo`-Lauf `Cargo.lock` neu aufgelöst hätte. Diese Datei darf laut
# Auftrag kein `cargo` ausführen und `Cargo.lock` nicht schreiben — die
# Behebung ist ein `cargo update -p jiff --precise 0.2.32` (oder ein voller
# `cargo build --workspace --all-targets`), danach beide Gates erneut
# laufen lassen.
jiff = { workspace = true }
# Trägt die Bindungsregel für `AuthorizationProof::bound_action`
# (kanonische Serialisierung von `WardenAction` vor dem Digest, siehe
# `action.rs`). Deshalb ein regulärer Abhängigkeitseintrag und keine reine
# Dev-Dependency: die Digestbildung läuft zur Laufzeit, nicht nur in Tests.
# Kein zusätzliches Gewicht für das Warden-Abhängigkeitsbudget (Prüfung 2):
# `harw-types` zieht `serde_json` bereits ein.
serde_json = { workspace = true }
# Proof v2 (C-WPROTO): keyed BLAKE3 für den MAC, `blake3::Hash`-Vergleich in
# konstanter Zeit. Bereits über `harw-types` im Baum — kein zusätzliches
# Gewicht für das Warden-Abhängigkeitsbudget.
blake3 = { workspace = true }

[lints]
workspace = true
