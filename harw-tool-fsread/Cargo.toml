[package]
name = "harw-tool-fsread"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typisierte, rein lesende Dateisystem-Werkzeuge (fsread.ls/stat/find/du/df/wc/head/tail/cat/file/tree/readlink/realpath/hash/diff/json) in reinem Rust, strikt an die Workspace-Wurzel gebunden."
publish.workspace = true

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-digest = { path = "../harw-digest" }
harw-extension-api = { path = "../harw-extension-api" }
harw-fsutil = { path = "../harw-fsutil" }
harw-macros = { path = "../harw-macros" }
harw-tools = { path = "../harw-tools" }
# Gleiche Fassungen wie im Workspace (Cargo.lock): keine neue Abhängigkeit.
globset = "0.4.19"
rustix = { workspace = true, features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
# `spawn_blocking` für Walks und Datei-IO.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
harw-test-support = { path = "../harw-test-support" }
harw-types = { path = "../harw-types" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
