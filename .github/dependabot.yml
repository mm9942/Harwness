# Dependabot: monatliche Update-Vorschläge für alle Paket-Ökosysteme im Repo.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust-Hauptworkspace (Cargo.toml im Wurzelverzeichnis, inkl. aller Mitglieder).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # Eigenständiger DoD-Workspace.
  - package-ecosystem: "cargo"
    directory: "/dod"
    schedule:
      interval: "monthly"
    groups:
      dod-minor-patch:
        update-types: ["minor", "patch"]

  # Web-UI (Node/Next.js).
  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "monthly"
    groups:
      webui-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub-Actions-Workflows unter .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
