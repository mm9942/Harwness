# Dependabot: monatliche Update-Vorschläge für alle Paket-Ökosysteme im Repo.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Je Ökosystem höchstens 3 offene PRs, damit die CI nicht mit Einzel-PRs
# überflutet wird.

version: 2
updates:
  # Rust-Workspace (Cargo.toml im Wurzelverzeichnis, inkl. aller Mitglieder;
  # seit PL-60 auch die DoD-Crates unter dod/crates — ein Lockfile).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # Web-UI (Node/Next.js).
  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      webui-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub-Actions-Workflows unter .github/workflows. Alle Updates (auch
  # Major) in einem gebündelten PR pro Monat.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # Gepinnte Rust-Toolchain (rust-toolchain.toml im Wurzelverzeichnis, gilt
  # für das ganze Repo einschließlich dod/). Ein Update ändert lokal und in der CI zugleich die Version.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
