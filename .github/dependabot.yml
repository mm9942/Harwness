# Dependabot: monthly update proposals for all package ecosystems in the repo.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# At most 3 open PRs per ecosystem, so that CI is not flooded
# with individual PRs.

version: 2
updates:
  # Rust workspace (Cargo.toml in the root directory, including all members;
  # since PL-60 also the DoD crates under dod/crates — one lockfile).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # Web-UI (Node/Next.js).
  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      webui-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions workflows under .github/workflows. All updates (including
  # major) in one bundled PR per month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # Pinned Rust toolchain (rust-toolchain.toml in the root directory, applies to
  # the whole repo including dod/). An update changes the version locally and in CI at the same time.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
