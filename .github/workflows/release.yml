name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: harw

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build on the runner.
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          # Cross-compiled for the maintainer's Raspberry Pi (64-bit).
          - target: aarch64-unknown-linux-gnu
            use_cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gepinnte Toolchain aus rust-toolchain.toml (wie in ci.yml). Ein
      # `dtolnay/rust-toolchain@stable` würde hier ins Leere laufen: rustup
      # nimmt ohnehin die Datei, das Ziel landete dann in der falschen Toolchain.
      - name: Install pinned Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: |
          cargo build --release --locked -p harw-cli -p harw-killer --target ${{ matrix.target }}
          cargo build --profile release-runner --locked -p harw-agent-runner --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: |
          cross build --release --locked -p harw-cli -p harw-killer --target ${{ matrix.target }}
          cross build --profile release-runner --locked -p harw-agent-runner --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          stage="harw-${tag}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$stage/"
          cp "target/${{ matrix.target }}/release/killer" "$stage/"
          # `release-runner` (fat LTO, one codegen unit, `panic = "abort"`,
          # see the root Cargo.toml) — shipped next to `harw` so `harw agent
          # build` finds it without a further download (Makefile `install`
          # does the same for a from-source install).
          cp "target/${{ matrix.target }}/release-runner/harw-agent-runner" "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: harw-${{ matrix.target }}
          path: |
            harw-*.tar.gz
            harw-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Build combined SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz > SHA256SUMS
          rm -f -- *.tar.gz.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
