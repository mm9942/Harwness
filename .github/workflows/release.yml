name: Release

on:
  push:
    tags:
      - "v*"
  # Re-run the release for an existing tag by hand (Actions tab or API).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.8.0"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: harw
  # The tag being released: the pushed tag, or the dispatch input.
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # An experimental target may fail without holding back the release of
    # the others.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build on the runner.
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          # Cross-compiled for the maintainer's Raspberry Pi (64-bit).
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          # Termux on Android phones. No killer: harw-killer needs Linux
          # procfs and pidfd and refuses other target OSes at compile time.
          - target: aarch64-linux-android
            use_cross: true
            packages: -p harw-cli
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The OS-keyring backend of harw-secrets links libdbus (keyring
      # `sync-secret-service` -> libdbus-sys), as in ci.yml. Cross targets
      # get it through Cross.toml.
      - name: Install build dependencies
        if: ${{ !matrix.use_cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # Gepinnte Toolchain aus rust-toolchain.toml (wie in ci.yml). Ein
      # `dtolnay/rust-toolchain@stable` würde hier ins Leere laufen: rustup
      # nimmt ohnehin die Datei, das Ziel landete dann in der falschen Toolchain.
      - name: Install pinned Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: |
          cargo build --release --locked ${{ matrix.packages || '-p harw-cli -p harw-killer' }} --target ${{ matrix.target }}
          cargo build --profile release-runner --locked -p harw-agent-runner --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: |
          cross build --release --locked ${{ matrix.packages || '-p harw-cli -p harw-killer' }} --target ${{ matrix.target }}
          cross build --profile release-runner --locked -p harw-agent-runner --target ${{ matrix.target }}

      # Same layout as `make release` (scripts/package-release.sh): one
      # directory harw-<tag>-<target>/ with harw, killer and the
      # `release-runner` harw-agent-runner (fat LTO, `panic = "abort"`),
      # which `harw agent build` needs next to `harw`.
      - name: Package
        run: |
          set -euo pipefail
          stage="harw-${TAG}-${{ matrix.target }}"
          scripts/package-release.sh "${TAG}" "${{ matrix.target }}" .
          sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          rm -f SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: harw-${{ matrix.target }}
          path: |
            harw-*.tar.gz
            harw-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Build combined SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz > SHA256SUMS
          rm -f -- *.tar.gz.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: harw ${{ env.TAG }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  mirror:
    # Mirrors the release to the R2 bucket behind https://get.harw.dev/harw,
    # the default source of `curl -fsSL https://get.harw.dev/harw/install.sh | sh`.
    # Skipped (not failed) until the R2 secrets are configured.
    name: Mirror to get.harw.dev
    needs: release
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: harw
      R2_PREFIX: harw
    steps:
      - name: Checkout
        if: env.R2_ACCOUNT_ID != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Download artifacts
        if: env.R2_ACCOUNT_ID != ''
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload to R2
        if: env.R2_ACCOUNT_ID != ''
        run: |
          set -euo pipefail
          tag="${TAG}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          s3() { aws s3 cp --endpoint-url "$endpoint" --only-show-errors "$@"; }
          cd dist
          # Versioned source tarball of the tag: the installer's source path
          # prefers it (checked against SHA256SUMS) over Harwness-main.zip.
          version="${tag#v}"
          git -C .. archive --format=tar.gz --prefix="harwness-${version}/" \
            -o "$PWD/harwness-${version}-source.tar.gz" HEAD
          sha256sum -- *.tar.gz > SHA256SUMS
          for file in *.tar.gz SHA256SUMS; do
            s3 "$file" "s3://${R2_BUCKET}/${R2_PREFIX}/${tag}/${file}"
          done
          # Source archive of the tag for the installer's source path
          # (install.sh without a release for this machine).
          git -C .. archive --format=zip --prefix=Harwness-main/ -o "$PWD/Harwness-main.zip" HEAD
          s3 Harwness-main.zip "s3://${R2_BUCKET}/${R2_PREFIX}/Harwness-main.zip" \
            --content-type "application/zip" --cache-control "no-cache"
          s3 ../scripts/install.sh "s3://${R2_BUCKET}/${R2_PREFIX}/install.sh" \
            --content-type "text/x-shellscript; charset=utf-8" --cache-control "no-cache"
          # `latest` last, so it never points at a half-uploaded tag.
          printf '%s\n' "$tag" > latest
          s3 latest "s3://${R2_BUCKET}/${R2_PREFIX}/latest" \
            --content-type "text/plain; charset=utf-8" --cache-control "no-cache"
