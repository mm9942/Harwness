name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to validate, e.g. v0.10.0"
        required: true
        type: string
      publish:
        description: "Publish only after exact-commit evidence gates pass"
        default: false
        type: boolean
      ci_run_id:
        description: "Successful full manual CI run on the exact tagged commit"
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read
  actions: read

concurrency:
  group: harw-release-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Metadata and evidence gates
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Resolve candidate
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Metadata and offline tests
        run: |
          python3 scripts/release_gate.py "$TAG"
          python3 -m unittest discover -s scripts/tests -v
      # Tag pushes NEVER publish. Missing, skipped or other-commit CI cannot pass.
      - name: Require exact-commit CI and dated release notes
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$EVENT_SHA" = "$(git rev-parse HEAD)"
          test "$WORKFLOW_SHA" = "$(git rev-parse HEAD)"
          python3 scripts/release_gate.py "$TAG" --publish \
            --ci-run-id "$CI_RUN_ID" --sha "$(git rev-parse HEAD)"
      - name: Require all mirror credentials before GitHub publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY" || {
            echo 'All three R2 secrets are required; no release was published.' >&2
            exit 1
          }

  build:
    name: Build and smoke (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    # Android is a build experiment, never promoted without native Termux proof.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            use_cross: false
          - target: aarch64-linux-android
            runner: ubuntu-latest
            use_cross: true
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Install native build dependencies
        if: ${{ !matrix.use_cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config
      - name: Install pinned Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustc --version
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build native Linux packages
        if: ${{ !matrix.use_cross }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --locked -p harw-cli -p harw-killer -p harw-job-exec --target "$TARGET"
          cargo build --profile release-runner --locked -p harw-agent-runner --target "$TARGET"
      - name: Build experimental Android packages
        if: matrix.use_cross
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cross build --release --locked -p harw-cli --target "$TARGET"
          cross build --profile release-runner --locked -p harw-agent-runner --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          scripts/package-release.sh "$TAG" "$TARGET" dist
          (cd dist && sha256sum "harw-$TAG-$TARGET.tar.gz" > "harw-$TAG-$TARGET.tar.gz.sha256")
      - name: Execute packaged installer and agent runner on native architecture
        if: ${{ !matrix.experimental }}
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/smoke-release.sh "$TAG" "$TARGET" dist
      - name: Upload smoke-tested Linux artifact
        if: ${{ !matrix.experimental }}
        uses: actions/upload-artifact@v7
        with:
          name: harw-${{ matrix.target }}
          path: |
            dist/harw-*.tar.gz
            dist/harw-*.tar.gz.sha256
          if-no-files-found: error

  bundle:
    name: Finalize and verify release bundle
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: harw-*
          path: dist
          merge-multiple: true
      - name: Verify build checksums and prepare source once
        run: python3 scripts/release_bundle.py prepare "$TAG" dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  source-smoke:
    name: Build through default source installer
    needs: [preflight, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist
      - name: Install source build dependencies and pinned Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config cmake build-essential
          rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-source
      - name: Install from the final versioned source tarball
        run: bash scripts/smoke-source-release.sh "$TAG" dist

  release:
    name: Publish verified GitHub assets
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [preflight, bundle, source-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist
      - name: Recheck evidence, assets and tag before publication
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          python3 scripts/release_gate.py "$TAG" --publish --ci-run-id "$CI_RUN_ID" --sha "$CANDIDATE_SHA"
          python3 scripts/release_bundle.py verify "$TAG" dist
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$CANDIDATE_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          decoder = json.JSONDecoder()
          text = Path('releases.json').read_text().strip()
          while text:
              page, offset = decoder.raw_decode(text)
              if any(r['tag_name'] == os.environ['TAG'] for r in page):
                  raise SystemExit('Release already exists; refusing to overwrite')
              text = text[offset:].lstrip()
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag \
            --title "harw $TAG" --notes "See CHANGELOG.md. Exact-commit CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID. Android assets are excluded pending native Termux validation. R2 verification follows in this workflow."

  mirror:
    name: Mirror GitHub bytes and verify public R2 delivery
    needs: [preflight, release]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: harw
      R2_PREFIX: harw
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: expected
      - name: Download published GitHub assets and prove identity
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.tar.gz' --pattern SHA256SUMS
          cmp expected/SHA256SUMS dist/SHA256SUMS
          python3 scripts/release_bundle.py verify "$TAG" dist
      - name: Mirror and verify before promoting discovery files
        run: bash scripts/mirror-release.sh "$TAG" dist
