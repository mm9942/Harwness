name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: harw

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build on the runner.
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          # Cross-compiled for the maintainer's Raspberry Pi (64-bit).
          - target: aarch64-unknown-linux-gnu
            use_cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gepinnte Toolchain aus rust-toolchain.toml (wie in ci.yml). Ein
      # `dtolnay/rust-toolchain@stable` würde hier ins Leere laufen: rustup
      # nimmt ohnehin die Datei, das Ziel landete dann in der falschen Toolchain.
      - name: Install pinned Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: |
          cargo build --release --locked -p harw-cli -p harw-killer --target ${{ matrix.target }}
          cargo build --profile release-runner --locked -p harw-agent-runner --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: |
          cross build --release --locked -p harw-cli -p harw-killer --target ${{ matrix.target }}
          cross build --profile release-runner --locked -p harw-agent-runner --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          stage="harw-${tag}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$stage/"
          cp "target/${{ matrix.target }}/release/killer" "$stage/"
          # `release-runner` (fat LTO, one codegen unit, `panic = "abort"`,
          # see the root Cargo.toml) — shipped next to `harw` so `harw agent
          # build` finds it without a further download (Makefile `install`
          # does the same for a from-source install).
          cp "target/${{ matrix.target }}/release-runner/harw-agent-runner" "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: harw-${{ matrix.target }}
          path: |
            harw-*.tar.gz
            harw-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Build combined SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz > SHA256SUMS
          rm -f -- *.tar.gz.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  mirror:
    # Mirrors the release to the R2 bucket behind https://get.harw.dev/harw,
    # the default source of `curl -fsSL https://get.harw.dev/harw/install.sh | sh`.
    # Skipped (not failed) until the R2 secrets are configured.
    name: Mirror to get.harw.dev
    needs: release
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: harw
      R2_PREFIX: harw
    steps:
      - name: Checkout
        if: env.R2_ACCOUNT_ID != ''
        uses: actions/checkout@v7

      - name: Download artifacts
        if: env.R2_ACCOUNT_ID != ''
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload to R2
        if: env.R2_ACCOUNT_ID != ''
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          s3() { aws s3 cp --endpoint-url "$endpoint" --only-show-errors "$@"; }
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          for file in *.tar.gz SHA256SUMS; do
            s3 "$file" "s3://${R2_BUCKET}/${R2_PREFIX}/${tag}/${file}"
          done
          s3 ../scripts/install.sh "s3://${R2_BUCKET}/${R2_PREFIX}/install.sh" \
            --content-type "text/x-shellscript; charset=utf-8" --cache-control "no-cache"
          # `latest` last, so it never points at a half-uploaded tag.
          printf '%s\n' "$tag" > latest
          s3 latest "s3://${R2_BUCKET}/${R2_PREFIX}/latest" \
            --content-type "text/plain; charset=utf-8" --cache-control "no-cache"
