name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ein neuer Push auf denselben Branch/PR bricht den noch laufenden alten Lauf ab.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: read` braucht dorny/paths-filter, um bei PRs die geänderten
# Dateien über die API zu lesen (ohne Checkout).
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # ~80 workspace crates produce hundreds of test binaries; full debuginfo
  # (debuginfo=2) fills the hosted runner's disk. Line tables keep panic
  # backtraces useful at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# Toolchain: Alle Jobs installieren die in `rust-toolchain.toml` gepinnte
# Version per `rustup toolchain install` (ohne Argument liest rustup >= 1.28
# die Datei inkl. Komponenten). rustup ist auf den GitHub-Runnern
# vorinstalliert; so gibt es genau eine Quelle der Wahrheit, die Dependabot
# (Ökosystem `rust-toolchain`) aktualisiert – keine zweite Versionsangabe im
# Workflow, die auseinanderlaufen könnte, und keine Dritt-Action.
#
# Pfadfilter: Die Filter greifen nur bei `pull_request`. Bei Push auf main
# laufen immer alle Jobs. Scheitert der Filter-Job selbst, laufen ebenfalls
# alle Jobs (fail-open), damit nie ein Job ungeprüft „grün“ übersprungen wird.
# Übersprungene Jobs zählen bei GitHub als erfolgreich und blockieren
# erforderliche Checks nicht.

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dod: ${{ steps.filter.outputs.dod }}
      workflows: ${{ steps.filter.outputs.workflows }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # Alle Muster eines Filters müssen zutreffen: `rust` ist damit
          # „alles außer“ den klar Rust-fremden Pfaden. Bewusst so breit, weil
          # Crates Nicht-`.rs`-Dateien per include_str! einbetten (assets/*.md,
          # deploy/, packaging/, harw-registry-defaults/ …).
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!webui/**'
              - '!images/**'
              - '!dod/**'
              - '!.github/**'
            dod:
              - 'dod/**'
            workflows:
              - '.github/**'
            deps:
              - '**/{Cargo.toml,Cargo.lock,deny.toml}'

  check:
    name: fmt, clippy, test (root workspace)
    needs: changes
    # Auch bei `dod`-Änderungen: seit PL-60 sind die DoD-Crates Members des
    # Wurzel-Workspace, `--workspace` baut/testet sie mit, und die
    # Struktur-Gates (`xtask gates`) prüfen die DoD-Binaries.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.dod == 'true'
      || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo (root workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # The sandbox tests (harw-sandbox and friends) exec bubblewrap directly,
      # so it must be present before `cargo test` runs. libdbus-1-dev and
      # pkg-config are needed by the OS-keyring backend (`keyring` feature ->
      # libdbus-sys) that harw-secrets builds with.
      # Hosted runners ship toolchains we never use; reclaim ~20 GB for the
      # target directory.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Offline installer tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: cargo clippy
        run: cargo clippy --workspace --tests -- -D warnings

      # Verbotene Kanten, Privilegienbudget je DoD-Binary, Warden-Hülle und
      # kein C-Build im Warden-Teilbaum. Ein Gate, das nichts geprüft hat,
      # ist rot (siehe xtask/src/gates.rs).
      - name: xtask gates
        run: cargo run -q -p xtask -- gates

      # nextest führt jeden Test in einem eigenen Prozess parallel aus; Doc-Tests
      # unterstützt nextest nicht, die laufen separat über `cargo test --doc`.
      - name: cargo nextest run
        run: cargo nextest run --workspace

      - name: cargo test --doc
        run: cargo test --workspace --doc

  dod:
    name: test (dod domain, package-scoped)
    needs: changes
    # Seit PL-60 ist `dod/` kein eigener Workspace mehr; der `check`-Job baut
    # und testet die DoD-Crates bereits mit `--workspace`. Dieser Job prüft
    # die zweite, sicherheitsrelevante Konfiguration: DoD-Crates und die vier
    # DoD-Binaries **nur mit `-p`-Auswahl** gebaut und getestet. Resolver 2
    # vereinigt Features nur über die ausgewählten Pakete; so sieht der
    # Job, was die Binaries ohne die Feature-Vereinigung mit Produkt-Crates
    # (z. B. `serde_json/preserve_order`, weitere `rustix`-Features)
    # tatsächlich tun — derselbe Zuschnitt wie `dod/Makefile` (`build`).
    # dod hängt per Pfad an Root-Crates (harw-types, harw-macros …), daher
    # auch bei `rust`-Änderungen.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.dod == 'true'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      # Eigener Cache-Schlüssel: andere Feature-Auflösung als der
      # `--workspace`-Lauf im `check`-Job, also andere Artefakte.
      - name: Cache cargo (dod domain)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: dod

      # bubblewrap for the sandbox tests; libdbus-1-dev + pkg-config for the
      # OS-keyring backend (`keyring` feature -> libdbus-sys) used by harw-secrets.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config

      # Die vier DoD-Binaries gemeinsam, wie `dod/Makefile` (`build`) sie
      # baut — ohne Produkt-Binaries im selben Feature-Graphen.
      - name: Build DoD binaries (package-scoped)
        run: cargo build --locked -p harw-sentinel -p harw-probe-bpf -p harw-probe-fs -p harw-warden

      # Warden-TCB fürs Log: die Laufzeit-Hülle, die `xtask gates`
      # (warden-dependency-budget) gegen `MAX_WARDEN_RUNTIME_DEPS` zählt.
      - name: Warden runtime dependency tree
        run: cargo tree --locked -p harw-warden -e normal

      # Jedes Verzeichnis unter dod/crates ist genau ein Paket gleichen
      # Namens (geprüft von xtask: test_dod_crates_are_root_workspace_members).
      - name: cargo test (dod crates, -p selection)
        run: |
          packages=()
          for dir in dod/crates/*/; do
            packages+=(-p "$(basename "$dir")")
          done
          cargo test --locked "${packages[@]}"

  cargo-deny:
    name: cargo deny check
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.deps == 'true'
      || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Uses the repo's existing deny.toml (root of the checkout) — no
      # separate config needed. Die Action bringt ihre eigene Toolchain im
      # Container mit; rust-toolchain.toml spielt hier keine Rolle.
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  actionlint:
    name: actionlint
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Offizielles Image des actionlint-Autors (rhysd); prüft alle Workflows
      # unter .github/workflows inkl. shellcheck für `run:`-Blöcke.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  macos:
    name: test (macOS, Darwin job backend)
    needs: changes
    # Darwin-native job mechanics (harw-job-darwin) only run on macOS; the
    # Linux jobs above compile its pure parts only. harw-job-linux must still
    # compile (empty) on macOS.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.workflows == 'true') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache cargo (macOS)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: macos

      - name: cargo test (job core + Darwin backend)
        run: cargo test --locked -p harw-job-core -p harw-job-darwin

      - name: cargo check (Linux backend compiles empty on macOS)
        run: cargo check --locked -p harw-job-linux
