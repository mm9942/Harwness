name: CI

on:
  # Controlled CI: no automatic push/PR runs. Every run is started deliberately
  # via workflow_dispatch on a pushed state — after the central local build
  # from CLAUDE.md, by the session that pushed that state. A red run is fixed
  # and restarted, never skipped. To re-enable the automatic triggers,
  # uncomment the two blocks; the job conditions below still handle
  # `push` and `pull_request`.
  #
  # push:
  #   # `dev` is the integration branch, `main` the stable line. Both
  #   # get the same full CI so that nothing sits unchecked on `dev`.
  #   branches: [main, dev]
  # # All PRs, including stacked ones (base is another feature branch).
  # pull_request:
  #   types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# A new push to the same branch/PR cancels the still-running old run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# dorny/paths-filter needs `pull-requests: read` to read the changed files
# of PRs via the API (without a checkout).
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # ~80 workspace crates produce hundreds of test binaries; full debuginfo
  # (debuginfo=2) fills the hosted runner's disk. Line tables keep panic
  # backtraces useful at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# Toolchain: all jobs install the version pinned in `rust-toolchain.toml`
# via `rustup toolchain install` (without an argument, rustup >= 1.28 reads
# the file, including components). rustup is preinstalled on the GitHub
# runners; this gives exactly one source of truth, which Dependabot
# (ecosystem `rust-toolchain`) updates – no second version declaration in the
# workflow that could drift apart, and no third-party action.
#
# Path filters: the filters apply only on `pull_request`. On push (while
# enabled) and on workflow_dispatch, all jobs always run. If the filter job
# itself fails, all jobs run as well (fail-open), so that no job is ever
# skipped as an unchecked "green". Skipped jobs count as successful on
# GitHub and do not block required checks.

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dod: ${{ steps.filter.outputs.dod }}
      workflows: ${{ steps.filter.outputs.workflows }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # All patterns of a filter must match: `rust` is thus
          # "everything except" the clearly non-Rust paths. Deliberately this
          # broad, because crates embed non-`.rs` files via include_str!
          # (assets/*.md, deploy/, packaging/, harw-registry-defaults/ …).
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!webui/**'
              - '!images/**'
              - '!dod/**'
              - '!.github/**'
            dod:
              - 'dod/**'
            workflows:
              - '.github/**'
            deps:
              - '**/{Cargo.toml,Cargo.lock,deny.toml}'

  check:
    name: fmt, clippy, test (root workspace, ${{ matrix.arch }})
    needs: changes
    # Also on `dod` changes: since PL-60 the DoD crates are members of the
    # root workspace, `--workspace` builds/tests them too, and the
    # structure gates (`xtask gates`) check the DoD binaries.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.dod == 'true'
      || needs.changes.outputs.workflows == 'true') }}
    # Every change is checked on x64 and Linux arm64 (since R19): arm64
    # natively on the GitHub arm64 runner, not via cross-compile — so the
    # tests (bubblewrap, sandbox) also run on the target architecture.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo (root workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # The sandbox tests (harw-sandbox and friends) exec bubblewrap directly,
      # so it must be present before `cargo test` runs. libdbus-1-dev and
      # pkg-config are needed by the OS-keyring backend (`keyring` feature ->
      # libdbus-sys) that harw-secrets builds with.
      # Hosted runners ship toolchains we never use; reclaim ~20 GB for the
      # target directory.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Offline installer tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: cargo clippy
        run: cargo clippy --workspace --tests -- -D warnings

      # Forbidden edges, privilege budget per DoD binary, warden shell, and
      # no C build in the warden subtree. A gate that checked nothing
      # is red (see xtask/src/gates.rs).
      - name: xtask gates
        run: cargo run -q -p xtask -- gates

      # nextest runs each test in its own process in parallel; nextest does not
      # support doc tests, which run separately via `cargo test --doc`.
      - name: cargo nextest run
        run: cargo nextest run --workspace

      - name: cargo test --doc
        run: cargo test --workspace --doc

  dod:
    name: test (dod domain, package-scoped)
    needs: changes
    # Since PL-60, `dod/` is no longer a separate workspace; the `check` job
    # already builds and tests the DoD crates with `--workspace`. This job
    # covers the second, security-relevant configuration: DoD crates and the
    # four DoD binaries built and tested **with `-p` selection only**.
    # Resolver 2 unifies features only across the selected packages; this way
    # the job sees what the binaries actually do without feature unification
    # with product crates (e.g. `serde_json/preserve_order`, further `rustix`
    # features) — the same cut as `dod/Makefile` (`build`).
    # dod depends on root crates by path (harw-types, harw-macros …), hence
    # also on `rust` changes.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.dod == 'true'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      # Separate cache key: different feature resolution than the
      # `--workspace` run in the `check` job, hence different artifacts.
      - name: Cache cargo (dod domain)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: dod

      # bubblewrap for the sandbox tests; libdbus-1-dev + pkg-config for the
      # OS-keyring backend (`keyring` feature -> libdbus-sys) used by harw-secrets.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config

      # The four DoD binaries together, as `dod/Makefile` (`build`) builds
      # them — without product binaries in the same feature graph.
      - name: Build DoD binaries (package-scoped)
        run: cargo build --locked -p harw-sentinel -p harw-probe-bpf -p harw-probe-fs -p harw-warden

      # Warden TCB for the log: the runtime shell that `xtask gates`
      # (warden-dependency-budget) counts against `MAX_WARDEN_RUNTIME_DEPS`.
      - name: Warden runtime dependency tree
        run: cargo tree --locked -p harw-warden -e normal

      # Each directory under dod/crates is exactly one package of the same
      # name (checked by xtask: test_dod_crates_are_root_workspace_members).
      - name: cargo test (dod crates, -p selection)
        run: |
          packages=()
          for dir in dod/crates/*/; do
            packages+=(-p "$(basename "$dir")")
          done
          cargo test --locked "${packages[@]}"

  cargo-deny:
    name: cargo deny check
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.deps == 'true'
      || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Uses the repo's existing deny.toml (root of the checkout) — no
      # separate config needed. The action brings its own toolchain in its
      # container; rust-toolchain.toml plays no role here.
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  actionlint:
    name: actionlint
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request'
      || needs.changes.result != 'success'
      || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Official image from the actionlint author (rhysd); checks all workflows
      # under .github/workflows, including shellcheck for `run:` blocks.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  macos:
    name: test (macOS, Darwin job backend)
    needs: changes
    # Darwin-native job mechanics (harw-job-darwin) only run on macOS; the
    # Linux jobs above compile its pure parts only. harw-job-linux must still
    # compile (empty) on macOS.
    # macOS minutes cost ten times as much: only on main, by hand
    # (workflow_dispatch), or on PRs with the `macos` label.
    if: >-
      ${{ !cancelled() && (github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'macos')) }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache cargo (macOS)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: macos

      - name: cargo test (job core + Darwin backend)
        run: cargo test --locked -p harw-job-core -p harw-job-darwin

      - name: cargo check (Linux backend compiles empty on macOS)
        run: cargo check --locked -p harw-job-linux

  native-agent:
    name: native agent build (harw agent build --native)
    needs: changes
    # The native backend (harw-agent-compiler/src/backend/native.rs) is
    # otherwise only covered by golden tests of the generated crate; this job
    # runs a real `cargo build --release` of it and executes the result
    # (scripts/native-e2e.sh). A release build of the runner crates takes
    # minutes: only on main and by hand (workflow_dispatch), never on PRs.
    if: >-
      ${{ !cancelled() && (github.event_name == 'push'
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache cargo (native agent)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: native
          # The native build's own target dir (NATIVE_E2E_HOME below), so
          # harw's runner crates compile in release only when they change.
          cache-directories: ${{ runner.temp }}/native-e2e-home/cache/agent-builds/target

      # Debug harw plus a release runner build: reclaim disk like `check`.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # bubblewrap for the runner's sandbox admission; libdbus-1-dev +
      # pkg-config for the OS-keyring backend harw-secrets builds with.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config

      - name: Native backend end to end
        env:
          NATIVE_E2E_HOME: ${{ runner.temp }}/native-e2e-home
        run: sh scripts/native-e2e.sh
