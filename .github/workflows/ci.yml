name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # ~80 workspace crates produce hundreds of test binaries; full debuginfo
  # (debuginfo=2) fills the hosted runner's disk. Line tables keep panic
  # backtraces useful at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: fmt, clippy, test (root workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo (root workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # The sandbox tests (harw-sandbox and friends) exec bubblewrap directly,
      # so it must be present before `cargo test` runs. libdbus-1-dev and
      # pkg-config are needed by the OS-keyring backend (`keyring` feature ->
      # libdbus-sys) that harw-secrets builds with.
      # Hosted runners ship toolchains we never use; reclaim ~20 GB for the
      # target directory.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --tests -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  dod:
    name: test (dod workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (dod workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "dod -> target"

      # bubblewrap for the sandbox tests; libdbus-1-dev + pkg-config for the
      # OS-keyring backend (`keyring` feature -> libdbus-sys) used by harw-secrets.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev pkg-config

      - name: cargo test --workspace --locked
        working-directory: dod
        run: cargo test --workspace --locked

  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uses the repo's existing deny.toml (root of the checkout) — no
      # separate config needed.
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
