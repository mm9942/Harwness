[package]
publish.workspace = true
name = "harw-secrets"
description = "DEK/KEK envelope sealing plus append-only hash-chained ML-DSA-checkpointed audit log"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm-siv = "0.12.1"
chacha20poly1305 = "0.11.0"
# crypt_guard 3.1.0 from crates.io (workspace dependency, version and
# checksum pinned in Cargo.lock). Persisted secrets depend on the
# draft-pinned hybrid seed-to-key derivation: the KAT in
# `tests/fixtures/kem_kat.txt` and the frozen 3.0.2 records in
# `tests/fixtures/records/` must keep passing unchanged on every upgrade.
crypt_guard = { workspace = true }
getrandom = { version = "0.4.2", features = ["std"] }
# F-006: symlink-safe opening (correct O_NOFOLLOW per architecture, `harw-fsutil`).
harw-fsutil = { path = "../harw-fsutil" }
harw-macros = { path = "../harw-macros" }
harw-observe = { path = "../harw-observe" }
jiff = { workspace = true }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
rand_chacha = "0.10"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
uuid = { version = "1.23.5", features = ["serde", "v7"] }

[features]
default = []
# Opt-in OS keyring KEK provenance (§3) — desktop sessions only, never
# auto-detected. The selected `keyring` 3.6 feature set covers native macOS,
# Windows, and synchronous Secret Service stores without OpenSSL.
keyring = ["dep:keyring"]

[lints]
workspace = true
