[package]
publish.workspace = true
name = "harw-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm-siv = "0.11.1"
chacha20poly1305 = "0.10.1"
# Exact pin: persisted secrets depend on crypt_guard's draft-pinned hybrid
# seed-to-key derivation. Any upgrade must re-bless `tests/fixtures/kem_kat.txt`
# and ship a migration plan (see `kek.rs` KAT tests).
crypt_guard = "=3.0.1"
getrandom = { version = "0.4.2", features = ["std"] }
# F-006: symlinkfestes Öffnen (korrektes O_NOFOLLOW je Architektur, CONTRACTS.md §fsutil).
harw-fsutil = { path = "../harw-fsutil" }
harw-macros = { path = "../harw-macros" }
harw-observe = { path = "../harw-observe" }
jiff = { workspace = true }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
rand_chacha = "0.10"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1.23.5", features = ["serde", "v7"] }

[features]
default = []
# Opt-in OS keyring KEK provenance (§3) — desktop sessions only, never
# auto-detected. The selected `keyring` 3.6 feature set covers native macOS,
# Windows, and synchronous Secret Service stores without OpenSSL.
keyring = ["dep:keyring"]

[lints]
workspace = true
