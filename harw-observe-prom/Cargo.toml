[package]
publish.workspace = true
name = "harw-observe-prom"
description = "Prometheus text format sink for harw_observe metrics with loopback and Unix-socket endpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Baseline of every crate for the single error type (header section "Errors":
# `#[derive(harw_macros::HarwError)]`); without it there would be no way to build
# `PromError` without anyhow/thiserror.
harw-macros = { path = "../harw-macros" }
harw-observe = { path = "../harw-observe" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
