[workspace]
resolver = "2"
members = [
    # R10 Wave 2A: agent-artifact-v1 container + executable footer (leaf crate).
    "harw-agent-artifact",
    # R10 Wave 2B: compiler driver, passes, backends, `harw agent …` commands.
    "harw-agent-compiler",
    "harw-agent-dsl",
    # R10 Wave 3: standalone runner binary a compiled agent artifact is
    # embedded into (`harw-agent-compiler` probes/ships it; see
    # `[profile.release-runner]` below).
    "harw-agent-runner",
    "harw-authority",
    "harw-code-graph",
    "harw-explorer",
    "harw-tool-explorer",
    "harw-killer",
    "harw-tool-process",
    "harw-config",
    "harw-home",
    "harw-plan",
    "harw-types",
    # Leaf-Crate für ContentDigest (nur blake3 + serde), re-exportiert von harw-types.
    "harw-digest",
    "harw-protocol",
    "harw-research",
    "harw-matrix-game",
    "harw-macros",
    "harw-tools",
    "harw-operations",
    "harw-ops",
    "harw-extension-api",
    "harw-sandbox",
    "harw-catalog",
    "harw-core",
    "harw-provider",
    "harw-provider-http",
    "harw-model-catalog",
    "harw-install",
    # Phase 1 — new crates (dependency-ordered):
    "harw-secrets",
    "harw-oauth",
    "harw-session-store",
    "harw-memory",
    "harw-core-bridge",
    "harw-job-runtime",
    "harw-knowledge",
    "harw-channel",
    "harw-channel-telegram",
    "harw-channel-telegram-transport",
    "harw-mcp-server",
    "harw-mcp-client",
    # Wave J — coding-agent tool surface + baseline instructions + project discovery:
    "harw-tool-fs",
    "harw-tool-deps",
    "harw-tool-web",
    "harw-tool-doc",
    "harw-tool-shell",
    # Plan R9, Teil F: eingebautes Job-System (job.start/status/logs/stop/
    # list/wait) für lang laufende Prozesse statt tmux.
    "harw-tool-job",
    # Runde 5, Teil F: Plan-Modus (plan.write/plan.exit/plan.enter/ask_user).
    "harw-tool-plan",
    "harw-browser",
    "harw-browser-thirtyfour",
    "harw-tool-browser",
    "harw-instructions",
    "harw-project-discovery",
    "harw-plan-bridge",
    "harw-registry-defaults",
    "harw-tui",
    "harw-cli",
    "harw-completions",
    "harw",
    # === Ausbauprogramm AW0–AW7: Telemetrie, Kontext, Lens, Control Plane ===
    # (DoD ist ausgelagert nach `dod/` — eigener Cargo-Workspace, eigene
    # Builddomäne; siehe `exclude` unten und `dod/Cargo.toml`.)
    "harw-observe",
    "harw-observe-file",
    "harw-observe-prom",
    "harw-observe-otlp",
    "harw-context",
    "harw-lens-types",
    "harw-lens-rank",
    "harw-lens-chunk",
    "harw-lens-store",
    "harw-lens-index",
    "harw-lens-embed",
    "harw-lens-source",
    "harw-lens-query",
    "harw-lens-federation",
    "harw-lens",
    "harw-tool-lens",
    "harw-web",
    # === Remediation (Plan P0–P3) ===
    "harw-egress",
    "harw-fsutil",
    "harw-runtime",
    "harwness-sdk",
    "xtask",
]
# DoD ist ein eigener Cargo-Workspace in derselben Repository-Domäne: eigener
# Lockfile, eigene `workspace.package`-/`workspace.dependencies`-Vorgaben.
# `exclude` verhindert, dass Cargo `dod/` versehentlich als Teil des
# Produkt-Workspace behandelt (z. B. bei Glob-Expansion oder Metadata-Läufen).
# Pfad-Abhängigkeiten Produkt → DoD (`harw-knowledge`, `harw-plan-bridge`,
# `harw-core-bridge`, `harw-macros` [dev]) lösen über `dod/crates/…` auf und
# sind zulässig; DoD-Mitgliedschaft im Produkt-Workspace ist es nicht.
exclude = ["dod"]

[workspace.package]
version = "0.3.0"
# Kein Crate wird auf crates.io veröffentlicht; `cargo deny` behandelt sie
# damit als privat (keine Lizenzpflicht ohne Entscheidung, Pfad-Abhängigkeiten
# ohne Versionsangabe erlaubt).
publish = false
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mm9942/harwness"

# Genau eine Fassung je geteilter Abhängigkeit. Ohne diesen Abschnitt stand
# `jiff` in fünf Schreibweisen und drei Fassungen im Baum (0.2 / 0.2.28 /
# 0.2.32); bei rund fünfzig neuen Crates, die ausnahmslos `jiff` benutzen
# sollen, ist das ein Multiplikator statt einer Nachlässigkeit.
[workspace.dependencies]
# Zeitachse. Die eine erlaubte Pre-1.0-Abhängigkeit in öffentlichen Signaturen
# (Doktrin D5, präzisiert): kleine Typfläche, ein relevanter Typ.
jiff = { version = "0.2.32", features = ["serde"] }

# Serialisierung.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.3"

# Inhaltsadressierung: ContentDigest, ChunkDigest, SecurityEvidence.
blake3 = "1.8.7"

# Netzmengen. Trägt den Cidr-Zweig von NetworkScope::EgressTarget.
ipnet = { version = "2.12.1", features = ["serde"] }

# Dateien und Nebenläufigkeit — Store-Mechanik nach dem ChildLeaseStore-Muster.
fs4 = "1.1.0"
tempfile = "3.27.0"

# Beobachtung.
tracing = "0.1.44"

# Syscalls ohne libc: fanotify im Dateisystem-Wächter.
rustix = "1.1.4"

# Verzeichniseinbettung: Registry-Definitionen als Dateien statt als Rust-Liste.
include_dir = "0.7.4"

# `forbid` statt `deny`: nicht per `#[allow]` überstimmbar. Die Regel stand
# vorher als Attribut in jeder Crate einzeln und fehlte deshalb in acht von
# fünfundvierzig. Eine Regel, die pro Crate wiederholt werden muss, wird pro
# Crate vergessen.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 0

# R10 Wave 4 (docs/adr/0001-agent-compiler.md): the profile `make build`/
# `make install` use for `harw-agent-runner`. A compiled agent embeds this
# binary and ships it to end users, so its size and runtime cost matter more
# than the runner's own build time — unlike `[profile.release]` above, which
# every workspace crate builds under during normal development. `panic =
# "abort"` is safe here: the runner has no library consumer that must unwind
# across an `extern "Rust"` boundary, only its own `main`.
[profile.release-runner]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
