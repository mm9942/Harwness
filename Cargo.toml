[workspace.package]
version = "0.9.1"
# No crate is published to crates.io; `cargo deny` therefore treats them
# as private (no license obligation without a decision, path dependencies
# without a version allowed).
publish = false
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mm9942/harwness"

# Exactly one version per shared dependency. Without this section `jiff`
# appeared in five spellings and three versions in the tree (0.2 / 0.2.28 /
# 0.2.32); with around fifty new crates that are all supposed to use `jiff`,
# that is a multiplier rather than an oversight.
[workspace.dependencies]
# Time axis. The one allowed pre-1.0 dependency in public signatures
# (doctrine D5, clarified): small type surface, one relevant type.
jiff = { version = "0.2.32", features = ["serde"] }

# Serialization.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.3"

# Content addressing: ContentDigest, ChunkDigest, SecurityEvidence.
blake3 = "1.8.7"

# Network sets. Carries the Cidr branch of NetworkScope::EgressTarget.
ipnet = { version = "2.12.1", features = ["serde"] }

# Files and concurrency — store mechanics following the ChildLeaseStore pattern.
fs4 = "1.1.0"
tempfile = "3.27.0"

# Observation.
tracing = "0.1.44"

# Syscalls without libc: fanotify in the filesystem watcher.
rustix = "1.1.4"
# CryptGuard 3.1.0 is published on crates.io as of R15 (see
# docs/planning/90-migration-ledger/MIGRATION_LEDGER.md, MIG-015); no git source needed anymore.
crypt_guard = { version = "3.1.0", default-features = false, features = ["ml-kem-backend", "ml-dsa-backend"] }
crypt_guard_service = { version = "3.1.0", features = ["ml-dsa"] }
crypt_guard_hyper = { version = "3.1.0" }
procfs = { version = "0.18.0", default-features = false }
landlock = "0.4.7"
cap-std = "4.0.3"

# Directory embedding: registry definitions as files instead of a Rust list.
include_dir = "0.7.4"

# Version comparison (security signal, not a string comparison). Taken over
# from the former `dod/Cargo.toml` (PL-60); consumers:
# `harw-dod-rules`, `harw-dod-sentinel`, `harw-dod-workspace`.
semver = { version = "1.0.28", features = ["serde"] }

# `forbid` instead of `deny`: cannot be overridden with `#[allow]`. The rule
# used to be an attribute in each crate individually and was therefore missing
# in eight of forty-five. A rule that has to be repeated per crate gets
# forgotten per crate.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 0

# R10 Wave 4 (docs/adr/0001-agent-compiler.md): the profile `make build`/
# `make install` use for `harw-agent-runner`. A compiled agent embeds this
# binary and ships it to end users, so its size and runtime cost matter more
# than the runner's own build time — unlike `[profile.release]` above, which
# every workspace crate builds under during normal development. `panic =
# "abort"` is safe here: the runner has no library consumer that must unwind
# across an `extern "Rust"` boundary, only its own `main`.
[profile.release-runner]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
