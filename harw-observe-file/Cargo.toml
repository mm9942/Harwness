[package]
publish.workspace = true
name = "harw-observe-file"
description = "JSONL sink with file rotation and checksums for telemetry data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# harw-macros is the baseline of every crate for the single error type
# (header section "Errors": `#[derive(harw_macros::HarwError)]`), not part of the
# list explicitly enumerated for harw-observe-file, but without it there would be
# no way to build `ObserveFileError` without anyhow/thiserror.
harw-macros = { path = "../harw-macros" }
harw-observe = { path = "../harw-observe" }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
