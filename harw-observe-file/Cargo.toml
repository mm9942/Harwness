[package]
publish.workspace = true
name = "harw-observe-file"
description = "JSONL sink with file rotation and checksums for telemetry data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# harw-macros ist Baseline jeder Crate für den einen Fehlertyp
# (Kopfteil "Fehler": `#[derive(harw_macros::HarwError)]`), nicht Teil der
# für harw-observe-file explizit aufgezählten Liste, aber ohne sie gäbe es
# keinen Weg, `ObserveFileError` ohne anyhow/thiserror zu bauen.
harw-macros = { path = "../harw-macros" }
harw-observe = { path = "../harw-observe" }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
harw-test-support = { path = "../harw-test-support" }
tempfile = { workspace = true }

[lints]
workspace = true
