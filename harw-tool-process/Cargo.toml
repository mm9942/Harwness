[package]
name = "harw-tool-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Agent tools process.list/process.kill over the library API of harw-killer (Linux only)."
publish.workspace = true

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-extension-api = { path = "../harw-extension-api" }
harw-macros = { path = "../harw-macros" }
harw-tools = { path = "../harw-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# `harw-killer` is deliberately Linux-only (pidfd, /proc); on other targets
# both tools return a clear tool error instead of failing to build.
[target.'cfg(target_os = "linux")'.dependencies]
harw-killer = { path = "../harw-killer" }
# `spawn_blocking`: `preview`/`kill_own` block (snapshot, waiting for
# process end up to `timeout + kill_wait`) and must not hold the executor.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
harw-types = { path = "../harw-types" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
