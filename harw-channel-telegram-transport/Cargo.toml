[package]
publish.workspace = true
name = "harw-channel-telegram-transport"
description = "Telegram Bot API transport with long-poll/webhook ingress, message mapping, and rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-channel = { path = "../harw-channel" }
harw-channel-telegram = { path = "../harw-channel-telegram" }
harw-secrets = { path = "../harw-secrets" }
harw-types = { path = "../harw-types" }
jiff = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.53.0", features = ["rt", "macros", "time", "net"] }
secrecy = "0.10"
axum = "0.8.9"
# Without a version pin, like all other workspace-internal path deps: a version
# next to `path` is redundant for the local build and becomes a second
# place to forget on a version bump.
# `harw/tests/version_coherence.rs` checks exactly that.
harw-config = { path = "../harw-config" }
infer = "0.22.0"
fs4 = "1.1.0"
tempfile = "3.27.0"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
