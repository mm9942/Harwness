[package]
publish.workspace = true
name = "harw-web"
description = "HTTP web transport for Control Plane operations with Unix socket peer authentication and permission enforcement"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Sole source of authority: the registry, `Surface`, `WebAdapter`,
# `OpContext`, `PermissionTier`, `ApprovalPolicy`. harw-web itself defines
# no operation — see the lib.rs module docs "no second authority path".
harw-operations = { path = "../harw-operations" }
# `TrustClass` — the trust class the surface needs to make AW4-01's
# two-block separation visible (see the events.rs module docs "Where the
# class comes from — and where it gets lost").
harw-context = { path = "../harw-context" }
# `#[derive(HarwError)]` for `src/error.rs` — the same in-house error
# derive as in harw-sentinel/src/ipc.rs, no thiserror/anyhow.
harw-macros = { path = "../harw-macros" }

# Peer identification via SO_PEERCRED without unsafe — the same crate and
# feature as in harw-sentinel/Cargo.toml, whose ipc.rs sets the pattern
# (rustix::net::sockopt::socket_peercred).
rustix = { workspace = true, features = ["net"] }

# HTTP stack: identical to harw-mcp-server/Cargo.toml (the Streamable-HTTP
# model for this node) — same version specs, so the workspace gets no second
# HTTP library and no second version resolution.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http-body-util = { version = "0.1", features = ["channel"] }
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "io-util", "time"] }
# systemd socket activation (`--systemd-socket`, crypto master plan v2 H9):
# the same crate and version as harw-auth-hub/harw-netsec/harw-warden, so
# `src/systemd.rs` can take over the passed descriptor without its own
# `unsafe`.
sd-listen-fds = "0.2.0"

# The approval concept is durable and already exists: `ApprovalRecord`,
# `ApprovalStore`, the state transitions in the file suffix. `src/security.rs`
# resolves a record; it does not invent a second store.
harw-session-store = { path = "../harw-session-store" }
# `ApprovalActor` -- who decided. Derived from the peer credentials, never
# from the request body.
harw-types = { path = "../harw-types" }
jiff = { workspace = true }
# H12: `SecurityHubClient::verify_context` — the only way `harw-web`
# checks a context reference presented by the client against the
# SecurityHub (`src/identity.rs`). No socket code of its own.
harw-infra-client = { path = "../harw-infra-client" }

serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `tests/identity_routes.rs` runs a real `Execute` route and therefore needs
# a real `OpContext` — that is, a `SandboxSpec` over a real
# `WorkspaceBinding` (`SandboxSpec::from_resolved`). Test dependency only;
# `harw-authority` is in the graph anyway via `harw-operations`.
harw-authority = { path = "../harw-authority" }
# Parse `[web.identity]` examples in tests exactly as they appear in the
# TOML configuration (key `"1000"` etc.).
toml = { workspace = true }

[lints]
workspace = true
