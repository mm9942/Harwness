[package]
publish.workspace = true
name = "harw-model-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
harw-config = { path = "../harw-config" }
harw-context = { path = "../harw-context" }
harw-lens-types = { path = "../harw-lens-types" }
harw-types = { path = "../harw-types" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "blocking"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt"] }
time = { version = "0.3.53", features = ["serde-well-known", "formatting", "parsing"] }
toml = "1.1.3"

[lints]
workspace = true
