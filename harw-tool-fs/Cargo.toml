[package]
publish.workspace = true
name = "harw-tool-fs"
description = "Filesystem tool provider: read, write, edit, list, search, glob, grep with path sandboxing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-extension-api = { path = "../harw-extension-api" }
harw-home = { path = "../harw-home" }
harw-macros = { path = "../harw-macros" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
harw-sandbox = { path = "../harw-sandbox" }
harw-fsutil = { path = "../harw-fsutil" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Versions taken from the workspace `Cargo.lock` (see AP W2-01..03).
regex = "1.13.0"
globset = "0.4.19"
ignore = "0.4.32"
# `spawn_blocking` for walks and file I/O (version from `Cargo.lock`, W1-02).
tokio = { version = "1.53.0", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"

[lints]
workspace = true
