[package]
publish.workspace = true
name = "harw-tool-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-extension-api = { path = "../harw-extension-api" }
harw-macros = { path = "../harw-macros" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
harw-sandbox = { path = "../harw-sandbox" }
harw-fsutil = { path = "../harw-fsutil" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Versionen belegt aus dem Workspace-`Cargo.lock` (siehe AP W2-01..03).
regex = "1.13.0"
globset = "0.4.19"
ignore = "0.4.32"
# `spawn_blocking` für Walks und Datei-IO (Version aus `Cargo.lock`, W1-02).
tokio = { version = "1.53.0", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"

[lints]
workspace = true
