[package]
name = "harw-tool-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typisierte, rein lesende Prozess-/System-Werkzeuge (sys.ps/pgrep/top/free/uptime/uname/env/id/ss/lsof/date/which) in reinem Rust über /proc und rustix."
publish.workspace = true

[dependencies]
harw-extension-api = { path = "../harw-extension-api" }
harw-macros = { path = "../harw-macros" }
harw-tool-fsread = { path = "../harw-tool-fsread" }
harw-tools = { path = "../harw-tools" }
# Gleiche Fassungen wie im Workspace (Cargo.lock): keine neue Abhängigkeit.
regex = "1.13.0"
# `process`: getuid/getgroups, `system`: uname, `param`: Ticks/Seitengröße, `fs`: access(X_OK).
rustix = { workspace = true, features = ["fs", "process", "system", "param"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
harw-authority = { path = "../harw-authority" }
harw-test-support = { path = "../harw-test-support" }
harw-types = { path = "../harw-types" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
