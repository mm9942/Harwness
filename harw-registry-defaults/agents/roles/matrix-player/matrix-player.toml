# Eingebaute Matrix-Game-Rolle `matrix-player` (Runde 3, Welle E) — einer der drei
# Sitz-Typen des Matrix-Games (`harw-matrix-game`), neben
# `matrix-umpire` (Schiedsrichter) und `matrix-market` (Markt).
#
# Namensableitung (AW6-00-Konvention): Dateistamm `matrix-player` unter
# `agents/roles/matrix-player/` ergibt den Rollennamen `"matrix-player"`
# (`role_names::MATRIX_PLAYER` in `src/profile.rs`).
#
# ── Warum keine Werkzeuge ───────────────────────────────────────────────────
# Der Matrix-Runner (`harw-ops/src/matrix/runner.rs`) übergibt jedem Sitz
# seine Sicht auf das Spiel (Szenario, Journal-Auszug, erwarteter Aufruf)
# vollständig im Prompt und liest die Antwort als Text zurück. Die Rolle
# ruft deshalb selbst nichts auf: `[tools].admitted` bleibt leer, das
# Registry-Profil ist `RegistryProfile::NoTools`, der Reducer
# `AuthorityReducer::ReadOnly` — kein Schreiben, keine Ausführung, kein Netz.
# `forbidden` benennt jedes Schreib-, Ausführungs- und Netzwerkzeug
# trotzdem ausdrücklich, damit eine Ablehnung nachvollziehbar bleibt
# (dieselbe Disziplin wie bei den `security-*-triage`-Rollen).
#
# ── Rückgabevertrag ──────────────────────────────────────────────────────────
# `harwness.matrix.player-move@1` ist ein undurchsichtiges Label: `ChildReturnContract::parse`
# kennt es nicht und reicht die Antwort als Freitext durch. Die Prüfung der
# Antwortform übernimmt der Matrix-Runner selbst (Reparatur-Prompt bei
# Vertragsbruch).

schema = "harwness.agent/v1"
id = "harwness.agent.matrix-player@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "matrix-player"

name = "Matrix Player"
description = "Spielt einen Sitz im Matrix-Game: formuliert aus der eigenen Sicht einen Zug mit Absicht, Handlung und Begründung; ohne Werkzeuge und ohne Netz."

[work]
mode = "matrix-game-player"
may_write_code = false
may_research_web = false

# Keine Werkzeugoberfläche — siehe Begründung oben.
[tools]
admitted = []
forbidden = [
    "fs.write",
    "shell.exec",
    "process.kill",
    "web.fetch",
    "web.search",
    "web.docs_rs",
    "web.crates_io",
]

# Ein Sitz spielt seinen Zug selbst und startet keine Kind-Agenten.
[spawn]
max_depth = 0

# Reiner Textzug: großzügiges Token-Budget, kein einziger Werkzeugaufruf.
[spawn.budget]
max_tokens = 60000
max_tool_calls = 0
max_wall_secs = 300

[return]
contract = "harwness.matrix.player-move@1"
