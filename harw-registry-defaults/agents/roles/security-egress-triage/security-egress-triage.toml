# Eingebauter Egress-Triage-Spezialist (Knoten AW6-03) — erste der vier
# Triage-Spezialisierungen des Security-Clans
# (`harwness.family.security@1`, siehe `agents/families/security/security.toml`),
# neben `security-baseline-triage`, `security-structure-triage` und
# `security-endpoint-triage`.
#
# Namensableitung (AW6-00-Konvention): Dateistamm `security-egress-triage`
# unter `agents/roles/security-egress-triage/` ergibt den Rollennamen
# `"security-egress-triage"`. Kollidiert mit nichts Bestehendem (geprüft
# gegen `intel-scout`, `context-steward`, die drei übrigen `security-*`-
# Rollen dieses Knotens und die fünf Basisrollen unter `agents/`).
#
# ── Was diese Rolle triagiert, und aus welcher Ereignisquelle ───────────────
# Sie triagiert Netzwerk-Befunde: `EventKind::EgressFlow` und
# `EventKind::ListenerOpened` aus `harw_dod_signals::SecurityEvent` (die
# Ereignisquelle "Netz" aus dem Sensor-Katalog) sowie die daraus von
# `harw_dod_rules::rules::EgressFlowRule` abgeleiteten `Finding<RuleChecked>`.
# Beide Felder — `destination` und `port` — sind laut `EgressFlowRule`-
# Moduldoku angreiferkontrollierte Freitextfelder ("mal ein Hostname, mal
# eine literale Adresse"); genau deshalb ist ihre Sichtung eine Triage-
# Aufgabe und keine Autorisierungsentscheidung. Die Rolle bekommt bereits
# ausgewertete `Finding<RuleChecked>`-Batches (und bei Bedarf die zugrunde
# liegenden `SecurityEvent`-Rohwerte) als Parameter übergeben — sie ruft
# `EgressFlowRule::evaluate` nicht selbst auf und liest `NetworkScope` nicht
# selbst ein; das bleibt der reinen, deterministischen Regelauswertung in
# `harw-dod-rules` vorbehalten (siehe deren Reinheitsauflage: kein I/O, keine
# Systemuhr).
#
# ── Warum genau diese Werkzeuge (keine) ──────────────────────────────────────
# `[tools].admitted` bleibt leer, exakt wie bei `context-steward` und aus
# demselben Grund: die heutige Implementierung nimmt bereits abgerufene
# `Finding`-/`SecurityEvent`-Batches als Eingabeparameter entgegen, statt
# selbst ein Werkzeug aufzurufen. Ein Triage-Agent liest
# angreiferkontrollierte Sensorfelder — er bekommt deshalb bewusst KEIN
# Werkzeug, mit dem er selbst Netzverkehr erzeugen oder ein Ziel anfragen
# könnte (kein `web.*`, kein Netzzugriff jenseits dessen, was die Familie
# `security` ausdrücklich gewährt — hier: nichts). `forbidden` benennt
# trotzdem jedes Schreib- und Netzwerkzeug ausdrücklich, damit eine
# Ablehnung nachvollziehbar ist statt nur "nicht in admitted" (dieselbe
# Disziplin wie bei `intel-scout`/`context-steward`). Da `admitted` leer
# ist, ist die Auflage "jedes admittierte Werkzeug muss von
# `AUTO_APPROVED_TOOLS` gedeckt sein" (`harw-registry-defaults/src/lib.rs`)
# hier trivial erfüllt — es gibt nichts einzutragen und nichts zu melden.
#
# ── Was sie ausdrücklich NICHT tut ──────────────────────────────────────────
#   - sie ruft keine Regel auf und liest keinen `NetworkScope` selbst — das
#     bleibt `harw-dod-rules` vorbehalten;
#   - sie trifft keine Eskalationsentscheidung — ihr Ergebnis ist ein
#     Verdikt-VORSCHLAG (`harwness.security-verdict/v1`, siehe unten),
#     niemals ein committeter `Finding<Triaged>`; das Committen bleibt
#     ausschließlich `harw-dod-escalate` vorbehalten;
#   - sie schreibt nichts und startet keinen Subprozess (`may_write_code =
#     false`, kein `shell.exec`/`fs.write` in `[tools].admitted`).
#
# ── Rückgabevertrag ──────────────────────────────────────────────────────────
# Diese Rolle deklariert ihren Vertrag SELBST (`[return]` am Dateiende). Der
# frühere Kommentar an dieser Stelle behauptete das Gegenteil — „kein eigenes
# `[return]`, die Familie setzt `[defaults].return_contract` für alle ihre
# Mitglieder“. Das war falsch, und zwar nicht nur beim Senken über
# `role_names::ALL`, sondern grundsätzlich: es gibt diese Vererbung nicht.
#
#   * `harw_agent_dsl::family::resolve_family` legt `[defaults]` unverändert
#     als `toml::Table` in `ResolvedFamily.defaults` ab — mehr passiert dort
#     nicht.
#   * `harw_agent_dsl::executable::lower` liest den Vertrag ausschließlich aus
#     der aufgelösten Konfiguration DES AGENTEN:
#     `config_string(&resolved.config, &["return", "return_pipeline"], "contract")`.
#   * Zwischen beidem existiert kein Pfad. `resolve_definition` und `lower`
#     bekommen überhaupt keine Familie zu sehen, und `ResolvedFamily.defaults`
#     hat außerhalb von `family.rs` selbst keinen Konsumenten. Familien-
#     `[defaults]` sind heute eine deklarative Notiz, keine Vererbung.
#
# Die Deklaration hier ist deshalb keine Redundanz, sondern die einzige
# Quelle. Genau so hält es die Research-Familie schon lange: `research.toml`
# führt ebenfalls `[defaults].return_contract`, und trotzdem deklariert JEDE
# ihrer drei Rollen (`explorer`, `researcher-deps`, `researcher-web`) ihren
# `[return].contract` zusätzlich selbst — sonst trüge keine von ihnen einen.
# `intel-scout` und `context-steward` machen es NICHT vor: beide deklarieren
# keinen `[return]` und tragen folglich tatsächlich keinen Vertrag. Das fällt
# nur nicht auf, weil sie nicht in `role_names::ALL` stehen und daher nie
# gesenkt werden.
#
# `harwness.security-verdict/v1` ist der vierte Arm des `ChildReturnContract`,
# eigens für Sicherheitsverdikte gebaut. Eine Triage-Rolle MUSS ihn tragen:
# ihr Ergebnis ist ein Verdikt-VORSCHLAG, kein Freitext — und kein Commit.

schema = "harwness.agent/v1"
id = "harwness.agent.security-egress-triage@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "security-egress-triage"

name = "Security Egress Triage"
description = "Sichtet Netzwerk-Befunde (EgressFlow/ListenerOpened) gegen bereits ausgewertete EgressFlowRule-Funde; schlägt ein Verdikt vor, committet nie."

[work]
mode = "network-egress-triage"
may_write_code = false
may_research_web = false

# Keine Werkzeugoberfläche beansprucht — siehe Begründung oben.
[tools]
admitted = []
forbidden = ["fs.write", "shell.exec", "web.fetch", "web.docs_rs", "web.crates_io"]

# Ein reiner Sichtungs-/Vorschlags-Job braucht keine Kind-Agenten.
[spawn]
max_depth = 0

[spawn.budget]
max_tokens = 40000
max_tool_calls = 20
max_wall_secs = 120

# Der Rückgabevertrag — selbst deklariert, nicht geerbt (die vollständige
# Begründung samt Beweis, dass die Familien-`[defaults]` nirgends greifen,
# steht im Kopf dieser Datei). `contract` ist für `ReturnPipeline` ein
# undurchsichtiges Label; die IR prüft weder Existenz noch Form des Schemas
# (`harw-agent-dsl/src/executable.rs`).
[return]
contract = "harwness.security-verdict/v1"

# Kontextprogramm (Runde 3, Welle C2): bindet `agents/context-programs/triage.toml`.
# `embedded_agents::bind_context_program` liest diese Zeile aus der eigenen
# Tabelle der Rolle (die Aufloesung verwirft das `[context]` des Kindes, weil
# `worker-base` eines fuehrt) und ergaenzt das geerbte `[context]` um das
# Programm. Ein unbekannter Name bricht das Laden der Rolle hart ab.
[context]
program = "triage"
