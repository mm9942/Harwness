# Eingebauter Schnellhelfer der UIA (Addendum J, ersetzt den
# Exklusivitaets-Mechanismus aus Addendum I).
#
# Nutzerentscheidung: `uia-worker` ist eine eigene, vollstaendig
# abgekapselte Organisationsrolle (`AgentRoleId::UiaWorker`,
# `harw-agent-dsl/src/roles.rs`) neben `worker` — Root- und
# Sub-Orchestratoren duerfen ihn weder sehen noch spawnen, das erzwingt
# bereits die versiegelte Spawn-Matrix selbst (kein
# `exclusive_parent_role` mehr noetig). Zweck sind kleine Schnelleingriffe:
# eine Frage mit einem Aufruf beantworten, schnell etwas in der Shell
# regeln, eine Datei lesen — vergleichbar schnelle Dinge. Alles darueber
# hinaus ist ein klares Nein und geht als Auftrag an Root.
#
# Vorher war diese Rolle reine Netz-Recherche
# (`RegistryProfile::Research`, identisch zu `researcher-web`). Addendum I
# korrigierte das auf `RegistryProfile::UiaQuickHelper`: lesender
# Workspace-Zugriff (`fs.read/list/search/glob/grep`) plus `shell.exec`
# (laeuft wie ueberall ueber Sandbox+Freigabe), kein `fs.write`, kein
# `lens.ask`. Die damalige Beschraenkung auf `web.fetch` ohne `deps.*` gilt
# nicht mehr: heute admittiert die Rolle alle vier `web.*`-Werkzeuge
# (`UIA_HELPER_WEB_TOOLS`) und die fuenf lesenden `deps.*`-Werkzeuge, siehe
# die Nutzerentscheidungen unten und `[tools].admitted`. Die tatsaechlich
# erreichbaren Netz-Hosts stammen aus dem egress-gebundenen Netz der
# UIA-Wurzel, das der Helfer erbt (nie breiter als beim Elternteil); jeder
# Abruf laeuft zusaetzlich durch die Egress-Policy.
#
# Nutzerentscheidung (ersetzt den letzten Satz von Addendum I): `uia-worker`
# darf zusaetzlich `browser.open` benutzen — `RegistryProfile::UiaQuickHelper`
# registriert und bewirbt genau dieses eine Browser-Werkzeug (siehe
# `UIA_QUICK_HELPER_BROWSER_TOOLS` in `harw-registry-defaults/src/profile.rs`).
# Die uebrigen sechs `browser.*`-Werkzeuge (`observe`/`find`/`act`/`wait`/
# `events`/`close`) bleiben ausdruecklich verboten — keine Rolle admittiert
# sie, `uia-worker` eingeschlossen.
#
# Nutzerentscheidung (ersetzt "ausschliesslich `web.fetch` — kein `deps.*`"
# aus Addendum I): `uia-worker` recherchiert kurz online und fuegt manchmal
# eine Abhaengigkeit hinzu. Die Rolle admittiert deshalb zusaetzlich
# `web.search` und die fuenf rein lesenden `deps.*`-Werkzeuge
# (`deps.graph`/`deps.locked` ueber `ReadWorkspace`, `deps.source_*` ueber
# `ReadCargoRegistry`), um Versionen und Quellen vor dem Hinzufuegen zu
# pruefen. Spaetere Nutzerentscheidung: auch `web.docs_rs`/`web.crates_io`
# (rein lesend, egress-gebunden wie `web.fetch`/`web.search`,
# `UIA_HELPER_WEB_TOOLS`). Netz ist nie weiter als das des Elternteils: Reducer
# `reduce_to_read_explore` (`AuthorityReducer::ReadExplore`), die
# Kind-Sandbox erbt Recht und Host-Scope des Elternteils, und jeder Abruf
# laeuft zusaetzlich durch die Egress-Policy.

schema = "harwness.agent/v1"
id = "harwness.agent.uia-worker@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "uia-worker"
specialization = "uia-worker"

name = "UIA Quick Helper"
description = "Schnellhelfer der UIA fuer kleine Schnelleingriffe: eine Frage, ein Shell-Griff, ein Dateilesen."

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "shell.exec",
  "deps.graph",
  "deps.locked",
  "deps.source_read",
  "deps.source_search",
  "deps.source_list",
  "web.fetch",
  "web.docs_rs",
  "web.crates_io",
  "web.search",
  "browser.open",
  # Lesende Wissenswerkzeuge (Plan Teil D, Entscheidung der Nutzerin
  # „Agenten dürfen Workbench, Palace und Diary lesen“): nur lesend,
  # `ReadWorkspace`. Die Composition-Root montiert sie, sobald ein
  # Wissensspeicher existiert — siehe
  # `harw_registry_defaults::profile::knowledge_tools_for_role`. Kanban
  # bleibt der UIA-Wurzel und dem Root-Orchestrator vorbehalten.
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
]
forbidden = [
  "fs.write",
  "lens.ask",
  "browser.observe",
  "browser.find",
  "browser.act",
  "browser.wait",
  "browser.events",
  "browser.close",
]

[spawn]
max_depth = 0

[spawn.budget]
max_tokens = 20000
# Kurze Online-Recherche (Suche, zwei, drei Abrufe, Crate-Metadaten) braucht
# mehr als die frueheren 6 Aufrufe/90 s; weiterhin ein Schnellhelfer.
max_tool_calls = 16
max_wall_secs = 180
effort_cap = "low"

[return]
contract = "harwness.return.execution-summary@1"
