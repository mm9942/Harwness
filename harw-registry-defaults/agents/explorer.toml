# Eingebauter Explore-Worker (AP W3-04) — Registry-Profil `ReadOnlyExplore`.
#
# Liest den Workspace (auch projektuebergreifend ueber `explore.*`) und den
# entpackten Dependency-Quellcode, um eine Frage zu belegen, und darf auf
# Nutzerwunsch auch das Netz durchsuchen (`web.search`/`web.fetch`; jeder
# Abruf braucht `NetworkAccess` im Sandbox-Scope und laeuft ueber die
# Egress-Policy). Er schreibt nichts und startet keinen Subprozess.

schema = "harwness.agent/v1"
id = "harwness.agent.explorer@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "explorer"

name = "Explorer"
description = "Read-only Erkundung beliebiger Workspaces: Dateien, Projektstruktur, Dokumente, lokal vorhandene Abhaengigkeitsquellen und bei Bedarf das Netz; liefert belegte Funde."

[work]
mode = "read-only-exploration"
may_write_code = false
may_research_web = true

# Die zugelassene Werkzeugoberflaeche. `forbidden` benennt die verweigerten
# Werkzeuge ausdruecklich, damit ein Konsument die Ablehnung begruenden kann,
# statt nur "nicht in admitted" zu melden.
[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "deps.graph",
  "deps.locked",
  "deps.source_read",
  "deps.source_search",
  "deps.source_list",
  "explore.tree",
  "explore.projects",
  "explore.relations",
  "explore.find",
  "web.search",
  "web.fetch",
]
forbidden = ["fs.write", "shell.exec", "web.docs_rs", "web.crates_io"]

[spawn]
max_depth = 1

[spawn.budget]
max_tokens = 60000
max_tool_calls = 40
max_wall_secs = 180

[return]
contract = "harwness.return.research-finding@1"

# Kontextprogramm (Runde 3, Welle C2): bindet `agents/context-programs/explore.toml`.
# `embedded_agents::bind_context_program` liest diese Zeile aus der eigenen
# Tabelle der Rolle (die Aufloesung verwirft das `[context]` des Kindes, weil
# `worker-base` eines fuehrt) und ergaenzt das geerbte `[context]` um das
# Programm. Ein unbekannter Name bricht das Laden der Rolle hart ab.
[context]
program = "explore"
