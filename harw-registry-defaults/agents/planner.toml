# Eingebauter Planungs-Worker (AP W3-04) — Registry-Profil `Planning`.
#
# Erzeugt einen Planvorschlag; er veraendert den autoritativen Plan nicht selbst.
# `plan` und `goal` sind Operationen der Composition-Root, nicht dieses Crates —
# `harw-registry-defaults` registriert fuer dieses Profil nur die read-only
# Tool-Provider. Seit W1-05 (Register F-014, G-003) admittiert der Planner
# `plan`/`goal` deshalb nicht mehr: seine Kind-Registry traegt keinen
# Executor dafuer (`may_change_plan = false` ist damit wahrheitsgemaess), und
# die fruehere Admission zwang beide ueber `RegistryProfile::tool_names` in
# `AUTO_APPROVED_TOOLS`, obwohl sie `model_tool(approval = "always")`
# deklarieren. Den Plan veraendert nur die Root-Session — mit Rueckfrage.

schema = "harwness.agent/v1"
id = "harwness.agent.planner@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "planner"

name = "Planner"
description = "Erzeugt aus belegtem Kontext einen Planvorschlag, ohne den autoritativen Plan zu mutieren."

[work]
mode = "plan-proposal"
may_change_plan = false
may_write_code = false

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "deps.graph",
  "deps.locked",
  "deps.source_read",
  "deps.source_search",
  "deps.source_list",
  # `lens.ask` ist read-only Retrieval (semantische Abfrage ueber
  # `docs.design`/`knowledge.palace`) und kein Mutations-Werkzeug — ein
  # Planner darf lesen, siehe die uebrigen `fs.*`/`deps.*`-Eintraege oben.
  # Ohne diesen Eintrag sieht der Planner `lens.ask` im beworbenen
  # Werkzeuginventar (`RegistryProfile::Planning::tool_names`) und darf es
  # trotzdem nicht aufrufen, weil `harw-core/src/session.rs` die
  # `SessionActivation` deny-by-default aus genau dieser `admitted`-Liste
  # baut. `RegistryProfile::Planning` registriert `lens.ask` ausdrueck-
  # lich nur fuer die Rolle `planner` (siehe `LENS_TOOLS`-Begruendung in
  # `harw-registry-defaults/src/profile.rs`) — ein Planvorschlag entsteht
  # aus Design-Dokumenten und abgelegtem Kontextwissen, die genau dieser
  # Index abfragt; ohne ihn muesste der Planner dieselbe Frage nur noch per
  # `fs.grep`/`fs.search` erraten.
  "lens.ask",
  # `explore.*` (harw-tool-explorer): rein lesender Ueberblick ueber den
  # Workspace-Baum, `RegistryProfile::Planning` registriert ihn.
  "explore.tree",
  "explore.projects",
  "explore.relations",
  "explore.find",
  # Lesende Wissenswerkzeuge (Plan Teil D, Entscheidung der Nutzerin
  # „Agenten dürfen Workbench, Palace und Diary lesen“): nur lesend,
  # `ReadWorkspace`. Die Composition-Root montiert sie, sobald ein
  # Wissensspeicher existiert — siehe
  # `harw_registry_defaults::profile::knowledge_tools_for_role`. Kanban
  # bleibt der UIA-Wurzel und dem Root-Orchestrator vorbehalten.
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
  # Runde 5, Teil M: Zwischenstand (info) oder Frage (question) an den direkten
  # Elternteil; nur Text, keine Rechte (siehe
  # `harw_registry_defaults::profile::parent_message_tools_for_role`).
  "parent.message",
]
forbidden = ["fs.write", "fs.edit", "shell.exec", "web.fetch", "web.search", "web.docs_rs", "web.crates_io"]

[spawn]
max_depth = 1

[spawn.budget]
max_tokens = 60000
max_tool_calls = 40
max_wall_secs = 180

[return]
contract = "harwness.return.plan-proposal@1"

# Kontextprogramm (Runde 3, Welle C2): bindet `agents/context-programs/plan.toml`.
# `embedded_agents::bind_context_program` liest diese Zeile aus der eigenen
# Tabelle der Rolle (die Aufloesung verwirft das `[context]` des Kindes, weil
# `worker-base` eines fuehrt) und ergaenzt das geerbte `[context]` um das
# Programm. Ein unbekannter Name bricht das Laden der Rolle hart ab.
[context]
program = "plan"
