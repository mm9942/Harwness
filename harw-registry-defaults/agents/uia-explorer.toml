# Read-only Erkundungsspezialisierung der UIA.
#
# Grund: die Spawn-Matrix (`harw-agent-dsl/src/roles.rs::can_spawn`) laesst
# die UIA (`AgentRoleId::UserInterface`) ausschliesslich
# `RootOrchestrator`/`UiaWorker`/`AgentSteward` spawnen — niemals den
# regulaeren `Worker`. Die UIA-Werkzeuge `explore`/`research_web` spawnen
# intern aber `explorer`/`researcher-web`, beide `role = "worker"`, und
# scheitern deshalb mit "no delegation capability is available for this
# request", sobald die UIA sie aufruft. Diese Rolle behebt das: dieselbe
# read-only Werkzeugoberflaeche wie `explorer` plus `researcher-web`
# zusammen (`fs.read/list/search/glob/grep` plus `web.fetch`), aber unter
# der fuer die UIA bereits zugelassenen Organisationsrolle
# `role = "uia-worker"` (`AgentRoleId::UiaWorker`) statt `role = "worker"`.
#
# Die Matrix selbst bleibt unveraendert — das ist Absicht, nicht der Bug.
#
# ── Werkzeugoberflaeche ─────────────────────────────────────────────────────
# `RegistryProfile::UiaExplorer` (`harw-registry-defaults/src/profile.rs`):
# der lesende fs.*-Kern plus `doc.read_pdf`, `explore.*` und
# `web.fetch`/`web.search` — kein `fs.write`, kein `shell.exec`, kein
# `deps.*`, kein `lens.ask`, kein `browser.*`.
#
# ── Rueckgabevertrag ─────────────────────────────────────────────────────
# `harwness.return.research-finding@1`: belegte Funde statt Rohausgaben —
# derselbe Vertrag wie `explorer`.

schema = "harwness.agent/v1"
id = "harwness.agent.uia-explorer@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "uia-worker"
specialization = "uia-explorer"

name = "UIA Explorer"
description = "Read-only Erkundung von Workspace und Netz fuer die UIA, unter der zugelassenen Organisationsrolle uia-worker."

[work]
mode = "read-only-exploration"
may_write_code = false
may_research_web = true

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "web.fetch",
  "explore.tree",
  "explore.projects",
  "explore.relations",
  "explore.find",
  "web.search",
  # Lesende Wissenswerkzeuge (Plan Teil D, Entscheidung der Nutzerin
  # „Agenten dürfen Workbench, Palace und Diary lesen“): nur lesend,
  # `ReadWorkspace`. Die Composition-Root montiert sie, sobald ein
  # Wissensspeicher existiert — siehe
  # `harw_registry_defaults::profile::knowledge_tools_for_role`. Kanban
  # bleibt der UIA-Wurzel und dem Root-Orchestrator vorbehalten.
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
  # Runde 5, Teil M: Zwischenstand (info) oder Frage (question) an den direkten
  # Elternteil; nur Text, keine Rechte (siehe
  # `harw_registry_defaults::profile::parent_message_tools_for_role`).
  "parent.message",
]
forbidden = [
  "fs.write",
  "fs.edit",
  "shell.exec",
  "web.docs_rs",
  "web.crates_io",
  "deps.graph",
  "deps.locked",
  "deps.source_read",
  "deps.source_search",
  "deps.source_list",
  "lens.ask",
]

[spawn]
max_depth = 0

[spawn.budget]
max_tokens = 60000
max_tool_calls = 40
max_wall_secs = 180

[return]
contract = "harwness.return.research-finding@1"
