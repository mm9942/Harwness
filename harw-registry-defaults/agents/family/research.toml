# Eingebaute Research-Family (§14 DSL-Spec) — der Rollenvorrat des Clans
# `research` der eingebauten Default-Organisation.
#
# Format nach `harw_agent_dsl::family::RawFamilyDefinition`: `schema`, `id`,
# `version` und `name` sind Pflichtfelder; `orchestrators`, `workers`,
# `defaults`, `invariants`, `extends` und `patch` sind optional.
#
# WICHTIG — TOML-Reihenfolge: `invariants` ist ein Feld der Wurzel-Tabelle und
# muss deshalb *vor* der ersten Tabellenüberschrift stehen. Nach `[workers]`
# geschrieben würde es zu `workers.invariants` und beim Deserialisieren
# abgelehnt (`FamilyRoster` trägt `deny_unknown_fields`).
#
# Die Roster nennen ausschließlich Rollen, die als eingebettete Agentendefinition
# in `harw-registry-defaults/agents/` existieren und in
# `harw_registry_defaults::profile::role_names::ALL` stehen. Der Test
# `test_research_family_lists_exactly_the_read_only_research_roles` hält die
# Liste an diese Konstanten gebunden — ein Tippfehler wird zum Testfehler, nicht
# zu einer stillschweigend unbekannten Rolle.

schema = "harwness.family/v1"
id = "harwness.family.research@1"
version = "1.0.0"
name = "Harwness Research Family"

# Familienweite Invarianten. Jede ist an den eingebetteten Rollen nachprüfbar:
#   * `workers_are_read_only` — alle fünf Worker führen `fs.write` und
#     `shell.exec` ausdrücklich in `forbidden`.
#   * `children_never_pause` — `worker-base.toml` setzt `allow_pause = false`;
#     ein read-only Kind hat keinen Kanal für eine Freigabe.
#   * `findings_carry_sources` — alle fünf Worker geben
#     `harwness.return.research-finding@1` zurück, also belegte Funde.
invariants = [
  "workers_are_read_only",
  "children_never_pause",
  "findings_carry_sources",
]

# `research-orchestrator` ist der eingebaute Child-Orchestrator
# (`role = "child-orchestrator"`) und Leader des Research-Clans der
# Default-Organisation. `analyst` bleibt als verdichtender Worker mit
# `max_depth = 2` zugelassen (Rückwärtskompatibilität für lokale
# Organisationen, die ihn als Leader nennen).
[orchestrators]
allowed = ["harwness.agent.research-orchestrator@1", "harwness.agent.analyst@1"]

# Die fünf read-only Rechercheure:
#   * `explorer` liest Workspace, Projektstruktur, Dokumente und lokal
#     vorhandene Abhängigkeitsquellen; bei Bedarf `web.search`/`web.fetch`.
#   * `researcher` recherchiert allgemeine Themen aus Web, Workspace-Dokumenten
#     und PDFs (`web.search`/`web.fetch`).
#   * `dependency-researcher` belegt Abhängigkeiten ökosystem-neutral aus
#     Manifesten, Lockfiles und den offiziellen Paket-Registries
#     (`web.search`/`web.fetch`).
#   * `researcher-deps` ist der Rust/Cargo-Spezialist: `Cargo.lock` und der
#     lokale Registry-Quellcache, ohne Netz.
#   * `researcher-web` führt alle vier `web.*`-Werkzeuge, liest dafür aber
#     keinerlei Workspace-Daten.
# Netzzugang haben damit vier der fünf Worker, nicht nur `researcher-web`;
# jeder Abruf bleibt an die Egress-Policy und die Host-Allowlist der Sandbox
# gebunden, und das Netz eines Kindes ist nie breiter als das seiner Eltern.
[workers]
allowed = [
  "harwness.agent.explorer@1",
  "harwness.agent.researcher@1",
  "harwness.agent.dependency-researcher@1",
  "harwness.agent.researcher-deps@1",
  "harwness.agent.researcher-web@1",
]

# Familienweite Vorgaben. `return_contract` ist hier keine Wiederholung, sondern
# die gemeinsame Zusage: alle fünf Worker liefern denselben Vertrag, ein
# Konsument muss die Rückgabe also nicht je Rolle unterscheiden.
[defaults]
return_contract = "harwness.return.research-finding@1"
