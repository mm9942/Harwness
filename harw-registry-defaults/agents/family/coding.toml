# Eingebaute Coding-Family (§14 DSL-Spec) — der Rollenvorrat des Clans `coding`
# der eingebauten Default-Organisation.
#
# ══════════════════════════════════════════════════════════════════════════════
# Seit Slice B7: `executor` ist die erste eingebaute Rolle mit Schreib-/
# Ausführungsrechten — es gibt aber weiterhin keine eingebaute Rolle, die
# selbst Code ENTWIRFT.
# ══════════════════════════════════════════════════════════════════════════════
# `harw_registry_defaults::profile::role_names::ALL` enthält heute zehn Rollen,
# darunter die fünf ursprünglichen `explorer`, `researcher-deps`,
# `researcher-web`, `planner`, `analyst` — alle fünf read-only: jede führt
# `fs.write` und `shell.exec` in `forbidden`, und `planner`/`explorer`/
# `analyst` tragen zusätzlich `may_write_code = false` in ihrer eigenen
# Definition. `executor` ist die ausdrückliche, dokumentierte Ausnahme
# (`RegistryProfile::Full`, siehe `agents/executor.toml` und
# `harw-registry-defaults/src/profile.rs::profile_for_role`): er admittiert
# `fs.write`/`shell.exec` und führt damit Befehls- und Dateioperationen im
# Auftrag des Haupt-Agenten aus — er trifft dabei aber keine eigene
# Entwurfsentscheidung, sondern führt bereits entschiedene Operationen aus und
# liefert eine Zusammenfassung statt Rohausgaben zurück.
#
# Dieses Roster nennt deshalb sowohl die Rollen, die die Coding-Spur heute
# *vorbereiten*, als auch die eine Rolle, die Befehls-/Dateioperationen für sie
# *ausführt*: `planner` erzeugt den Planvorschlag, aus dem Coding-Knoten
# entstehen, `explorer` belegt den Ist-Zustand des Codes, den ein Coding-Knoten
# verändern soll, `executor` führt die vom Haupt-Agenten beschlossenen
# Befehlsfolgen aus, damit im Hauptfenster nur eine kompakte Fortschrittszeile
# erscheint statt vieler einzelner Tool-Aufrufe. Sobald eine weitere
# schreibende Rolle in `role_names` aufgenommen wird, gehört ihre
# `harwness.agent.<rolle>@1`-ID ebenfalls hierher — und der Test
# `test_coding_family_lists_only_roles_that_exist_in_role_names` bricht nicht,
# weil er gegen `role_names::ALL` prüft, nicht gegen eine feste Liste.
#
# Frei erfundene IDs stehen hier bewusst *nicht*: eine Family, die eine
# nicht existierende Rolle erlaubt, verspricht eine Fähigkeit, die die Runtime
# beim Spawn nicht einlösen kann.
#
# Der Haupt-Agent verliert durch `executor` nichts: er behält alle eigenen
# Werkzeugrechte unverändert und delegiert nur optional — `transfer_to_executor`
# kommt als zusätzliche Möglichkeit hinzu, ersetzt keine bestehende.
#
# TOML-Reihenfolge wie in `research.toml`: `invariants` steht vor der ersten
# Tabellenüberschrift, sonst landet es in `[orchestrators]`.

schema = "harwness.family/v1"
id = "harwness.family.coding@1"
version = "1.0.0"
name = "Harwness Coding Family"

# Familienweite Invarianten:
#   * `disjoint_write_sets` — die Zelle des Coding-Clans fährt
#     `write_partition = "required"`; zwei Kinder derselben Welle dürfen
#     niemals denselben Pfad schreiben.
#   * `children_never_pause` — `worker-base.toml` setzt `allow_pause = false`.
#   * `plan_is_authoritative` — `planner.toml` trägt `may_change_plan = false`:
#     ein Kind schlägt vor, der autoritative Plan wird nur vom Orchestrator
#     mutiert.
invariants = [
  "disjoint_write_sets",
  "children_never_pause",
  "plan_is_authoritative",
]

# `coding-orchestrator` (`role = "child-orchestrator"`) führt die Coding-Spur
# der Default-Organisation. `planner` bleibt zusätzlich zugelassen
# (Rückwärtskompatibilität für lokale Organisationen, die ihn als Leader
# nennen) — als Worker delegiert er selbst jedoch nicht.
[orchestrators]
allowed = ["harwness.agent.coding-orchestrator@1", "harwness.agent.planner@1"]

# `planner` und `explorer` sind read-only Rollen. Sie sind hier, weil sie die
# Coding-Spur vorbereiten — nicht, weil sie Code schreiben. `executor` ist die
# einzige schreibende Rolle im Roster (siehe Kopfkommentar): sie ist hier,
# damit der Haupt-Agent `transfer_to_executor` anbieten und Befehlsfolgen an
# sie delegieren kann, statt sie selbst als viele einzelne Tool-Aufrufe im
# Hauptfenster zu zeigen.
[workers]
allowed = [
  "harwness.agent.planner@1",
  "harwness.agent.explorer@1",
  "harwness.agent.executor@1",
]

# `write_partition` wiederholt hier die Politik der Zelle als Familien-Vorgabe:
# eine Zelle, die diese Familie benutzt, darf sie verschärfen, aber nicht
# lockern.
[defaults]
write_partition = "required"
return_contract = "harwness.return.plan-proposal@1"
