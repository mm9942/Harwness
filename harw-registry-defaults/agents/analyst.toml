# Eingebauter Analyse-Worker (AP W3-04) — Registry-Profil `ReadOnlyExplore`.
#
# Orchestrator-naher Worker: er darf eine Ebene tiefer delegieren als die
# uebrigen eingebauten Rollen (`max_depth = 2`), bleibt aber selbst read-only
# und ohne Netzzugang.

schema = "harwness.agent/v1"
id = "harwness.agent.analyst@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "analyst"

name = "Analyst"
description = "Verdichtet die Funde read-only arbeitender Kinder zu einer belegten Gesamtaussage."

[work]
mode = "analysis"
may_write_code = false
may_research_web = false
aggregates_child_returns = true

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "deps.graph",
  "deps.locked",
  "deps.source_read",
  "deps.source_search",
  "deps.source_list",
  "explore.tree",
  "explore.projects",
  "explore.relations",
  "explore.find",
  # Lesende Wissenswerkzeuge (Plan Teil D, Entscheidung der Nutzerin
  # „Agenten dürfen Workbench, Palace und Diary lesen“): nur lesend,
  # `ReadWorkspace`. Die Composition-Root montiert sie, sobald ein
  # Wissensspeicher existiert — siehe
  # `harw_registry_defaults::profile::knowledge_tools_for_role`. Kanban
  # bleibt der UIA-Wurzel und dem Root-Orchestrator vorbehalten.
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
  # Runde 5, Teil M: Zwischenstand (info) oder Frage (question) an den direkten
  # Elternteil; nur Text, keine Rechte (siehe
  # `harw_registry_defaults::profile::parent_message_tools_for_role`).
  "parent.message",
  # Plan R9, Teil A: Skills nur über den Katalog finden und laden
  # (`harw_registry_defaults::profile::skill_catalog_tools_for_role`).
  "skills.search",
  "skills.load",
]
# `ReadOnlyExplore` registriert zusaetzlich `web.fetch`/`web.search` fuer den
# `explorer` (Nutzerentscheidung "der Explorer durchsucht auch das Internet").
# Diese Rolle bleibt ohne Netz und verbietet beide deshalb ausdruecklich.
forbidden = [
  "fs.write",
  "fs.edit",
  "shell.exec",
  "web.fetch",
  "web.search",
  "web.docs_rs",
  "web.crates_io",
]

# Einzige eingebaute Rolle mit `max_depth = 2`: der Analyst darf read-only
# Kinder starten und deren Rueckgaben zusammenfuehren.
[spawn]
max_depth = 2

[spawn.budget]
max_tokens = 120000
max_tool_calls = 64
max_wall_secs = 600

[return]
contract = "harwness.return.research-finding@1"

# Kontextprogramm (Runde 3, Welle C2): bindet `agents/context-programs/review.toml`.
# `embedded_agents::bind_context_program` liest diese Zeile aus der eigenen
# Tabelle der Rolle (die Aufloesung verwirft das `[context]` des Kindes, weil
# `worker-base` eines fuehrt) und ergaenzt das geerbte `[context]` um das
# Programm. Ein unbekannter Name bricht das Laden der Rolle hart ab.
[context]
program = "review"
