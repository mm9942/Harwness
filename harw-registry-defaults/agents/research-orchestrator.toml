# Eingebauter Child-Orchestrator der Recherche-Spur (Sub-Orchestrator, Plan
# Punkt 1; `agent-definition-dsl.md` §11.1, `docs/design/
# delegation-capabilities.md`).
#
# Führt den Clan `research` der Default-Organisation (Zelle `research-wave`,
# `fanout`/`all-terminal`): startet read-only Rechercheure nebeneinander und
# verdichtet deren belegte Funde zu EINER ReturnEnvelope an den
# Root-Orchestrator. Die eigentliche Verdichtung eines Einzelthemas kann er an
# `analyst` delegieren.
#
# ── Rechte ──────────────────────────────────────────────────────────────────
# Werkzeugoberfläche wie `root-orchestrator` (`RegistryProfile::Planning`,
# read-only, KEIN eigenes `web.*`) plus `delegate_wave` (Composition-Root,
# siehe `profile::composition_tools_for_role`).
#
# Reducer `ReadExplore` statt `ReadRegistry` (siehe
# `authority::authority_reducer_for_role`): dieser Orchestrator startet
# `researcher-web`/`researcher`/`dependency-researcher`, und deren Sandbox ist
# immer eine Teilmenge SEINER Sandbox. Ohne `NetworkAccess` im eigenen
# Rechtesatz bekämen seine Netz-Rechercheure nie Netz. Er selbst führt kein
# Netz-Werkzeug (`web.*` in `forbidden`, `Planning` registriert keins) — das
# Recht ist reine, egress-gebundene Durchreichung.
#
# ── Tiefe / Budget ──────────────────────────────────────────────────────────
# `max_depth = 1` (nur Worker darunter); Budget unter dem des
# `root-orchestrator` (monoton).

schema = "harwness.agent/v1"
id = "harwness.agent.research-orchestrator@1"
version = "1.0.0"
role = "child-orchestrator"
specialization = "research-orchestrator"

name = "Research Orchestrator"
description = "Fächert einen Recherche-Teilauftrag auf read-only Rechercheure auf, prüft deren belegte Funde und liefert dem Root-Orchestrator eine verdichtete ReturnEnvelope."

[work]
mode = "orchestration"
may_change_plan = false
may_write_code = false
may_research_web = false
aggregates_child_returns = true

[lifecycle]
allow_pause = false
allow_rerun = true
max_attempts = 4  # erster Lauf + 3 Fortsetzungen (MAX_CONTINUATIONS)

[context]
# Kontextprogramm (Runde 3, Welle C2): `agents/context-programs/orchestrate.toml`;
# die Selektoren darunter ergaenzen es (siehe `embedded_agents::bind_context_program`).
program = "orchestrate"
must_include = ["task.objective", "task.read_scope", "new.trigger_return"]
exclude = ["full_parent_transcript", "sibling_transcripts"]

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "deps.graph",
  "deps.locked",
  "deps.source_read",
  "deps.source_search",
  "deps.source_list",
  "lens.ask",
  # Obsidian vault reads (registered by RegistryProfile::Planning): the
  # project's long-form memory (`docs/planning` vault) is mapped and read
  # alongside the workspace. Write (`obsidian.write`) stays out of planning
  # roles — it is registered only for the Full (coding agent) profile.
  "obsidian.map",
  "obsidian.read",
  "obsidian.search",
  "obsidian.links",
  "explore.tree",
  "explore.projects",
  "explore.relations",
  "explore.find",
  "delegate_wave",
  # Runde 5, Teil H: ungekürzter Antworttext eines eigenen, abgeschlossenen
  # Kindes (rein lesend, auto-freigegeben; die Composition-Root steuert es bei,
  # siehe `harw_registry_defaults::profile::child_result_tools_for_role`).
  "agent.result",
  # Lesende Wissenswerkzeuge (Plan Teil D, Entscheidung der Nutzerin
  # „Agenten dürfen Workbench, Palace und Diary lesen“): nur lesend,
  # `ReadWorkspace`. Die Composition-Root montiert sie, sobald ein
  # Wissensspeicher existiert — siehe
  # `harw_registry_defaults::profile::knowledge_tools_for_role`. Kanban
  # bleibt der UIA-Wurzel und dem Root-Orchestrator vorbehalten.
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
  # Runde 5, Teil M: Nachricht an ein eigenes, laufendes Kind (Kurskorrektur
  # oder Antwort auf seine Frage; die Composition-Root steuert es bei, siehe
  # `harw_registry_defaults::profile::child_message_tools_for_role`).
  "agent.message",
  # Runde 5, Teil M: Zwischenstand (info) oder Frage (question) an den direkten
  # Elternteil; nur Text, keine Rechte (siehe
  # `harw_registry_defaults::profile::parent_message_tools_for_role`).
  "parent.message",
  # Plan R9, Teil A: Skills nur über den Katalog finden und laden
  # (`harw_registry_defaults::profile::skill_catalog_tools_for_role`).
  "skills.search",
  "skills.load",
  # Plan R9, Teil F: Jobs der eigenen Worker verfolgen und stoppen (kein
  # `job.start`; siehe `harw_registry_defaults::profile::job_control_tools_for_role`).
  "job.status",
  "job.logs",
  "job.stop",
  "job.list",
]
forbidden = ["fs.write", "fs.edit", "shell.exec", "web.fetch", "web.search", "web.docs_rs", "web.crates_io"]

# Zugelassene Delegationsziele (siehe `coding-orchestrator.toml`).
[delegation]
targets = [
  "explorer",
  "researcher",
  "researcher-deps",
  "dependency-researcher",
  "researcher-web",
  "analyst",
]

[spawn]
max_depth = 1
child_orchestrators = []

# Plan R9, Teil C: der Verbrauch der Nachkommen wird angerechnet (siehe
# `root-orchestrator.toml`); die Deckel bleiben unter denen des Roots.
[spawn.budget]
max_tokens = 1000000
max_tool_calls = 400
max_wall_secs = 7200

[return]
contract = "harwness.return.envelope@1"
