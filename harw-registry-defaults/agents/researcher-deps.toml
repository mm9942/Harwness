# Eingebauter Rust/Cargo-Dependency-Spezialist (AP W3-04) — Registry-Profil
# `ReadOnlyExplore`.
#
# Beantwortet "wie funktioniert diese Rust/Cargo-Abhaengigkeit wirklich" aus
# `Cargo.lock` und dem lokal bereits entpackten Registry-Quellcode — nicht aus
# dem Gedaechtnis des Modells. Die Rolle ist bewusst der **Rust-Spezialist**:
# fuer npm/pnpm/yarn, PyPI/uv/poetry, Go-Module, Maven/Gradle (oder eine
# Frage, die nicht an einem Cargo-Projekt haengt) ist
# `dependency-researcher` zustaendig (`harw-ops/src/research.rs` waehlt
# zwischen beiden).
#
# docs.rs/crates.io: `web.docs_rs`/`web.crates_io` waeren die passenden
# Netz-Werkzeuge, aber diese Rolle bleibt (wie bisher) ohne Netz — ihr Profil
# `ReadOnlyExplore` registriert die beiden Crate-Werkzeuge nicht und ihr
# Reducer `ReadRegistry` traegt kein `NetworkAccess`. docs.rs/crates.io
# werden deshalb ueber `researcher-web` bzw. die UIA-Helfer abgefragt; diese
# Rolle liest die lokal gespiegelten Quellen derselben Crates.

schema = "harwness.agent/v1"
id = "harwness.agent.researcher-deps@1"
version = "1.0.0"
extends = { id = "harwness.agent.worker-base@1" }
role = "worker"
specialization = "researcher-deps"

name = "Rust/Cargo Dependency Researcher"
description = "Rust-Spezialist fuer Rust/Cargo-Abhaengigkeiten, offline: belegt Version, MSRV, Features und Verhalten je Crate aus Cargo.lock und dem lokalen Registry-Quellcache, ohne Netzzugang (docs.rs/crates.io fragt researcher-web ab). Andere Oekosysteme uebernimmt dependency-researcher."

[research]
ecosystems = ["cargo"]
sources = ["source-tree", "lockfiles", "local-docs"]
primary_sources_required = true
output = "structured-evidence"
may_write_code = false

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "deps.graph",
  "deps.locked",
  "deps.source_read",
  "deps.source_search",
  "deps.source_list",
  "explore.tree",
  "explore.projects",
  "explore.relations",
  "explore.find",
  # Lesende Wissenswerkzeuge (Plan Teil D, Entscheidung der Nutzerin
  # „Agenten dürfen Workbench, Palace und Diary lesen“): nur lesend,
  # `ReadWorkspace`. Die Composition-Root montiert sie, sobald ein
  # Wissensspeicher existiert — siehe
  # `harw_registry_defaults::profile::knowledge_tools_for_role`. Kanban
  # bleibt der UIA-Wurzel und dem Root-Orchestrator vorbehalten.
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
]
# `ReadOnlyExplore` registriert zusaetzlich `web.fetch`/`web.search` fuer den
# `explorer` (Nutzerentscheidung "der Explorer durchsucht auch das Internet").
# Diese Rolle bleibt ohne Netz und verbietet beide deshalb ausdruecklich.
forbidden = [
  "fs.write",
  "shell.exec",
  "web.fetch",
  "web.search",
  "web.docs_rs",
  "web.crates_io",
]

[spawn]
max_depth = 1

[spawn.budget]
max_tokens = 60000
max_tool_calls = 40
max_wall_secs = 180

[return]
contract = "harwness.return.research-finding@1"

# Kontextprogramm (Runde 3, Welle C2): bindet `agents/context-programs/research-deps.toml`.
# `embedded_agents::bind_context_program` liest diese Zeile aus der eigenen
# Tabelle der Rolle (die Aufloesung verwirft das `[context]` des Kindes, weil
# `worker-base` eines fuehrt) und ergaenzt das geerbte `[context]` um das
# Programm. Ein unbekannter Name bricht das Laden der Rolle hart ab.
[context]
program = "research-deps"
