# Eingebauter Root-Orchestrator: die UIA kann ihn als echten Agentenbaum-Root
# starten. Er plant und delegiert, schreibt aber selbst keinen Code.

schema = "harwness.agent/v1"
id = "harwness.agent.root-orchestrator@1"
version = "1.0.0"
role = "root-orchestrator"
specialization = "root-orchestrator"

name = "Root Orchestrator"
description = "Koordiniert Child-Orchestrators und Worker, sammelt deren Ergebnisse und liefert der UIA eine belastbare Zusammenfassung."

[work]
mode = "orchestration"
may_change_plan = false
may_write_code = false
may_research_web = false
aggregates_child_returns = true

[lifecycle]
allow_pause = false
allow_rerun = true
max_attempts = 4  # erster Lauf + 3 Fortsetzungen (MAX_CONTINUATIONS)

[context]
# Kontextprogramm (Runde 3, Welle C2): `agents/context-programs/orchestrate.toml`;
# die Selektoren darunter ergaenzen es (siehe `embedded_agents::bind_context_program`).
program = "orchestrate"
must_include = ["task.objective", "task.read_scope", "new.trigger_return"]
exclude = ["full_parent_transcript", "sibling_transcripts"]

[tools]
admitted = [
  "fs.read",
  "fs.list",
  "fs.search",
  "fs.glob",
  "fs.grep",
  "doc.read_pdf",
  "deps.graph",
  "deps.locked",
  "deps.source_read",
  "deps.source_search",
  "deps.source_list",
  "lens.ask",
  "explore.tree",
  "explore.projects",
  "explore.relations",
  "explore.find",
  # `delegate_wave` (Plan Punkt 1): Fan-out-Werkzeug der Orchestrator-
  # Sitzungen. Die Composition-Root steuert es bei
  # (`harw-core-bridge::delegate_wave`), nicht dieses Crate — siehe
  # `harw_registry_defaults::profile::composition_tools_for_role`.
  "delegate_wave",
  # Runde 5, Teil H: ungekürzter Antworttext eines eigenen, abgeschlossenen
  # Kindes (rein lesend, auto-freigegeben; die Composition-Root steuert es bei,
  # siehe `harw_registry_defaults::profile::child_result_tools_for_role`).
  "agent.result",
  # Lesende Wissenswerkzeuge (Plan Teil D, Entscheidung der Nutzerin
  # „Agenten dürfen Workbench, Palace und Diary lesen“): nur lesend,
  # `ReadWorkspace`. Die Composition-Root montiert sie, sobald ein
  # Wissensspeicher existiert — siehe
  # `harw_registry_defaults::profile::knowledge_tools_for_role`.
  "workbench.show",
  "diary.read",
  "palace.search",
  "palace.recall",
  # Kanban lesen (Plan D2) — nur UIA-Wurzel und Root-Orchestrator, nicht
  # auto-freigegeben (jeder Aufruf fragt), und nur auf ausdrücklichen
  # Wunsch der Nutzerin: nie von selbst Aufgaben aufs Board legen oder
  # daraus ableiten.
  "kanban.list",
  "kanban.show",
  # Runde 5, Teil M: Nachricht an ein eigenes, laufendes Kind (Kurskorrektur
  # oder Antwort auf seine Frage; die Composition-Root steuert es bei, siehe
  # `harw_registry_defaults::profile::child_message_tools_for_role`).
  "agent.message",
  # Runde 5, Teil M: Zwischenstand (info) oder Frage (question) an den direkten
  # Elternteil; nur Text, keine Rechte (siehe
  # `harw_registry_defaults::profile::parent_message_tools_for_role`).
  "parent.message",
  # Plan R9, Teil A: Skills nur über den Katalog finden und laden
  # (`harw_registry_defaults::profile::skill_catalog_tools_for_role`).
  "skills.search",
  "skills.load",
  # Plan R9, Teil F: Jobs der eigenen Worker verfolgen und stoppen (kein
  # `job.start`; siehe `harw_registry_defaults::profile::job_control_tools_for_role`).
  "job.status",
  "job.logs",
  "job.stop",
  "job.list",
  "job.wait",
]
forbidden = ["fs.write", "fs.edit", "shell.exec", "web.fetch", "web.search", "web.docs_rs", "web.crates_io"]

# Zugelassene Delegationsziele für `delegate_wave`
# (`harw_registry_defaults::authority::delegation_targets_for_role`): eine
# zusätzliche Schnittmenge zur Laufzeit-Sichtbarkeit
# (`delegation_visibility`), nie eine Erweiterung. `agent-steward` fehlt
# bewusst: eine Definitionsänderung ist kein Fan-out-Auftrag, er bleibt über
# `transfer_to_agent-steward` erreichbar.
[delegation]
targets = [
  "coding-orchestrator",
  "research-orchestrator",
  "analysis-orchestrator",
  "explorer",
  "researcher",
  "researcher-deps",
  "dependency-researcher",
  "researcher-web",
  "planner",
  "analyst",
  "executor",
]

# `child_orchestrators` ist die exakte, namentliche Freigabeliste
# (`delegation-capabilities.md`, „Rekursive Sub-Orchestrierung“): nur diese
# drei eingebauten Child-Orchestratoren darf der Root starten. Jeder trägt
# selbst `max_depth = 1` und eine leere eigene Freigabeliste — unter ihnen
# entstehen ausschließlich Worker.
[spawn]
max_depth = 2
child_orchestrators = [
  "coding-orchestrator",
  "research-orchestrator",
  "analysis-orchestrator",
]

# Plan R9, Teil C: der Verbrauch aller Nachkommen wird dem Orchestrator
# angerechnet (`ManagedAgentSpawner::charge_run_usage`, Wanduhr summiert über
# parallele Kinder). Seit Delegation mitten im Turn wirklich funktioniert,
# reichten 120k/80/3600 s nicht für eine einzige größere Welle; die Deckel
# folgen deshalb dem Matrix-Game-Master (ebenfalls ein Elternteil vieler
# Kinder). Die eigene Turn-Disziplin (Abschluss-Anweisung ab 80 %) bleibt.
[spawn.budget]
max_tokens = 1500000
max_tool_calls = 600
# Runde 5, Teil O: Orchestratoren arbeiten länger als Worker; die Lease
# (15 min) ist davon getrennt und wird per Herzschlag verlängert, solange das
# Kind arbeitet.
max_wall_secs = 14400

[return]
contract = "harwness.return.execution-summary@1"
