[package]
publish.workspace = true
name = "harw-registry-defaults"
description = "Shared coding-agent ExtensionRegistry assembly for consistent tool surface across CLI, TUI, and echo paths"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tracing = "0.1"
harw-authority = { path = "../harw-authority" }
harw-home = { path = "../harw-home" }
harw-agent-dsl = { path = "../harw-agent-dsl" }
# `compiler_defaults`: implements `harw_agent_compiler::builtins::BuiltinDefaults`
# (built-in definitions, capability catalog, generic ceilings). A → C; the
# compiler depends on this crate only as a dev-dependency (its tests).
harw-agent-compiler = { path = "../harw-agent-compiler" }
harw-catalog = { path = "../harw-catalog" }
# `[network]` section (`NetworkSection::researcher_web_hosts`) as the single
# source of the network scope of the `researcher-web` role (W5 RD, assumption
# A5), plus the unparsed agent definitions (`ResolvedConfig::agent_sources`)
# that `config_agents` parses and lowers (harw-config, layer I, does not know
# the DSL).
harw-config = { path = "../harw-config" }
# `EgressPolicy` for the web tools of the `researcher-web` role (W5 RD).
harw-egress = { path = "../harw-egress" }
harw-extension-api = { path = "../harw-extension-api" }
harw-instructions = { path = "../harw-instructions" }
harw-project-discovery = { path = "../harw-project-discovery" }
# `Permission`/`PermissionSet`/`NetworkScope`: permission ceilings of the
# built-in roles and tool filtering by granted permissions (W5 RD).
harw-sandbox = { path = "../harw-sandbox" }
harw-tool-deps = { path = "../harw-tool-deps" }
harw-tool-explorer = { path = "../harw-tool-explorer" }
harw-tool-process = { path = "../harw-tool-process" }
# `doc.read_pdf` (wiring W3): read-only PDF tool, appears everywhere a
# read-only `FsToolProvider` is registered (see `profile::DOC_TOOLS`).
harw-tool-doc = { version = "0.9.1", path = "../harw-tool-doc" }
harw-tool-fs = { path = "../harw-tool-fs" }
harw-tool-lens = { path = "../harw-tool-lens" }
harw-tool-shell = { path = "../harw-tool-shell" }
# Plan R9, part F: `job.*` (background jobs instead of tmux) alongside
# `shell.exec`, with a cloned `ShellToolProvider` (same permissions,
# approvals, host lease).
harw-tool-job = { path = "../harw-tool-job" }
# Round 5, part F: names and permission class of the plan tools (`plan.*`,
# `ask_user`) for `authority::tool_permission` and the default policy.
# No cycle: `harw-tool-plan` does not depend on this crate.
harw-tool-plan = { path = "../harw-tool-plan" }
harw-tool-web = { path = "../harw-tool-web" }
harw-browser = { path = "../harw-browser", optional = true }
harw-browser-thirtyfour = { path = "../harw-browser-thirtyfour", optional = true }
harw-tool-browser = { path = "../harw-tool-browser", optional = true }
# Directory embedding for `embedded_agents`: embeds the tree under `agents/`
# at build time, so that the inventory of built-in definitions follows the
# file system instead of a hand-maintained `include_str!` list (AW6-00). A
# fixed list would have pointed five later nodes in three waves at the same
# Rust file, even though their definitions already sit independently side by
# side as TOML files.
include_dir = { workspace = true }
# Timestamps for the resolution traces of the built-in agent definitions:
# `harw_agent_dsl::resolve::resolve_definition` requires a
# `time::OffsetDateTime`. The version line is deliberately identical to
# harw-agent-dsl/Cargo.toml, so that the workspace has only one `time`
# resolution.
time = "0.3.53"
# The embedded family and organization definitions are parsed here:
# `harw-agent-dsl` offers only a parser for agent definitions in
# `parse::parse_toml` and does not re-export `toml`. The version line is
# deliberately identical to harw-agent-dsl/Cargo.toml, so that the workspace
# has only one `toml` resolution.
toml = "1.1.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
harw-tools = { version = "0.9.1", path = "../harw-tools" }
# `workbench.note`/`workbench.hypothesis` (`workbench_tools.rs`) write through
# `harw_knowledge::workbench` into the session scope. No cycle:
# `harw-knowledge` does not depend (even transitively) on `harw-registry-defaults`.
harw-knowledge = { path = "../harw-knowledge" }
# Timestamps of the workbench entries (`harw_knowledge::workbench` dates in `jiff`).
jiff = { workspace = true }
# `agents.build` starts `harw agent build` as a job; `harw_tool_job::PreparedJob`
# takes a `tokio::process::Command`.
tokio = { version = "1", features = ["process"] }

[features]
# Opt-in surface for the Harwness browser tool set (`browser.open`,
# `browser.observe`, `browser.find`, `browser.act`, `browser.wait`,
# `browser.events`, `browser.close`). Disabled by default so the standard
# binary stays lean and never links the WebDriver/thirtyfour adapter.
# Enabling it does not require a running WebDriver: `FirefoxHost::new`
# constructs the host without starting any process; the driver is only
# started lazily on the first `browser.open` dispatch, at which point a
# missing WebDriver surfaces as a normal tool execution error rather than
# breaking default startup.
browser = ["dep:harw-browser", "dep:harw-tool-browser", "dep:harw-browser-thirtyfour"]

[lints]
workspace = true

[dev-dependencies]
# Tests only: the approval rules in `DefaultApprovalPolicy::review` receive
# their tool arguments as `serde_json::Value`.
serde_json = { workspace = true }
# Tests only: `SessionId`/`TurnId`/`TenantId`/`WorkspaceId` for building a
# real `harw_tools::ToolExecutionContext` in the end-to-end tests of the
# `_and_permits` assembly (see `profile.rs::tests`).
harw-types = { path = "../harw-types" }
# Tests only: temporary workspace roots for `WorkspaceRegistry::build` in the
# same tests.
tempfile = { workspace = true }
# Tests only: `ShellExecutor`'s bwrap execution runs under `tokio`. The
# version line is deliberately identical to harw-tool-shell/Cargo.toml, so
# that the workspace has only one `tokio` resolution.
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros"] }
