[package]
name = "harw-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
harw-types = { path = "../harw-types" }
# `ApprovalRequest`/`ApprovalResponse` (src/approvals.rs) tragen
# `requested_at`/`timeout_at`/`decided_at` als `jiff::Timestamp` — dieselbe
# Wanduhr-Darstellung wie überall sonst im Harness (C-APPR, F-122).
jiff = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
