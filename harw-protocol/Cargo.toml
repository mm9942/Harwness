[package]
publish.workspace = true
name = "harw-protocol"
description = "Protocol wire envelopes and event/item types, no runtime dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-types = { path = "../harw-types" }
# `ApprovalRequest`/`ApprovalResponse` (src/approvals.rs) tragen
# `requested_at`/`timeout_at`/`decided_at` als `jiff::Timestamp` — dieselbe
# Wanduhr-Darstellung wie überall sonst im Harness (C-APPR, F-122).
jiff = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
harw-test-support = { path = "../harw-test-support" }

[lints]
workspace = true
