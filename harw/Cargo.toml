[package]
publish.workspace = true
name = "harw"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HARW SDK facade — the single crate external users depend on."

# `cargo_metadata` wurde entfernt (Befund G-080): `harw/tests/version_coherence.rs`
# rief darüber einen `cargo metadata`-Subprozess auf, der in der sandboxten
# Remediation-Umgebung nicht erlaubt ist und den Test dauerhaft rot machte.
# Der Test parst seither die Workspace- und Mitglieds-Manifeste sowie
# `Cargo.lock` selbst mit dem `toml`-Crate (bereits über
# `[workspace.dependencies]` gepinnt, siehe Wurzel-`Cargo.toml`).
[dev-dependencies]
harw-test-support = { path = "../harw-test-support" }
time = "0.3.45"
tokio = { version = "1.52.4", features = ["rt", "macros", "sync"] }
toml = { workspace = true }

[dependencies]
harw-extension-api = { path = "../harw-extension-api" }
harw-operations = { path = "../harw-operations" }
harw-ops = { path = "../harw-ops" }
harw-agent-dsl = { path = "../harw-agent-dsl" }
harw-core = { path = "../harw-core" }
harw-provider = { path = "../harw-provider" }
harw-model-catalog = { path = "../harw-model-catalog" }
harw-registry-defaults = { path = "../harw-registry-defaults" }
harw-types = { path = "../harw-types" }
harw-plan = { path = "../harw-plan" }
harw-plan-bridge = { path = "../harw-plan-bridge" }
harw-research = { path = "../harw-research" }
harw-code-graph = { path = "../harw-code-graph" }
harw-sandbox = { path = "../harw-sandbox" }
harw-authority = { path = "../harw-authority" }

[lints]
workspace = true
