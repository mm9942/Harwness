[package]
publish.workspace = true
name = "harw-agent-dsl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.5"
harw-context = { path = "../harw-context" }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
# Canonical serialization of `AgentIr` for the v7 snapshot hash
# (`ir_v2::AgentIr::canonical_json`); same version line as the workspace.
serde_json = "1.0.150"
time = { version = "0.3.53", features = ["serde-well-known", "formatting", "parsing"] }
toml = "1.1.3"

[dev-dependencies]

[lints]
workspace = true
