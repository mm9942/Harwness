[package]
publish.workspace = true
name = "harw-tool-job"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Built-in job system for long-running processes (job.start/status/logs/stop/list/wait) instead of tmux: logs under <state>/jobs/<id>/, progress detection and throttled notifications to the owning agent."

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-extension-api = { path = "../harw-extension-api" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
# The same rights/approval path as `shell.exec` (sandbox/host lease/permit,
# sudo ban, rlimits): `ShellToolProvider::prepare_background_launch`.
harw-tool-shell = { path = "../harw-tool-shell" }
jiff = { workspace = true }
# Signals to the whole process group (`kill(-pgid, …)`) without `unsafe`/libc.
rustix = { workspace = true, features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros", "sync"] }
tracing = "0.1"

# Linux process identity and control (Job-Runtime-Doc §2.1, §15, §25):
# pidfd for our own children, `procfs`-based `LinuxRecoveryIdentity` for jobs
# of earlier sessions. Replaces the former hand-written `/proc/<pid>/stat`
# parser. `harw-job-core` only for `RunnerId`/`AttemptId` of that identity.
[target.'cfg(target_os = "linux")'.dependencies]
harw-job-core = { path = "../harw-job-core" }
harw-job-linux = { path = "../harw-job-linux" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros", "sync"] }

[lints]
workspace = true
