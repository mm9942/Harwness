[package]
publish.workspace = true
name = "harw-tool-job"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Eingebautes Job-System für lang laufende Prozesse (job.start/status/logs/stop/list/wait) statt tmux: Logs unter <state>/jobs/<id>/, Fortschrittserkennung und gedrosselte Meldungen an den besitzenden Agenten."

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-extension-api = { path = "../harw-extension-api" }
harw-macros = { path = "../harw-macros" }
harw-tools = { path = "../harw-tools" }
harw-types = { path = "../harw-types" }
# Derselbe Rechte-/Freigabeweg wie `shell.exec` (Sandbox/Host-Lease/Permit,
# sudo-Verbot, rlimits): `ShellToolProvider::prepare_background_launch`.
harw-tool-shell = { path = "../harw-tool-shell" }
jiff = { workspace = true }
# Signale an die ganze Prozessgruppe (`kill(-pgid, …)`) ohne `unsafe`/libc.
rustix = { workspace = true, features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros", "sync"] }
tracing = "0.1"

# Linux process identity and control (Job-Runtime-Doc §2.1, §15, §25):
# pidfd for our own children, `procfs`-based `LinuxRecoveryIdentity` for jobs
# of earlier sessions. Replaces the former hand-written `/proc/<pid>/stat`
# parser. `harw-job-core` only for `RunnerId`/`AttemptId` of that identity.
[target.'cfg(target_os = "linux")'.dependencies]
harw-job-core = { path = "../harw-job-core" }
harw-job-linux = { path = "../harw-job-linux" }

[dev-dependencies]
harw-test-support = { path = "../harw-test-support" }
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros", "sync"] }

[lints]
workspace = true
