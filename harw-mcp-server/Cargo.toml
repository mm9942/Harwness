[package]
publish.workspace = true
name = "harw-mcp-server"
description = "Inbound Streamable HTTP MCP authority for Harwness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
harw-job-core = { path = "../harw-job-core" }
harw-session-store = { path = "../harw-session-store" }
harw-types = { path = "../harw-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { workspace = true }
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "io-util", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http-body-util = { version = "0.1", features = ["channel"] }
bytes = "1"

[dev-dependencies]
harw-test-support = { path = "../harw-test-support" }
tempfile = "3"

[lints]
workspace = true
