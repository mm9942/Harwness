[package]
publish.workspace = true
name = "harw-tool-explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Agent-Werkzeuge explore.tree/explore.projects/explore.relations/explore.find über harw-explorer."

[dependencies]
harw-authority = { path = "../harw-authority" }
harw-explorer = { path = "../harw-explorer" }
harw-extension-api = { path = "../harw-extension-api" }
harw-macros = { path = "../harw-macros" }
harw-sandbox = { path = "../harw-sandbox" }
harw-tools = { path = "../harw-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
harw-types = { path = "../harw-types" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
