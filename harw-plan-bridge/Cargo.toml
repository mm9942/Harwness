[package]
publish.workspace = true
name = "harw-plan-bridge"
description = "Bridge between goals, plans, findings and jobs: translates research to evidence, proposes plan refinements, coordinates verification."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Prozessübergreifende Workspace-Sperre der Verifikation (`verify_exec.rs`).
fs4 = { workspace = true }
harw-authority = { path = "../harw-authority" }
harw-plan = { path = "../harw-plan" }
harw-research = { path = "../harw-research" }
harw-operations = { path = "../harw-operations" }
harw-extension-api = { path = "../harw-extension-api" }
harw-job-runtime = { path = "../harw-job-runtime" }
# PL-90 W02: durable intent-cycle records (`cycle_runtime.rs`) über die
# generische, gefencte Speichermechanik und den Lease-Token des Job-Modells.
harw-job-core = { path = "../harw-job-core" }
harw-job-store = { path = "../harw-job-store" }
# PL-90 W03: read-only explorer executor (`cycle_explorer.rs`) reads through
# the workspace-bound `Scope` (no symlink escape, secret-path denylist).
harw-tool-fsread = { path = "../harw-tool-fsread" }
harw-session-store = { path = "../harw-session-store" }
harw-knowledge = { path = "../harw-knowledge" }
harw-home = { path = "../harw-home" }
harw-types = { path = "../harw-types" }
harw-macros = { path = "../harw-macros" }
harw-observe = { path = "../harw-observe" }
harw-agent-dsl = { path = "../harw-agent-dsl" }
harw-core = { path = "../harw-core" }
# AW3-03: Quellenbindung `PlanContextProvider` (harw_context::Fragment) und
# die Registry-Prüfung für v2-Fragment-Provider (fragment_registry). Kein
# Zyklus: `harw-context` hängt nur von harw-types/harw-lens-types/harw-macros
# ab, keines davon kennt harw-plan-bridge.
harw-context = { path = "../harw-context" }
harw-lens-types = { path = "../harw-lens-types" }
# AW6-04: Plan-Andockung für Sicherheitsbefunde. Seit PL-100 WP 3.0
# (Leitprinzip I8) bewusst weder `harw-dod-escalate` noch die
# Eskalationsleiter `harw-dod-ladder`: dieses Crate liegt in modellnahen
# Prozessen (harw-runtime, harw-ops, harw-cli, harw), und
# `xtask/arch-policy.toml` verbietet ihnen beide. Die Andockung braucht nur
# die Frage „rechtfertigt der Befund überhaupt eine Stufe" und prüft sie
# selbst über `Finding<Triaged>`/`FindingKind`/`Verdict` aus `harw-dod-rules`
# (ohne Features: `test-support` darf nur aus Dev-Abhängigkeiten kommen,
# xtask-Gate `operator-decision`, Regel (d)); ein Test pinnt die Gleichheit
# mit `Ladder::stage_for` (Leiter nur unter `[dev-dependencies]`, siehe
# `security_bridge`-Moduldoku). `harw-dod-signals` liefert `SecurityEvidence`,
# deren `digest`-Feld strukturell nie fehlt (siehe `security_bridge`-Moduldoku).
harw-dod-rules = { path = "../harw-dod/crates/harw-dod-rules" }
harw-dod-signals = { path = "../harw-dod/crates/harw-dod-signals" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Zwei Zeitbibliotheken sind hier unvermeidbar, nicht versehentlich:
# `harw-plan` (Plan/Goal/Evidence) rechnet in `time::OffsetDateTime`,
# `harw-research` / `harw-job-runtime` (Findings, Jobs) in `jiff::Timestamp`.
# Dieses Crate ist genau die Naht zwischen beiden und konvertiert an einer
# einzigen Stelle (`finding_store::offset_from_timestamp`).
time = { version = "0.3.53", features = ["serde", "serde-well-known", "formatting", "parsing"] }
jiff = { workspace = true }
tracing = "0.1.44"
# PL-90 W02: blockierende Store-Zugriffe des Cycle-Drivers laufen über
# `spawn_blocking`, Abschlusssignal für `ExecutionControl` über `watch`.
# PL-90 W03: `time` für den begrenzten Retry-Backoff des Modell-Proposers.
tokio = { version = "1.53.0", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
harw-test-support = { path = "../harw-test-support" }
tempfile = "3.27.0"
# Nur für Tests: schaltet `triaged_finding_for_test` frei — die Tests bauen
# über `EgressFlowRule` ein echtes `Finding<Triaged>`, genau wie
# `harw-dod-escalate` und `harw-dod-ladder` es in ihren eigenen Tests tun,
# statt einen privaten Konstruktor zu umgehen. Das Feature `test-support`
# steht nur hier, nie unter `[dependencies]` (xtask-Gate `operator-decision`,
# Regel (d)); wegen `resolver = "2"` ist es nur für Testziele aktiv.
harw-dod-rules = { path = "../harw-dod/crates/harw-dod-rules", features = ["test-support"] }
# Nur für Tests (PL-100 WP 3.0, I8): der Gleichheitstest der Andockbedingung
# gegen `Ladder::stage_for`. Nie unter `[dependencies]`: modellnahe Prozesse
# linken die Leiter nicht (xtask-Gate `arch`, `[[forbidden_crates]]`;
# Dev-Abhängigkeiten zählen dort nicht).
harw-dod-ladder = { path = "../harw-dod/crates/harw-dod-ladder" }
harw-sandbox = { path = "../harw-sandbox" }
tokio = { version = "1.53.0", features = ["rt", "macros", "sync", "time"] }

[lints]
workspace = true
