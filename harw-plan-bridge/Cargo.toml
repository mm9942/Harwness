[package]
publish.workspace = true
name = "harw-plan-bridge"
description = "Bridge between goals, plans, findings and jobs: translates research to evidence, proposes plan refinements, coordinates verification."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Cross-process workspace lock for verification (`verify_exec.rs`).
fs4 = { workspace = true }
harw-authority = { path = "../harw-authority" }
harw-plan = { path = "../harw-plan" }
harw-research = { path = "../harw-research" }
harw-operations = { path = "../harw-operations" }
harw-extension-api = { path = "../harw-extension-api" }
harw-job-runtime = { path = "../harw-job-runtime" }
harw-session-store = { path = "../harw-session-store" }
harw-knowledge = { path = "../harw-knowledge" }
harw-home = { path = "../harw-home" }
harw-types = { path = "../harw-types" }
harw-macros = { path = "../harw-macros" }
harw-observe = { path = "../harw-observe" }
harw-agent-dsl = { path = "../harw-agent-dsl" }
harw-core = { path = "../harw-core" }
# AW3-03: source binding `PlanContextProvider` (harw_context::Fragment) and
# the registry check for v2 fragment providers (fragment_registry). No
# cycle: `harw-context` depends only on harw-types/harw-lens-types/harw-macros,
# none of which knows harw-plan-bridge.
harw-context = { path = "../harw-context" }
harw-lens-types = { path = "../harw-lens-types" }
# AW6-04: plan docking for security findings. `harw-dod-escalate`
# re-exports `Finding<Triaged>`/`Triaged`/`Ladder` — this crate pulls
# the edge to `harw-dod-escalate`, never the reverse (its module docs,
# section "Docking for harw-plan-bridge"). `harw-dod-signals` provides
# `SecurityEvidence`, whose `digest` field is structurally never missing (see
# the `security_bridge` module docs).
harw-dod-escalate = { path = "../dod/crates/harw-dod-escalate" }
harw-dod-signals = { path = "../dod/crates/harw-dod-signals" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Two time libraries are unavoidable here, not accidental:
# `harw-plan` (Plan/Goal/Evidence) computes in `time::OffsetDateTime`,
# `harw-research` / `harw-job-runtime` (findings, jobs) in `jiff::Timestamp`.
# This crate is exactly the seam between the two and converts in a
# single place (`finding_store::offset_from_timestamp`).
time = { version = "0.3.53", features = ["serde", "serde-well-known", "formatting", "parsing"] }
jiff = { workspace = true }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
# Tests only: builds a real `Finding<Triaged>` via `EgressFlowRule`,
# just as `harw-dod-escalate` itself does in its own tests — instead of
# bypassing a private constructor. `harw-dod-rules` is therefore not a
# normal dependency of this crate: the production code only names
# `Finding<Triaged>`, re-exported from `harw-dod-escalate`.
harw-dod-rules = { path = "../dod/crates/harw-dod-rules", features = ["test-support"] }
harw-sandbox = { path = "../harw-sandbox" }

[lints]
workspace = true
